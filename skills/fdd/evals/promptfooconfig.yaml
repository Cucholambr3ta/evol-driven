# Evaluación de «fdd» con promptfoo (skill evaluar-skill).
#   cd skills/fdd/evals
#   export EVOL_EVAL_API_KEY=$(cat ~/.local/state/omarchy/local-ai/gateway.key)
#   PROMPTFOO_DISABLE_TELEMETRY=1 promptfoo eval -c promptfooconfig.yaml
# El modelo es el local (sin red hacia fuera); la lista de skills del enrutador se mantiene
# igual que las descripciones de skills/*/SKILL.md (una prueba lo comprueba).
description: Evaluación de fdd
providers:
  - id: openai:chat:Qwen3.5-9B-exl3-22ef1303
    config:
      apiBaseUrl: http://127.0.0.1:12434/v1
      apiKeyEnvar: EVOL_EVAL_API_KEY
      temperature: 0
      max_tokens: 700
      passthrough:
        chat_template_kwargs:
          enable_thinking: false
prompts:
  - label: enrutador
    raw: |
      Eres el enrutador de skills de un agente. Estas son las skills disponibles, cada una con su descripción:

      - revisar-secretos: Busca secretos (claves, tokens, contraseñas) en el código antes de dar por cerrada una tarea. Úsala al terminar cada tarea de código en build y en qa, o cuando alguien pregunte si se coló una clave. No muestra nunca el valor encontrado.
      - incorporar-dependencia: Decide si se puede añadir o actualizar una dependencia (npm, PyPI u otra) y deja la justificación escrita. Úsala en plan y en build cada vez que aparezca un paquete nuevo o una subida de versión. Revisa necesidad, versión fija, vulnerabilidades, paquetes maliciosos, licencia y mantenimiento.
      - incorporar-skill: Guía el proceso de agregar una skill nueva a la biblioteca de evol. Úsala cuando alguien pida instalar, importar o probar una skill de terceros o propia. Ejecuta la auditoría, explica el veredicto en claro y ayuda a declarar las capacidades de sus scripts. Nunca aprueba: la aprobación es de una persona.
      - evaluar-skill: Comprueba que una skill se activa cuando debe, no se activa cuando no debe y resiste instrucciones inyectadas. Úsala al crear o cambiar una skill y siempre antes de auditarla. Escribe casos de prueba y los ejecuta con promptfoo.
      - secdd: Cierra la fase de QA con el escaneo de seguridad: ejecuta evol security scan --ci, explica los hallazgos abiertos por severidad y no da el visto bueno mientras quede un CRITICAL o HIGH sin resolver. Úsala en qa o cuando pregunten si el proyecto está listo en seguridad. No muestra nunca el valor de un secreto.
      - stdd: Escribe primero las pruebas de seguridad y después el código. Úsala al empezar una tarea de build que toca entradas externas, autenticación, permisos, datos sensibles o dependencias, y cuando haya que convertir una mitigación de THREATS.md en una prueba. Si el proyecto tiene OpenAPI propone pruebas por propiedades con schemathesis.
      - threat: Construye el modelo de amenazas del proyecto con STRIDE en la fase spec: activos, fronteras de confianza, amenazas y, por cada amenaza, su control y la prueba que lo comprueba. Úsala al redactar o revisar docs/specs/THREATS.md.
      - sdd: Escribe y mantiene la especificación del proyecto (docs/specs/SPEC.md) con criterios de aceptación numerados CA-1, CA-2… que una prueba pueda comprobar. Úsala al empezar un proyecto o una funcionalidad, al cambiar el alcance y siempre que haga falta decidir si algo está terminado.
      - fdd: Descompone el proyecto en features con prioridad en docs/features/FEATURES.md, cada una nombrada por el valor que da a una persona. Úsala en briefing y plan, cuando haya que listar, ordenar o recortar lo que se va a construir.
      - ddd: Modela el dominio en docs/specs/DOMAIN.md: entidades, sus relaciones y las reglas de negocio, con el lenguaje de quien usa el sistema. Úsala en spec, al introducir un concepto nuevo o cuando dos personas llaman distinto a lo mismo.
      - bdd: Escribe escenarios Dado/Cuando/Entonces en tests/features/*.feature para cada feature, etiquetados con el criterio CA-n que cubren. Úsala en briefing para acordar el comportamiento esperado y en qa para comprobar que cada feature tiene al menos un escenario.
      - atdd: Escribe las pruebas de aceptación (tests/acceptance/*.acceptance.test.ts), una por criterio CA-n, antes de construir, probadas por la puerta pública del sistema (línea de comandos, API o pantalla), de modo que la persona reconozca «esto es lo que pedí». Úsala en briefing para fijar cuándo se da algo por entregado, en qa para ejecutarlas y cuando una prueba de aceptación nunca falla o no se sabe qué comprueba.
      - tdd: Construye con ciclos rojo-verde-refactor: una prueba unitaria que falla (tests/unit/*.test.ts), el código mínimo que la pasa y después la limpieza. Úsala en build siempre que escribas, cambies o refactorices lógica, o corrijas un fallo.

      Decide qué skill se usa para la petición. Responde solo con el nombre exacto de la skill, o con la palabra ninguna si no aplica ninguna.

      Petición: {{peticion}}
  - label: skill
    raw: '[{"role":"system","content":{{ skill | dump }}},{"role":"user","content":{{ mensaje | dump }}}]'
defaultTest:
  vars:
    skill: file://../SKILL.md
tests: file://casos.yaml
