ompatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/debt-budget"},"archivos":[{"ruta":"SKILL.md","bytes":4628}],"bytes":4628,"huella":"7a31c7a2da3b6c4a","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (72 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-debt-budget","enlace":false}],"proyectos":[],"texto":"\n# evol-debt-budget\n\n## Fase del Pipeline\n\n**Plan (Fase 3) — Planificación y Presupuesto**\n\nActivar cuando se necesita gestionar deuda técnica:\n- Inventario de deuda técnica\n- Priorización (impacto vs esfuerzo)\n- Plan de remediación\n- Presupuesto de deuda por sprint\n\n## Artefacto Clave\n\n**`docs/plan/DEBT_BUDGET.md`**\n\n```markdown\n# Tech Debt Budget\n\n## Debt Inventory\n| ID | Category | Severity | Effort | Impact | File(s) |\n|----|----------|----------|--------|--------|---------|\n| TD-001 | Architecture | High | 5d | High | src/legacy/ |\n| TD-002 | Dependencies | Medium | 2d | Medium | package.json |\n| TD-003 | Code Quality | Low | 1d | Low | src/utils/ |\n\n## Sprint Budget\n| Sprint | Capacity | Allocated | Remaining |\n|--------|----------|-----------|-----------|\n| Sprint 12 | 40h | 12h (30%) | 28h |\n| Sprint 13 | 40h | 8h (20%) | 32h |\n\n## Remediation Plan\n| Quarter | Target Debt | Est. Hours | Owner |\n|---------|-------------|------------|-------|\n| Q3 2026 | TD-001, TD-002 | 40h | Team A |\n| Q4 2026 | TD-003, TD-004 | 20h | Team B |\n\n## Debt Trends\n- Total debt: 45h → 38h (↓16%)\n- New debt added: 8h\n- Debt resolved: 15h\n```\n\n## Flujo de Trabajo\n\n```bash\n# 1. Descubrir deuda técnica\npython3 scripts/debt/discover.py \\\n  --source . \\\n  --output docs/plan/DEBT_RAW.md\n\n# 2. Clasificar deuda\npython3 scripts/debt/classify.py \\\n  --input docs/plan/DEBT_RAW.md \\\n  --output docs/plan/DEBT_CLASSIFIED.md\n\n# 3. Priorizar por impacto\npython3 scripts/debt/prioritize.py \\\n  --input docs/plan/DEBT_CLASSIFIED.md \\\n  --output docs/plan/DEBT_PRIORITIZED.md\n\n# 4. Generar presupuesto\npython3 scripts/debt/budget.py \\\n  --input docs/plan/DEBT_PRIORITIZED.md \\\n  --capacity 40h \\\n  --ratio 0.25 \\\n  --output docs/plan/DEBT_BUDGET.md\n\n# 5. Generar plan de remediación\npython3 scripts/debt/remediation-plan.py \\\n  --input docs/plan/DEBT_PRIORITIZED.md \\\n  --output docs/plan/REMEDIATION_PLAN.md\n\n# 6. Reporte de tendencias\npython3 scripts/debt/trends.py \\\n  --history docs/plan/DEBT_HISTORY.json \\\n  --output docs/plan/DEBT_TRENDS.md\n```\n\n### Debt Classification\n\n```\nCategories: Architecture, Dependencies, Code Quality, Testing, Documentation\nSeverity: Critical (blocks features), High (impacts velocity), Medium (technical risk), Low (cosmetic)\n```\n\n## Integración con Pipeline\n\n| Fase | Gate | Check | Automático |\n|------|------|-------|------------|\n| Briefing | Debt awareness | Deuda conocida identificada | No |\n| Spec | Debt impact | Impacto en diseño evaluado | No |\n| Plan | Debt budget | Presupuesto definido (20-30%) | Sí |\n| Build | Debt tracking | Deuda nueva registrada | Sí |\n| QA | Debt validation | Deuda remediada verificada | Sí |\n| Retro | Debt trends | Tendencias actualizadas | No |\n\n## Referencia\n\n- **Constitución Art. 8** — Estándares de ingeniería\n- **Constitución Art. 9** — Fase Plan del Pipeline\n- **Discipline Doc** — `docs/disciplines/DebtBudgetDD.md`\n- **Martin Fowler Tech Debt** — https://martinfowler.com/bliki/TechnicalDebt.html\n- **Tech Debt Quadrant** — https://martinfowler.com/bliki/TechnicalDebtQuadrant.html\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"DebtBudgetDD","nombre":"Tech Debt Budgeting","tipo":"extendida","fases":["plan"]},"enBiblioteca":false},{"id":"evol-deprecation-7c1fbf","nombre":"evol-deprecation","carpeta":"evol-deprecation","descripcion":"DeprecationDD — Deprecation timelines, migration guides, breaking changes","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/deprecation"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/deprecation"},"archivos":[{"ruta":"SKILL.md","bytes":4931}],"bytes":4931,"huella":"5fd5cf116f9d0112","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (73 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-deprecation","enlace":false}],"proyectos":[],"texto":"\n# evol-deprecation\n\n## Fase del Pipeline\n\n**Plan (Fase 3) — Planificación y Presupuesto**\n\nActivar cuando se necesita gestionar deprecaciones:\n- Deprecation timelines\n- Migration guides\n- Breaking changes management\n- Backward compatibility planning\n\n## Artefacto Clave\n\n**`docs/plan/DEPRECATION_PLAN.md`**\n\n```markdown\n# Deprecation Plan\n\n## Active Deprecations\n| Component | Deprecated In | Remove In | Replacement | Status |\n|-----------|---------------|-----------|-------------|--------|\n| /api/v1/users | v2.3.0 | v3.0.0 | /api/v2/users | Migration 80% |\n| legacy-auth | v2.4.0 | v3.0.0 | oauth2 | In Progress |\n\n## Breaking Changes Timeline\n| Version | Breaking Changes | Migration Effort |\n|---------|------------------|------------------|\n| v3.0.0 | 5 endpoints removed, 2 renamed | Medium |\n| v3.1.0 | Config format change | Low |\n\n## Migration Guides\n| From | To | Guide | Status |\n|------|-----|-------|--------|\n| /api/v1/* | /api/v2/* | docs/migration/v1-to-v2.md | Complete |\n| basic-auth | oauth2 | docs/migration/auth.md | Draft |\n\n## Breaking Changes Checklist\n- [ ] CHANGELOG updated\n- [ ] Migration guide published\n- [ ] Deprecation warnings in code\n- [ ] Support window communicated\n- [ ] Monitoring for usage of deprecated APIs\n```\n\n## Flujo de Trabajo\n\n```bash\n# 1. Detectar deprecaciones pendientes\npython3 scripts/deprecation/detect.py \\\n  --source . \\\n  --output docs/plan/DEPRECATION_CANDIDATES.md\n\n# 2. Analizar usage de APIs deprecated\npython3 scripts/deprecation/analyze-usage.py \\\n  --apis docs/plan/DEPRECATION_CANDIDATES.md \\\n  --logs /var/log/api-access.log \\\n  --output docs/plan/USAGE_REPORT.md\n\n# 3. Generar timeline\npython3 scripts/deprecation/generate-timeline.py \\\n  --candidates docs/plan/DEPRECATION_CANDIDATES.md \\\n  --output docs/plan/DEPRECATION_PLAN.md\n\n# 4. Crear migration guides\npython3 scripts/deprecation/migration-guide.py \\\n  --from-version 2.x \\\n  --to-version 3.0 \\\n  --output docs/migration/v2-to-v3.md\n\n# 5. Agregar deprecation warnings\npython3 scripts/deprecation/add-warnings.py \\\n  --source src/ \\\n  --deprecations docs/plan/DEPRECATION_PLAN.md\n\n# 6. Validar backward compatibility\npython3 scripts/deprecation/validate-compat.py \\\n  --source src/ \\\n  --output docs/plan/COMPAT_REPORT.md\n```\n\n### Deprecation Warning Pattern\n\n```python\nimport warnings\n\ndef deprecated_endpoint():\n    warnings.warn(\n        \"This endpoint is deprecated since v2.3.0. \"\n        \"Use /api/v2/users instead. \"\n        \"Will be removed in v3.0.0.\",\n        DeprecationWarning,\n        stacklevel=2\n    )\n```\n\n## Integración con Pipeline\n\n| Fase | Gate | Check | Automático |\n|------|------|-------|------------|\n| Briefing | Deprecation awareness | Componentes deprecated conocidos | No |\n| Spec | Deprecation design | Nuevos componentes no deprecated | Sí |\n| Plan | Deprecation plan | Timeline documentado | Sí |\n| Build | Warning injection | Deprecation warnings activos | Sí |\n| QA | Migration tested | Migration guides validados | Sí |\n| Retro | Deprecation status | Uso de deprecated monitoreado | No |\n\n## Referencia\n\n- **Constitución Art. 8** — Estándares de ingeniería\n- **Constitución Art. 9** — Fase Plan del Pipeline\n- **Discipline Doc** — `docs/disciplines/DeprecationDD.md`\n- **Semantic Versioning** — https://semver.org/\n- **API Deprecation Best Practices** — https://blog.developer.atlassian.com/api-deprecation/\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"DeprecationDD","nombre":"Deprecation-Driven Development","tipo":"extendida","fases":["plan"]},"enBiblioteca":false},{"id":"evol-discovery-e8d92e","nombre":"evol-discovery","carpeta":"evol-discovery","descripcion":"User research con SPIN questioning, gap analysis y requirements gathering. Descubre qué necesita el usuario antes de construir.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/discovery"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/discovery"},"archivos":[{"ruta":"SKILL.md","bytes":5144}],"bytes":5144,"huella":"5b57c43ede0d973d","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (127 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-discovery","enlace":false}],"proyectos":[],"texto":"\n# evol-discovery\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita descubrir requisitos reales del usuario:\n\n- **SPIN questioning**: Situation, Problem, Implication, Need-payoff questions\n- **Gap analysis**: brecha entre estado actual y estado deseado\n- **Requirements gathering**: elicitar requisitos funcionales y no funcionales\n- **User interviews**: techniques para entrevistas efectivas\n- **Observation**: watch users work, no solo what they say\n- **Stakeholder mapping**: identificar quién decide, quién influye\n\n**No usar para**: validación de soluciones (usar evol-ux), testing de usabilidad (usar evol-qa).\n\n## Conocimiento de Dominio\n\n### SPIN Questioning\n- **Situation questions**: entender el contexto actual, facts\n- **Problem questions**: discover pains, dissatisfactions, difficulties\n- **Implication questions**: make problems feel urgent and important\n- **Need-payoff questions**: help them see value of solving the problem\n\n### Gap Analysis\n- **Current state**: cómo funciona hoy (processes, tools, pain points)\n- **Desired state**: cómo quiere funcionar (goals, aspirations)\n- **Gap**: distance between current and desired\n- **Root cause**: why the gap exists, not just symptoms\n\n### Requirements Gathering\n- **Functional requirements**: what the system should do\n- **Non-functional requirements**: performance, security, scalability\n- **Constraints**: budget, timeline, technology, regulations\n- **Assumptions**: things we believe but haven't validated\n- **Dependencies**: what we need from others\n\n### Interview Techniques\n- **Open-ended questions**: \"Tell me about...\" not \"Do you like...\"\n- **Active listening**: reflect, paraphrase, ask follow-ups\n- **Silence**: let them think, don't fill every pause\n- **Probing**: \"Why?\" \"Can you give an example?\" \"How often?\"\n- **Documenting**: take notes, record (with permission), transcribe\n\n### Stakeholder Mapping\n- **Decision makers**: who approves budget and scope\n- **Influencers**: who shapes opinions of decision makers\n- **Users**: who will actually use the solution\n- **Blocked**: who needs to be consulted or informed\n- **RACI matrix**: Responsible, Accountable, Consulted, Informed\n\n## Flujo de Trabajo\n\n1. **Identificar stakeholders**: who to talk to, who decides, who uses\n2. **Preparar entrevistas**: research context, prepare questions\n3. **Conducir entrevistas**: SPIN questioning, active listening, observation\n4. **Analizar findings**: patterns, themes, root causes\n5. **Mapear gaps**: current state → desired state → gap analysis\n6. **Documentar requirements**: functional, non-functional, constraints\n7. **Validar con stakeholders**: confirm understanding, resolve conflicts\n8. **Entregar brief**: resumen ejecutivo con key findings and recommendations\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: discovery es el input principal del briefing\n- **Spec (Fase 2)**: requirements se traducen en specs\n- **Plan (Fase 3)**: constraints y dependencies informan el plan\n- **Build (Fase 4)**: requirements son el source of truth\n- **QA (Fase 5)**: validation contra requirements originales\n- **Retro (Fase 6)**: evaluar si se cumplieron los objectives del discovery\n\n## Referencia\n\n- Constitución Evol-DD: Art. 5 (consultoría de dominio proactiva)\n- Agentes relacionados: evol-ux (user experience), evol-domain (domain knowledge), evol-pm (requirements management)\n- Neil Rackham - \"SPIN Selling\": the original SPIN framework\n- Marty Cagan - \"Inspired\": product discovery techniques\n- Teresa Torres - \"Continuous Discovery Habits\": ongoing discovery practices\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"descubrimiento","disciplina":null,"enBiblioteca":false},{"id":"evol-domain-finance-7190ea","nombre":"evol-domain-finance","carpeta":"evol-domain-finance","descripcion":"Asesor de dominio para construir software financiero y contable. Aporta conocimiento en GAAP/IFRS, cálculo de impuestos, reportes financieros y reconciliación.","categoria":"domain-advisor","origen":null,"licencia":null,"version":null,"triggers":["/domain-finance"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"domain-advisor","trigger":"/domain-finance"},"archivos":[{"ruta":"SKILL.md","bytes":5677}],"bytes":5677,"huella":"6427405e5923457d","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (159 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-domain-finance","enlace":false}],"proyectos":[],"texto":"\n# evol-domain-finance\n\n## Cuándo Usar\n\nActivar esta skill cuando el sistema Evol-DD necesita construir o auditar software en el dominio financiero y contable:\n\n- **Contabilidad y libros**: ledger doble entrada, chart of accounts, journal entries, balance sheet, income statement, cash flow\n- **Cálculo de impuestos**: IVA, ISR, retenciones, impuestos por jurisdicción, cálculos automáticos\n- **Reportes financieros**: estados financieros GAAP/IFRS, reportes fiscales, auditoría\n- **Reconciliación**: bancaria, entre cuentas, cross-system matching\n- **Pagos y transferencias**: ACH, wire transfers, SEPA, pagos recurrentes\n- **Presupuestos y forecasting**: budgeting, variance analysis, proyecciones\n- **Compliance**: SOX, anti-money laundering (AML), KYC\n\n**No usar para**: e-commerce y ventas (usar evol-domain-sales), analytics de marketing (usar evol-domain-marketing).\n\n## Conocimiento de Dominio\n\n### Contabilidad\n- **Double-entry bookkeeping**: cada transacción tiene debito y crédito, el balance siempre cuadra\n- **Chart of Accounts**: estructura jerárquica de cuentas (assets, liabilities, equity, revenue, expenses)\n- **Journal Entries**: asientos contables con débitos y créditos\n- **Accrual vs. Cash basis**: cuándo reconocer ingresos/gastos\n- **Close process**: monthly/quarterly/yearly close, adjusting entries\n\n### Impuestos\n- **IVA/VAT**: cálculo por jurisdicción, input vs. output tax, declaraciones\n- **ISR/Income Tax**: retenciones, pagos provisionales, declaración anual\n- ** withholding taxes**: retenciones en fuente, tratados tributarios\n- **Sales tax**: Nexus, economic nexus, marketplace facilitator laws\n\n### Estados Financieros\n- **Balance Sheet**: assets = liabilities + equity\n- **Income Statement**: revenue - expenses = net income\n- **Cash Flow Statement**: operating, investing, financing activities\n- **Equity Statement**: cambios en equity, retained earnings\n\n### Reconciliación\n- **Bank reconciliation**: matching entre ledger y estado bancario\n- **Inter-company reconciliation**: transacciones entre entidades\n- **Subledger reconciliation**: AP/AR subledgers vs. GL\n- **Automated matching**: rules-based, fuzzy matching, threshold-based\n\n### Compliance y Regulación\n- **SOX**: controles internos, segregación de duties, audit trail\n- **AML/KYC**: due diligence, suspicious activity reports\n- **IFRS vs. GAAP**: diferencias clave, convergencia\n- **Data retention**: requerimientos legales de retención de datos financieros\n\n## Flujo de Trabajo\n\n1. **Identificar el alcance financiero**: ¿Qué tipo de software? (contabilidad, pagos, reporting, compliance)\n2. **Mapear el modelo contable**: chart of accounts, reglas de negocio, monedas\n3. **Diseñar el ledger**: double-entry, audit trail, inmutabilidad de registros\n4. **Planificar cálculos de impuestos**: jurisdicciones, tasas, excepciones, edge cases\n5. **Definir reportes**: estados financieros, reportes fiscales, dashboards\n6. **Implementar reconciliación**: matching rules, manejo de diferencias, alertas\n7. **Testear con datos contables**: balance debe cuadrar siempre, edge cases de cierre\n8. **Verificar compliance**: audit trail, controles, segregación de duties\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: identificar necesidades contables y regulatorias del cliente\n- **Spec (Fase 2)**: documentar chart of accounts, reglas fiscales, requerimientos de compliance\n- **Plan (Fase 3)**: estimar complejidad contable, dependencias regulatorias\n- **Build (Fase 4)**: implementar con TDD, ledger inmutable, audit trail completo\n- **QA (Fase 5)**: testear balance cuadrado, reconciliación, edge cases de cierre\n- **Retro (Fase 6)**: revisar accuracy contable, identificar mejoras en automatización\n\n## Referencia\n\n- Constitución Evol-DD: Art. 5 (consultoría de dominio proactiva)\n- Art. 9: pipeline de 6 fases\n- Agentes relacionados: evol-domain (modelado de dominio), evol-sec (seguridad financiera), evol-auditor (auditoría)\n- FASB Accounting Standards: https://www.fasb.org\n- IFRS Foundation: https://www.ifrs.org\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"domain-advisor","grupo":"dominio","disciplina":null,"enBiblioteca":false},{"id":"evol-domain-marketing-9a353f","nombre":"evol-domain-marketing","carpeta":"evol-domain-marketing","descripcion":"Asesor de dominio para construir software de marketing y analytics. Aporta conocimiento en SEO, estrategia de contenido, funnels de conversión, A/B testing y analytics.","categoria":"domain-advisor","origen":null,"licencia":null,"version":null,"triggers":["/domain-marketing"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"domain-advisor","trigger":"/domain-marketing"},"archivos":[{"ruta":"SKILL.md","bytes":5840}],"bytes":5840,"huella":"e8c998e539208e5f","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (168 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-domain-marketing","enlace":false}],"proyectos":[],"texto":"\n# evol-domain-marketing\n\n## Cuándo Usar\n\nActivar esta skill cuando el sistema Evol-DD necesita construir o auditar software en el dominio de marketing y analytics:\n\n- **SEO y búsqueda**: keyword research, on-page SEO, technical SEO, link building, core web vitals\n- **Content strategy**: calendar editorial, content pillars, distribution channels, content scoring\n- **Conversion funnels**: funnel design, drop-off analysis, CRO (conversion rate optimization)\n- **A/B testing**: experiment design, statistical significance, feature flags, multivariate testing\n- **Analytics**: event tracking, attribution modeling, dashboards, cohort analysis\n- **Email marketing**: automation flows, segmentation, deliverability, personalization\n- **Social media**: scheduling, engagement tracking, sentiment analysis\n- **Paid advertising**: campaign management, bid strategies, ROAS optimization\n\n**No usar para**: e-commerce (usar evol-domain-sales), software contable (usar evol-domain-finance).\n\n## Conocimiento de Dominio\n\n### SEO\n- **On-page**: title tags, meta descriptions, heading structure, internal linking, schema markup\n- **Technical SEO**: crawlability, indexability, site speed, mobile-first, canonical tags\n- **Core Web Vitals**: LCP, FID/INP, CLS - métricas de experiencia\n- **Keyword research**: search intent, keyword difficulty, long-tail opportunities\n- **Link building**: strategies, toxicity analysis, disavow\n\n### Content Strategy\n- **Content pillars**: temas centrales, clusters de contenido\n- **Editorial calendar**: planificación, producción, distribución\n- **Content scoring**: evaluación de calidad, SEO optimization, readability\n- **Distribution**: owned, earned, paid channels\n- **Repurposing**: adaptar contenido a múltiples formatos y canales\n\n### Conversion Funnels\n- **TOFU/MOFU/BOFU**: awareness, consideration, decision stages\n- **Micro-conversions**: eventos que preceden a la conversión principal\n- **Drop-off analysis**: dónde se pierden usuarios, causas, fixes\n- **Landing page optimization**: above the fold, social proof, CTA design\n\n### A/B Testing\n- **Hypothesis-driven**: H0/H1, variables independientes, métricas de éxito\n- **Statistical significance**: p-value, confidence intervals, sample size\n- **Feature flags**: gradual rollouts, kill switches, percentage-based\n- **Multivariate testing**: testing múltiples variables simultáneamente\n\n### Analytics\n- **Event tracking**: event taxonomy, custom dimensions, user properties\n- **Attribution modeling**: last-click, linear, time-decay, data-driven\n- **Cohort analysis**: retention curves, behavioral cohorts\n- **Dashboards**: KPIs, metrics that matter, avoid vanity metrics\n\n## Flujo de Trabajo\n\n1. **Identificar objetivos de marketing**: ¿Qué se quiere lograr? (tráfico, leads, conversiones, retención)\n2. **Mapear el funnel actual**: customer journey, touchpoints, métricas actuales\n3. **Diseñar la estrategia SEO**: keyword research, technical audit, content plan\n4. **Planificar experiments**: hipótesis, métricas, duración, sample size\n5. **Implementar tracking**: event taxonomy, attribution, dashboards\n6. **Crear contenido**: content calendar, SEO optimization, distribution\n7. **Ejecutar y medir**: A/B tests, analyze results, iterate\n8. **Optimizar continuamente**: CRO, funnel improvements, personalization\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: identificar objetivos de marketing y KPIs\n- **Spec (Fase 2)**: documentar funnel, métricas, herramientas de analytics necesarias\n- **Plan (Fase 3)**: estimar esfuerzo de SEO, contenido, integraciones de analytics\n- **Build (Fase 4)**: implementar tracking, dashboards, herramientas de contenido\n- **QA (Fase 5)**: testear tracking de eventos, accuracy de analytics, funnel completo\n- **Retro (Fase 6)**: analizar métricas de marketing, identificar opportunities de optimización\n\n## Referencia\n\n- Constitución Evol-DD: Art. 5 (consultoría de dominio proactiva)\n- Art. 9: pipeline de 6 fases\n- Agentes relacionados: evol-ux (user research), evol-data (analytics pipelines), evol-doc (documentación de métricas)\n- Google Search Central: https://developers.google.com/search\n- CXL Institute: https://cxl.com/institute\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"domain-advisor","grupo":"dominio","disciplina":null,"enBiblioteca":false},{"id":"evol-domain-sales-7053e5","nombre":"evol-domain-sales","carpeta":"evol-domain-sales","descripcion":"Asesor de dominio para construir software de ventas, e-commerce y plataformas de transacción. Aporta conocimiento en checkout flows, integración de pagos, gestión de inventario y modelos de precios.","categoria":"domain-advisor","origen":null,"licencia":null,"version":null,"triggers":["/domain-sales"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"domain-advisor","trigger":"/domain-sales"},"archivos":[{"ruta":"SKILL.md","bytes":5803}],"bytes":5803,"huella":"07505223539183f6","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (198 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-domain-sales","enlace":false}],"proyectos":[],"texto":"\n# evol-domain-sales\n\n## Cuándo Usar\n\nActivar esta skill cuando el sistema Evol-DD necesita construir o auditar software en el dominio de ventas y e-commerce:\n\n- **Checkout y carrito de compras**: diseño de flujos de pago, persistencia de carrito, recuperación de carrito abandonado\n- **Integración de pagos**: pasarelas de pago (Stripe, PayPal, MercadoPago), suscripciones, reembolsos, disputas\n- **Gestión de inventario**: stock en tiempo real, reservas, alertas de stock bajo, multi-almacén\n- **Modelos de precios**: pricing dinámico, descuentos, cupones, precios por volumen, suscripciones escalonadas\n- **Órdenes y fulfillment**: estados de orden, logística, devoluciones, tracking\n- **Catálogo de productos**: búsqueda, filtros, variantes (talla/color), recomendar productos\n\n**No usar para**: software financiero contable (usar evol-domain-finance), analytics de marketing (usar evol-domain-marketing).\n\n## Conocimiento de Dominio\n\n### Checkout Flows\n- **Carrito → Checkout → Pago → Confirmación**: flujo estándar con puntos de abandono monitoreables\n- **Guest checkout vs. cuenta registrada**: trade-offs entre conversión y retención\n- **One-click checkout**: Amazon-style, requiere tokenización previa\n- **Checkout multinacional**: impuestos por jurisdicción, moneda local, métodos de pago regionales\n\n### Integración de Pagos\n- **Stripe**: Payments Intents API, webhook handling, 3D Secure, Link\n- **PayPal**: REST API, vault para suscripciones, buyer protection\n- **MercadoPago**: Tokenización, pagos en cuotas, split de pagos\n- **Cripto**: integración Lightning Network, stablecoins para cross-border\n- **PCI DSS**: nivel de compliance según volumen, tokenización, no almacenar PAN\n\n### Gestión de Inventario\n- **Stock tracking**: optimistic locking para evitar overselling\n- **Reservas**: TTL-based para carritos, liberación automática\n- **Multi-almacén**: fulfillment desde almacén más cercano\n- **Inventario digital**: licencias, keys, downloads\n\n### Modelos de Precios\n- **Flat rate, tiered, usage-based, freemium**: cuándo usar cada uno\n- **Descuentos**: porcentaje, monto fijo, BOGO, volumen\n- **Suscripciones**: monthly/annual, trials, pausas, cancelaciones\n- **Dynamic pricing**: demanda, estacionalidad, competencia (cuidado con backlash)\n\n### Seguridad y Fraude\n- **3D Secure**: frictionless vs. challenge flow\n- **Velocity checks**: transacciones por tiempo\n- **Device fingerprinting**: detección de fraude\n- **Chargebacks**: representment, evidence gathering\n\n## Flujo de Trabajo\n\n1. **Identificar el contexto de ventas**: ¿Qué se está vendiendo? (productos físicos, digitales, servicios, suscripciones)\n2. **Mapear el flujo de compra**: customer journey desde descubrimiento hasta post-compra\n3. **Diseñar la integración de pagos**: seleccionar proveedores, definir manejo de errores y edge cases\n4. **Planificar inventario**: modelo de stock, estrategia de reservas, alertas\n5. **Definir modelo de precios**: pricing strategy, descuentos, promociones\n6. **Implementar seguridad**: fraude, PCI compliance, datos sensibles\n7. **Testear con datos reales**: sandbox con tarjetas de prueba, edge cases de pago\n8. **Monitorear métricas**: conversión de checkout, tasa de abandono, error rate de pagos\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: identificar modelo de negocio y revenue streams\n- **Spec (Fase 2)**: documentar flujos de pago, reglas de negocio de precios, estados de orden\n- **Plan (Fase 3)**: estimar complejidad de integraciones de pago, dependencias de proveedores\n- **Build (Fase 4)**: implementar con TDD, usar sandbox para pagos\n- **QA (Fase 5)**: testear flujos de pago exitosos y fallidos, edge cases de inventario\n- **Retro (Fase 6)**: analizar métricas de conversión, identificar puntos de fricción\n\n## Referencia\n\n- Constitución Evol-DD: Art. 5 (consultoría de dominio proactiva)\n- Art. 9: pipeline de 6 fases\n- Agentes relacionados: evol-domain (modelado de dominio), evol-sec (seguridad de pagos), evol-qa (testeo de flujos)\n- Stripe Documentation: https://stripe.com/docs\n- PCI DSS Standard: https://www.pcisecuritystandards.org\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"domain-advisor","grupo":"dominio","disciplina":null,"enBiblioteca":false},{"id":"evol-dx-advocate-323083","nombre":"evol-dx-advocate","carpeta":"evol-dx-advocate","descripcion":"Developer experience advocate. Optimiza DX, construye comunidades y mejora el onboarding de developers.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/dx"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/dx"},"archivos":[{"ruta":"SKILL.md","bytes":5121}],"bytes":5121,"huella":"dacb2cb64b88e34f","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (103 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-dx-advocate","enlace":false}],"proyectos":[],"texto":"\n# evol-dx-advocate\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita mejorar la experiencia de desarrollo:\n\n- **DX optimization**: hacer que el framework/herramienta sea placer de usar\n- **Community building**: crear y mantener comunidad de developers\n- **Developer onboarding**: reducir time-to-first-contribution\n- **API design**: APIs que sean intuitivas y hard de usar mal\n- **Error messages**: errores claros, accionables, con links a docs\n- **Tooling**: CLIs, IDEs, debuggers que faciliten el trabajo\n\n**No usar para**: UX de usuarios finales (usar evol-ux), documentación técnica pura (usar evol-doc).\n\n## Conocimiento de Dominio\n\n### DX Principles\n- **Delight over efficiency**: el developer debe disfrutar usándolo\n- **Convention over configuration**: defaults sensibles, escape hatches cuando se necesite\n- **Progressive complexity**: empezar simple, complejizar cuando se necesite\n- **Fail fast, fail clear**: errores tempranos con mensajes claros\n\n### Community Building\n- **Contributing guide**: cómo contribuir, reglas claras\n- **Code of conduct**: ambiente seguro y inclusivo\n- **Issue templates**: facilitar reportes de bugs y features\n- **PR templates**: checklist para PRs\n- **Discussion forums**: GitHub Discussions, Discord, etc.\n- **Office hours**: tiempo regular para preguntas y feedback\n\n### Onboarding\n- **Time to first commit**: métrica clave de DX\n- **Quickstart guide**: de cero a funcionando en <5 min\n- **Interactive tutorials**: learn by doing, no solo reading\n- **Example projects**: starter templates, reference implementations\n- **Sandbox environments**: playgrounds donde experimentar sin riesgo\n\n### API Design\n- **Consistency**: naming conventions, patterns consistentes\n- **Discoverability**: APIs que se puedan descubrir IntelliSense\n- **Minimal surprise**: el comportamiento debe ser predecible\n- **Backward compatibility**: no romper contratos existentes\n- **Good defaults**: configuración que funcione sin configurar\n\n### Error Handling\n- **Error messages as documentation**: cada error es una mini-doc\n- **Actionable errors**: decir qué hacer, no solo qué pasó\n- **Context in errors**: incluir relevant context (file, line, value)\n- **Suggested fixes**: \"Did you mean...?\" patterns\n\n## Flujo de Trabajo\n\n1. **Evaluar DX actual**: time-to-first-commit, developer surveys, pain points\n2. **Identificar friction points**: dónde los developers se frustran\n3. **Mejorar onboarding**: quickstart, tutorials, examples\n4. **Optimizar APIs**: consistencia, discoverability, error messages\n5. **Construir comunidad**: contributing guide, templates, forums\n6. **Crear tooling**: CLIs, generators, scaffolding\n7. **Medir y iterar**: track DX metrics, collect feedback, improve\n8. **Documentar DX patterns**: playbooks para futuro\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: entender audiencia de developers, sus pain points\n- **Spec (Fase 2)**: documentar DX requirements, API design principles\n- **Plan (Fase 3)**: planificar community building, onboarding materials\n- **Build (Fase 4)**: implementar DX improvements, tooling, templates\n- **QA (Fase 5)**: testear con developer real, medir time-to-first-contribution\n- **Retro (Fase 6)**: analizar DX metrics, identificar próximas mejoras\n\n## Referencia\n\n- Constitución Evol-DD: Art. 4 (readabilidad, modularidad)\n- Agentes relacionados: evol-ux (user experience), evol-doc (documentación), evol-builder (implementation)\n- Kelsey Hightower - \"Developer Experience\" talks\n- Abigail Sine - \"Designing for Developer Experience\"\n- The DX Docs: https://thedocs.io\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"equipo","disciplina":null,"enBiblioteca":false},{"id":"evol-eda-b1d9b1","nombre":"evol-eda","carpeta":"evol-eda","descripcion":"EDA — Event-Driven Architecture, event choreography, saga patterns, event mesh design","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/eda"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/eda"},"archivos":[{"ruta":"SKILL.md","bytes":4921}],"bytes":4921,"huella":"a0a2dcdabef26d0b","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (85 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-eda","enlace":false}],"proyectos":[],"texto":"\n# evol-eda\n\n## Fase del Pipeline\n\n**Spec (Fase 2) — Especificación y Diseño**\n\nActivar cuando se necesita diseñar arquitectura orientada a eventos:\n- Event choreography design\n- Saga patterns (choreography vs orchestration)\n- Event mesh topology\n- Event schema management\n\n## Artefacto Clave\n\n**`docs/specs/EVENT_MODEL.md`**\n\n```markdown\n# Event Model\n\n## Event Types\n| Event | Producer | Consumers | Schema |\n|-------|----------|-----------|--------|\n| OrderCreated | order-svc | inventory-svc, notification-svc | avro |\n| InventoryUpdated | inventory-svc | order-svc | avro |\n| PaymentProcessed | payment-svc | order-svc, notification-svc | avro |\n\n## Event Flow\n```\nOrderCreated → inventory-svc → InventoryUpdated\n     ↓\npayment-svc → PaymentProcessed → notification-svc\n```\n\n## Saga Pattern: Order Processing\n| Step | Service | Event | Compensation |\n|------|---------|-------|--------------|\n| 1 | order-svc | OrderCreated | CancelOrder |\n| 2 | inventory-svc | InventoryReserved | ReleaseInventory |\n| 3 | payment-svc | PaymentProcessed | RefundPayment |\n| 4 | notification-svc | OrderConfirmed | - |\n\n## Event Schema Registry\n| Event | Version | Format | Location |\n|-------|---------|--------|----------|\n| OrderCreated | v1 | Avro | schema-registry |\n| PaymentProcessed | v2 | Avro | schema-registry |\n```\n\n## Flujo de Trabajo\n\n```bash\n# 1. Descubrir eventos existentes\npython3 scripts/eda/discover-events.py \\\n  --source . \\\n  --output docs/specs/EVENTS_RAW.md\n\n# 2. Generar modelo de eventos\npython3 scripts/eda/generate-model.py \\\n  --events docs/specs/EVENTS_RAW.md \\\n  --output docs/specs/EVENT_MODEL.md\n\n# 3. Diseñar sagas\npython3 scripts/eda/design-sagas.py \\\n  --model docs/specs/EVENT_MODEL.md \\\n  --output docs/specs/SAGA_DESIGN.md\n\n# 4. Validar consistencia\npython3 scripts/eda/validate.py \\\n  --model docs/specs/EVENT_MODEL.md \\\n  --output docs/specs/CONSISTENCY_REPORT.md\n\n# 5. Generar event mesh topology\npython3 scripts/eda/mesh-topology.py \\\n  --model docs/specs/EVENT_MODEL.md \\\n  --output docs/specs/EVENT_MESH.md\n\n# 6. Schema registry validation\npython3 scripts/eda/validate-schemas.py \\\n  --model docs/specs/EVENT_MODEL.md \\\n  --output docs/specs/SCHEMA_STATUS.md\n```\n\n### Event Schema Example\n\n```avro\n{\n  \"namespace\": \"com.example.events\",\n  \"type\": \"record\",\n  \"name\": \"OrderCreated\",\n  \"fields\": [\n    {\"name\": \"orderId\", \"type\": \"string\"},\n    {\"name\": \"userId\", \"type\": \"string\"},\n    {\"name\": \"items\", \"type\": {\"type\": \"array\", \"items\": \"string\"}},\n    {\"name\": \"timestamp\", \"type\": \"long\", \"logicalType\": \"timestamp-millis\"}\n  ]\n}\n```\n\n## Integración con Pipeline\n\n| Fase | Gate | Check | Automático |\n|------|------|-------|------------|\n| Briefing | Event requirements | Eventos necesarios identificados | No |\n| Spec | Event model | Modelo de eventos definido | Sí |\n| Plan | Saga design | Sagas diseñadas | No |\n| Build | Event implementation | Producers/Consumers funcionando | Sí |\n| QA | Event validation | Eventos procesados correctamente | Sí |\n| Retro | Event review | Performance y consistencia evaluadas | No |\n\n## Referencia\n\n- **Constitución Art. 8** — Estándares de ingeniería\n- **Constitución Art. 9** — Fase Spec del Pipeline\n- **Discipline Doc** — `docs/disciplines/EDA.md`\n- **Event Modeling** — https://eventmodeling.org/\n- **Saga Pattern** — https://microservices.io/patterns/data/saga.html\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"EDA","nombre":"Event-Driven Architecture","tipo":"extendida","fases":["spec"]},"enBiblioteca":false},{"id":"evol-esdd-events-cad719","nombre":"evol-esdd-events","carpeta":"evol-esdd-events","descripcion":"Event Sourcing-Driven Development. Disena event stores, aggregates con funciones de aplicacion, y tests de replay deterministico.","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/esdd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/esdd"},"archivos":[{"ruta":"SKILL.md","bytes":4655}],"bytes":4655,"huella":"cad8011fd1f9f7bd","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (129 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-esdd-events","enlace":false}],"proyectos":[],"texto":"\n# evol-esdd-events\n\n## Fase del Pipeline\nSpec (Fase 2)\n\n## Artefacto Clave\n`docs/specs/EVENT_MODEL.md`\n\n## Flujo de Trabajo\n\n### 1. Identificar entidades candidatas a event sourcing\n```bash\n# Analizar entidades con necesidad de auditoria completa\nevol-esdd candidates --entities=entities/ --output=eventsourcing/candidates.json\n```\n\n### 2. Disenar event store schema\n```bash\n# Generar esquema del event store\nevol-esdd design-schema --candidates=eventsourcing/candidates.json --output=eventsourcing/event_store_schema.json\n```\n\n### 3. Definir aggregates y funciones de aplicacion\n```bash\n# Generar documentacion de aggregates\nevol-esdd define-aggregates --schema=eventsourcing/event_store_schema.json --events=events/ --output=eventsourcing/aggregates/\n```\n\n### 4. Generar tests de replay\n```bash\n# Generar tests que verifican reconstruccion deterministica\nevol-esdd replay-tests --aggregates=eventsourcing/aggregates/ --output=tests/eventsourcing/\n\n# Ejecutar tests de replay\nnpx vitest run tests/eventsourcing/\n```\n\n### 5. Generar reporte del modelo de eventos\n```bash\nevol-esdd report --schema=eventsourcing/event_store_schema.json --aggregates=eventsourcing/aggregates/ --output=docs/specs/EVENT_MODEL.md\n```\n\n## Formato Event Store Schema\n\n```json\n{\n  \"streams\": {\n    \"Pedido\": {\n      \"aggregate_root\": \"Pedido\",\n      \"events\": [\n        \"PedidoCreado\",\n        \"PedidoConfirmado\",\n        \"PedidoEnviado\",\n        \"PedidoEntregado\",\n        \"PedidoCancelado\"\n      ],\n      \"snapshot_policy\": {\n        \"every_n_events\": 100\n      }\n    }\n  }\n}\n```\n\n## Formato Aggregate\n\n```markdown\n# Aggregate — Pedido\n\n## Funcion de Aplicacion\n\nEl estado de Pedido se construye aplicando eventos en orden:\n\n1. **PedidoCreado** -> Estado: CREADO, items: [...], total: X\n2. **PedidoConfirmado** -> Estado: CONFIRMADO, confirmado_en: timestamp\n3. **PedidoEnviado** -> Estado: ENVIADO, tracking_number: \"XXX\"\n4. **PedidoEntregado** -> Estado: ENTREGADO, entregado_en: timestamp\n\n## Reglas de Negocio\n- Un pedido solo puede confirmarse si esta en estado CREADO\n- Un pedido cancelado no puede recibir mas eventos\n- El total se recalcula solo al crear el pedido\n\n## Tests de Replay\n- [ ] Replay de PedidoCreado -> PedidoConfirmado -> PedidoEnviado produce estado correcto\n- [ ] Replay de PedidoCreado -> PedidoCancelado produce estado CANCELADO\n- [ ] Replay deterministico: mismo orden de eventos = mismo estado final\n```\n\n## Integracion con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Spec | Disenar event store + aggregates + reglas de aplicacion |\n| Build | Implementar el event store y las proyecciones |\n| QA | Tests de replay: estado deterministico desde eventos |\n| Retro | Revisar snapshots y politicas de compactacion |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/constitucion.md` Art. 9 (Evol-DD Pipeline)\n- `docs/disciplinas/ESDD.md`\n- [Event Sourcing — Martin Fowler](https://martinfowler.com/eaaDev/EventSourcing.html)\n- [Getting Started with Event Sourcing — AxonIQ](https://axoniq.io/resources/getting-started-with-event-sourcing)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"ESDD","nombre":"Event Sourcing-Driven Development","tipo":"extendida","fases":["spec"]},"enBiblioteca":false},{"id":"evol-ethnography-47652d","nombre":"evol-ethnography","carpeta":"evol-ethnography","descripcion":"Deep user research con métodos etnográficos. Observa patrones culturales, analiza comportamiento y descubre necesidades no articuladas.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/ethnography"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/ethnography"},"archivos":[{"ruta":"SKILL.md","bytes":5150}],"bytes":5150,"huella":"466f1a8c009eb7cd","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (135 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-ethnography","enlace":false}],"proyectos":[],"texto":"\n# evol-ethnography\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita entender usuarios a nivel profundo:\n\n- **Ethnographic observation**: observar usuarios en su contexto natural\n- **Cultural patterns**: entender normas, valores, comportamientos culturales\n- **Behavioral analysis**: lo que los usuarios hacen vs. lo que dicen\n- **Unarticulated needs**: necesidades que los usuarios no saben expresar\n- **Contextual inquiry**: entender trabajo/vida en contexto\n- **Journey mapping**: mapear experiencias completas\n\n**No usar para**: user interviews generales (usar evol-discovery), usability testing (usar evol-qa), A/B testing (usar evol-growth-experiment).\n\n## Conocimiento de Dominio\n\n### Ethnographic Methods\n- **Participant observation**: observar participando\n- **Contextual inquiry**: entrevistar en el contexto del usuario\n- **Diary studies**: usuarios documentan su experiencia\n- **Cultural probes**: artifacts que guían la auto-observación\n- **Photo studies**: fotos como data de comportamiento\n\n### Behavioral Analysis\n- **Do-say gap**: diferencia entre lo que hacen y lo que dicen\n- **Workarounds**: soluciones informales a problemas formales\n- **Shadowing**: seguir al usuario en su día a día\n- **Task analysis**: descomponer tareas en pasos detallados\n- **Affinity diagramming**: agrupar observaciones en themes\n\n### Cultural Patterns\n- **Material culture**: objetos que revelan valores\n- **Social practices**: rituales, rutinas, costumbres\n- **Communication patterns**: cómo comunican, qué canal, qué tono\n- **Power dynamics**: quién decide, quién influye, quién ejecuta\n\n### Research Design\n- **Research questions**: qué queremos descubrir\n- **Sampling**: a quién observar, cuántos, dónde\n- **Duration**: cuánto observar para capturar patrones\n- **Ethics**: consentimiento, privacidad, anonimización\n- **Triangulation**: múltiples fuentes para validar findings\n\n### Synthesis\n- **Affinity mapping**: agrupar observaciones en themes\n- **Empathy maps**: qué piensan, sienten, dicen, hacen\n- **Persona development**: arquetipos basados en data real\n- **Journey mapping**: experiencia a lo largo del tiempo\n- **Insight synthesis**: connecting dots entre observaciones\n\n## Flujo de Trabajo\n\n1. **Definir research questions**: qué queremos descubrir\n2. **Diseñar study**: métodos, sampling, duración, ética\n3. **Reclutar participantes**: representativos del target\n4. **Conducir fieldwork**: observar, entrevistar, documentar\n5. **Documentar observations**: notas, fotos, recordings, artifacts\n6. **Sintetizar findings**: affinity mapping, pattern identification\n7. **Crear deliverables**: personas, journey maps, insight reports\n8. **Compartir learnings**: presentar a equipo, stakeholder, documentar\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: ethnographic insights informan el brief\n- **Spec (Fase 2)**: user needs y behaviors informan specs\n- **Plan (Fase 3)**: cultural patterns informan design decisions\n- **Build (Fase 4)**: behavioral insights guían implementation\n- **QA (Fase 5)**: validate against real user behavior\n- **Retro (Fase 6)**: learnings para próximos proyectos\n\n## Referencia\n\n- Constitución Evol-DD: Art. 5 (consultoría de dominio proactiva - deep user understanding)\n- Agentes relacionados: evol-ux (user experience), evol-discovery (user research), evol-cognitive-ux (cognitive patterns)\n- Jeanette Blomberg - \"Ethnographic Field Methods\"\n- Tony Salvador - \"Ethnographic Praxis in Industry\"\n- IDEO: human-centered design methodology\n- Nielsen Norman Group: UX research methods\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"descubrimiento","disciplina":null,"enBiblioteca":false},{"id":"evol-fact-check-1fd927","nombre":"evol-fact-check","carpeta":"evol-fact-check","descripcion":"Verificación de claims y detección de desinformación con pipeline de 11 pasos (SIFT + CRAAP + MFS scoring). Produce Fact-Check Card con veredicto, score de manipulación y componente educativo. Inspirado en petar-nauka/fact-check-skill.","categoria":null,"origen":"evol-dd","licencia":null,"version":null,"triggers":["- \"fact-check\" - \"verifica esto\" - \"es verdad que\" - \"comprueba este claim\" - \"fuente confiable?\" - \"valida esta afirmación\""],"cuandoUsarla":["Cuando hay claims externos (documentación de terceros, benchmarks, artículos, propuestas técnicas) que necesitan verificación antes de incorporarlos al proyecto. Trigger: \"verifica esto\", \"fact-check\", \"es verdad que\", \"comprueba este claim\"."],"compatible":[],"frontmatter":{"origin":"evol-dd","inspired_by":"petar-nauka/fact-check-skill (atribución en NOTICE)","when_to_use":"Cuando hay claims externos (documentación de terceros, benchmarks, artículos, propuestas técnicas) que necesitan verificación antes de incorporarlos al proyecto. Trigger: \"verifica esto\", \"fact-check\"","triggers":"- \"fact-check\" - \"verifica esto\" - \"es verdad que\" - \"comprueba este claim\" - \"fuente confiable?\" - \"valida esta afirmación\"","evals":"evals/evol-fact-check/"},"archivos":[{"ruta":"SKILL.md","bytes":7945}],"bytes":7945,"huella":"48af0d842ea8b123","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":true,"revision":[{"nivel":"error","texto":"Frontmatter: YAML inválido: Nested mappings are not allowed in compact mappings at line 5, column 14:. Suele arreglarse poniendo la description entre comillas o con el bloque «description: >»."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (235 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-fact-check","enlace":false}],"proyectos":[],"texto":"\n# evol-fact-check\n\nPipeline de verificación técnica y detección de desinformación integrado\nal flujo Evol-DD. Combina metodología SIFT, criterios CRAAP, prebunking y\nscoring MFS (Manipulation & Falsehood Score) para producir veredictos\nauditables.\n\n## Modos de operación\n\n| Modo | Cuándo usar | Input |\n|------|-------------|-------|\n| `full` | Verificación completa (11 pasos) | Texto / URL / imagen |\n| `compare` | Comparación de dos fuentes | Fuente A vs Fuente B |\n| `quick` | Verificación rápida (4 pasos) | Pregunta sí/no simple |\n| `prebunk` | Mapa de narrativas falsas activas sobre tema | Topic query |\n\n## Pipeline completo (11 pasos)\n\n### Paso 1 — Descomposición de claims\nRompe el contenido en unidades verificables independientes.\n\nTipos de claim:\n- `F` — Factual (verificable con datos)\n- `O` — Opinión (no verificable per se)\n- `P` — Predicción (verificable en el futuro)\n- `U` — Unverifiable (sin método de verificación disponible)\n- `I` — Implicación (verdad literal, contexto engañoso)\n- `S` — Estadística (requiere metodología + fuente primaria)\n\n### Paso 2 — Investigación de fuentes (SIFT)\n**S**top — pausa antes de reaccionar al contenido.\n**I**nvestigate la fuente: quién es, cuál es su historial, tiene bias declarado.\n**F**ind better coverage: busca cobertura de alta calidad del mismo evento.\n**T**race claims: sigue el claim hasta su origen.\n\nNiveles de fuente (CRAAP scoring):\n\n| Tier | Tipo | Peso |\n|------|------|------|\n| 1 | Peer-reviewed, primaria | 1.0 |\n| 2 | Organismos gubernamentales, instituciones académicas | 0.9 |\n| 3 | Medios de referencia con estándares editoriales | 0.8 |\n| 4 | Expertos con historial verificable | 0.7 |\n| 5 | Medios secundarios confiables | 0.6 |\n| 6 | Medios con bias conocido | 0.4 |\n| 7 | Fuentes anónimas / sin editorial | 0.2 |\n| 8 | Fuentes con historial de desinformación | 0.0 |\n\n### Paso 3 — Evaluación profunda (Lateral Reading)\n1. Audit del sitio/autor fuera del sitio.\n2. Verificar credenciales del autor.\n3. Evaluar evidencia presentada.\n4. Cross-reference con fuentes Tier 1-3.\n\n### Paso 4 — Trazado de origen\n- Primera aparición del claim (fecha, plataforma, idioma).\n- Mutaciones del claim en su propagación.\n- Asociación con campañas coordinadas conocidas.\n\n### Paso 5 — Detección de red flags\n\n| Categoría | Código | Ejemplos |\n|-----------|--------|---------|\n| Emocional | A | Urgencia extrema, miedo, indignación artificial |\n| Atribución | B | \"Fuentes dicen\", citas sin verificar, autor anónimo |\n| Falacias lógicas | C | Ad hominem, hombre de paja, pendiente resbaladiza |\n| Temporal/contextual | D | Imagen/dato descontextualizado, fecha incorrecta |\n| Coordinado/estructural | E | Lenguaje idéntico en múltiples fuentes, timing sospechoso |\n| Salud-específico | F | Curas milagrosas, negación de consenso científico |\n\n### Paso 6 — Veredicto + MFS Score\n\n**Escala de veredicto:**\n\n| Veredicto | Significado |\n|-----------|-------------|\n| `CONFIRMADO` | Múltiples fuentes Tier 1-2 corroboran |\n| `MAYORMENTE VERDADERO` | Verdadero con matices menores |\n| `MIXTO` | Parte verdad, parte falso o sin contexto |\n| `NO VERIFICADO` | Insuficiente evidencia en cualquier dirección |\n| `ENGAÑOSO` | Verdad técnica con contexto que distorsiona significado |\n| `FALSO` | Refutado por fuentes Tier 1-2 |\n\n**MFS Score (Manipulation & Falsehood Score):**\n```\nMFS = (CFS × 0.50) + (MTS × 0.30) + (SCD × 0.20)\n```\n- `CFS` — Claim Falsehood Score (0-10)\n- `MTS` — Manipulation Technique Score (0-10)\n- `SCD` — Source Credibility Deficit (0-10)\n\nMFS 0-3: Bajo riesgo | 4-6: Moderado | 7-8: Alto | 9-10: Crítico\n\n### Paso 7 — Calibración de confianza\nFactores que aumentan/disminuyen confianza en el veredicto. Siempre transparente.\n\n### Paso 8 — Cadena de razonamiento\nPara veredictos no obvios: lógica paso a paso desde claim hasta conclusión.\n\n### Paso 9 — Análisis contrafactual\n\"¿Qué necesitaría ser verdad para que este claim fuera correcto?\"\n\n### Paso 10 — Componente educativo\n- Técnica de manipulación identificada y cómo reconocerla.\n- Cómo verificar este tipo de claim en el futuro.\n- Narrativas conocidas relacionadas.\n\n### Paso 11 — Output\n\nProduce **Fact-Check Report** en Markdown:\n\n```markdown\n# Fact-Check Report — <claim resumido>\n**Fecha:** <ISO date> | **Veredicto:** <VEREDICTO> | **MFS:** <score>/10\n\n## Claim analizado\n<claim literal>\n\n## Fuentes consultadas\n| Fuente | Tier | CRAAP Score | Dice |\n\n## Red flags detectados\n<código> — <descripción>\n\n## Razonamiento\n<cadena lógica>\n\n## Contrafactual\n<qué haría este claim verdadero>\n\n## Educativo\n<cómo reconocer esta técnica>\n\n## Confianza en el veredicto: <Alta/Media/Baja>\n<factores>\n```\n\n## Modo quick (4 pasos)\n\nPara claims simples:\n1. Descomponer en 1 claim verificable.\n2. Buscar fuente Tier 1-3 que confirme o refute.\n3. Asignar veredicto.\n4. Output: 3 líneas (claim / veredicto / fuente).\n\n## Integración Evol-DD\n\n- Invocada por `/research` para validar fuentes externas propuestas.\n- Invocada por `/cross-validate` para confrontar claims entre artefactos.\n- Invocada por `/security-audit` para verificar claims de CVEs y advisories.\n- Invocada por `/analisis-impacto` cuando hay decisiones basadas en benchmarks externos.\n\n## Agentes que la usan\n\n- `evol-researcher` — verifica fuentes durante investigación\n- `evol-qa` — valida claims sobre comportamiento de modelos\n- `evol-doc` — verifica afirmaciones en documentación\n\n## Atribución\nConcepto inspirado en [petar-nauka/fact-check-skill](https://github.com/petar-nauka/fact-check-skill).\nImplementación nativa Evol-DD: pipeline 11 pasos adaptado al contexto técnico,\nMFS score integrado, output Markdown compatible con DOC_STANDARD.md.\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":null,"grupo":"calidad","disciplina":null,"enBiblioteca":false},{"id":"evol-fdd-feature-7b0bb7","nombre":"evol-fdd-feature","carpeta":"evol-fdd-feature","descripcion":"Feature-Driven Development. Descompone features en FEATURES.md con priorización RICE/MoSCoW, story mapping, y criterios de aceptación.","categoria":"discipline-base","origen":null,"licencia":null,"version":null,"triggers":["/fdd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-base","trigger":"/fdd"},"archivos":[{"ruta":"SKILL.md","bytes":2689}],"bytes":2689,"huella":"c805f28cafb363ce","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (134 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-fdd-feature","enlace":false}],"proyectos":[],"texto":"\n# evol-fdd-feature\n\n## Fase del Pipeline\nFase 1 (Briefing) + Fase 3 (Plan)\n\n## Artefacto Clave\n`docs/features/FEATURES.md`\n\n## Flujo de Trabajo\n\n### 1. Generar FEATURES.md\n```bash\nevol-fdd features-generate --from=acuerdos/idea/\n```\n\n### 2. Priorizar con RICE/MoSCoW\n```bash\nevol-fdd features-prioritize --method=RICE\n# Returns: Reach, Impact, Confidence, Effort score\n```\n\n### 3. Story Mapping\n```bash\nevol-fdd story-map --features=docs/features/FEATURES.md\n```\n\n### 4. Validar\n```bash\nevol-fdd features-validate --check=dependencies\n```\n\n## Formato FEATURE\n\n```markdown\n## FEAT-001: [Nombre]\n\n**Prioridad:** Must/Should/Could/Won't\n**RICE Score:** [R×I×C]/E\n**Fases:** 1, 3\n\n### User Story\nComo [rol], quiero [acción] para [beneficio].\n\n### Criterios de Aceptación\n- [ ] Dado/ Cuando/ Entonces\n\n### Dependencias\n- REQUIERE: FEAT-002\n- BLOQUEA: FEAT-003\n```\n\n## Integración con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Briefing | Generar features iniciales, priorizar |\n| Spec | Conectar features con REQ-NNN |\n| Plan | Organizar por features verticales |\n| Build | Implementar por feature |\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-base","grupo":"disciplinas","disciplina":{"id":"FDD","nombre":"Feature-Driven Development","tipo":"base","fases":["briefing","plan"]},"enBiblioteca":false},{"id":"evol-frontend-design-91a6c6","nombre":"evol-frontend-design","carpeta":"evol-frontend-design","descripcion":"Diseno de interfaces frontend production-grade que evitan la estetica generica de \"AI slop\". Fase de design-thinking ANTES de codear, sistema de design tokens, y dos perfiles esteticos seleccionables (bold / enterprise-minimal) via evol.profile.yml. Usar cuando se construye UI, componentes, paginas, dashboards, landing pages, artifacts, wireframes o cualquier salida visual. Sinonimos: /frontend-design, disena la UI, construye el dashboard, mejora el diseno, build a component, design the page.","categoria":"growth","origen":"evol-dd","licencia":null,"version":null,"triggers":["/frontend-design","disena la ui","construye el dashboard","mejora el diseno","build a component","design the page","wireframe"],"cuandoUsarla":["Usuario quiere construir UI, componente, pagina, dashboard o landing","Usuario quiere refinar o auditar un diseno visual existente","Se generan wireframes o artifacts visuales","Output visual riesga verse generico/AI-slop"],"compatible":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"],"frontmatter":{"origin":"evol-dd","inspired_by":"anthropics/skills frontend-design (atribucion en NOTICE)","category":"growth","when_to_use":["Usuario quiere construir UI, componente, pagina, dashboard o landing","Usuario quiere refinar o auditar un diseno visual existente","Se generan wireframes o artifacts visuales","Output visual riesga verse generico/AI-slop"],"triggers":["/frontend-design","disena la ui","construye el dashboard","mejora el diseno","build a component","design the page","wireframe"],"compatible_with":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"],"evals":"evals/evol-frontend-design/"},"archivos":[{"ruta":"SKILL.md","bytes":9040}],"bytes":9040,"huella":"ca2e3a698d9740a4","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (497 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-frontend-design","enlace":false}],"proyectos":[],"texto":"\n# evol-frontend-design\n\n## Proposito\n\nProducir interfaces frontend distintivas y production-grade, evitando la estetica\ngenerica de \"AI slop\" (morado brillante, gradientes por todas partes, fuentes\ngenericas, layouts predecibles). Eleva todo output de UI del sistema.\n\nLa regla central: **design-thinking ANTES de codear**. No se escribe markup hasta\nelegir una direccion estetica clara y un sistema de tokens.\n\n## Reglas hard (NUNCA se violan)\n\n1. **Fase de design-thinking primero.** Antes de cualquier markup, definir:\n   proposito (que problema resuelve la interfaz + audiencia), tono (direccion\n   estetica concreta), constraints (framework, performance, a11y), diferenciacion\n   (que la hace memorable).\n2. **Design tokens obligatorios.** Toda la estetica vive en CSS variables\n   (`:root` + temas). Cero valores de color/espaciado hardcodeados en componentes.\n3. **Perfil estetico declarado.** Leer `aesthetic_profile` de `evol.profile.yml`.\n   Si no existe, preguntar al usuario antes de generar (no asumir).\n4. **Anti AI-slop checklist** se aplica siempre (ver
