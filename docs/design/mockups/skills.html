<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skills</title><style>:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.05);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --seq-100: #cde2fb; --seq-250: #86b6ef; --seq-450: #2a78d6; --seq-600: #184f95;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --info: #2a78d6;
  --focus: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --seq-100: #0d366b; --seq-250: #184f95; --seq-450: #3987e5; --seq-600: #86b6ef;
    --info: #3987e5; --focus: #6da7ec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --seq-100: #0d366b; --seq-250: #184f95; --seq-450: #3987e5; --seq-600: #86b6ef;
  --info: #3987e5; --focus: #6da7ec;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; color: var(--ink); background: var(--page); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; text-decoration: none; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* App shell */
.top { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--grid); }
.top-in { max-width: 1400px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 28px; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.brand span { color: var(--muted); font-weight: 500; }
.nav { display: flex; gap: 4px; }
.nav a { padding: 8px 12px; border-radius: 8px; color: var(--ink-2); }
.nav a:hover { background: var(--wash); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--wash); font-weight: 600; }
.spacer { flex: 1; }
.badge-data { font-size: 12px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
.icon-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--wash); }
main { max-width: 1400px; margin: 0 auto; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
.lede { color: var(--ink-2); margin: 0 0 20px; max-width: 80ch; }
h2 { font-size: 15px; margin: 0 0 12px; }

/* Filter row (one row above everything it scopes) */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--ink-2); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-2); background: var(--wash); font-weight: 600; }
.search { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-width: 220px; }
.note { color: var(--ink-2); font-size: 13px; }
select.sel { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; }

/* Stat tiles (hero numbers; no plot) */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tile b { display: block; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 650; }
.tile span { color: var(--ink-2); font-size: 13px; }
.tile small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 980px) { .grid2 { grid-template-columns: 1fr; } }

/* Status badge: icon + label, never color alone */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px 2px 6px; background: var(--surface); max-width: 100%; }
.st i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; color: #fff; font-weight: 700; }
.st.good i { background: var(--good); } .st.warning i { background: var(--warning); color: #1a1a19; }
.st.serious i { background: var(--serious); color: #1a1a19; } .st.critical i { background: var(--critical); }
.st.info i { background: var(--info); } .st.muted i { background: var(--muted); }

/* Kanban */
.board { display: grid; grid-template-columns: repeat(7, minmax(158px, 1fr)); gap: 12px; align-items: start; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--wash); border-radius: 12px; padding: 10px; min-height: 160px; }
.col h3 { margin: 2px 4px 2px; font-size: 13px; display: flex; justify-content: space-between; align-items: baseline; }
.col h3 em { font-style: normal; color: var(--ink-2); font-weight: 500; }
.col p { margin: 0 4px 10px; color: var(--muted); font-size: 12px; min-height: 32px; }
.empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 18px 6px; border: 1px solid var(--grid); border-radius: 10px; }
.card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; }
.card:hover { border-color: var(--axis); box-shadow: 0 1px 0 var(--grid); }
.card h4 { margin: 0 0 2px; font-size: 14px; }
.card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.card .problem { color: var(--ink-2); font-size: 12px; margin: 8px 0 0; }
.card .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 8px; }
.steps { display: flex; gap: 3px; margin: 9px 0 6px; }
.steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--grid); }
.steps span.done { background: var(--seq-450); } .steps span.adopted { background: var(--seq-250); }
.steps span.now { background: var(--surface); box-shadow: inset 0 0 0 2px var(--seq-450); }
.meter { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.meter > b { display: block; height: 100%; background: var(--seq-450); border-radius: 3px; }
.mods { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.mods span { font-size: 11.5px; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; color: var(--ink-2); }

/* Tables (the accessible twin of every view) */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--axis); padding: 6px 8px; }
td { border-bottom: 1px solid var(--grid); padding: 7px 8px; vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12px; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); margin: 0 0 16px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; cursor: pointer; color: var(--ink-2); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* Stepper */
.stepper { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 14px 0 20px; }
.step { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.step b { display: block; font-size: 13px; }
.step small { color: var(--muted); font-size: 12px; }
.step.done { border-color: var(--seq-450); } .step.now { box-shadow: inset 0 0 0 2px var(--seq-450); }
.step.adopted { border-color: var(--seq-250); }
@media (max-width: 780px) { .stepper { grid-template-columns: repeat(3, 1fr); } }

.check { list-style: none; padding: 0; margin: 0; }
.check li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.check li:last-child { border-bottom: 0; }
.mark { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; margin-top: 1px; }
.mark.ok { background: var(--good); color: #fff; } .mark.no { background: var(--serious); color: #1a1a19; } .mark.opt { background: var(--grid); color: var(--ink-2); }
.matrix td, .matrix th { text-align: center; } .matrix td:first-child, .matrix th:first-child { text-align: left; }

/* Graphs */
.gwrap { position: relative; }
svg.graph { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0; }
.legend button { background: none; border: 0; padding: 2px 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); border-radius: 6px; }
.legend button[aria-pressed="false"] { opacity: .4; }
.sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.sw.ring { background: transparent !important; border: 2px solid var(--muted); }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--page); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; max-width: 280px; box-shadow: 0 4px 16px rgba(0,0,0,.25); display: none; }
.side h3 { margin: 0 0 2px; font-size: 15px; word-break: break-all; }
.side dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0; }
.side dt { color: var(--ink-2); } .side dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; margin: 2px 4px 2px 0; font-size: 12px; }
.empty-state { border: 1px solid var(--grid); border-radius: 12px; padding: 16px; color: var(--ink-2); background: var(--surface); }
.hidden { display: none !important; }
.tw { margin-top: 14px; }
details.tw > summary { cursor: pointer; color: var(--ink-2); padding: 4px 0; }
.foot { color: var(--muted); font-size: 12px; margin-top: 28px; }

/* Heat scale legend */
.heatbar { display: inline-flex; align-items: center; gap: 8px; margin-left: 8px; }
.heatbar i { display: inline-block; width: 160px; height: 10px; border-radius: 5px; border: 1px solid var(--border); }
.heatbar small { color: var(--muted); font-size: 12px; }

/* Documentation screen */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.docs-tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
a.tile-link { display: block; color: inherit; }
a.tile-link:hover { border-color: var(--axis); }
.warnline { color: var(--serious) !important; font-weight: 600; }
.docs-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .docs-layout { grid-template-columns: 1fr; } }
.docnav { padding: 8px 10px 12px; position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow: auto; }
.docnav h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); margin: 14px 4px 4px; display: flex; justify-content: space-between; }
.docnav h3 em { font-style: normal; font-weight: 500; }
.docnav ul { list-style: none; margin: 0; padding: 0; }
.docnav a { display: flex; gap: 8px; align-items: flex-start; padding: 6px 6px; border-radius: 8px; }
.docnav a:hover { background: var(--wash); }
.docnav a[aria-current="true"] { background: var(--wash); box-shadow: inset 2px 0 0 var(--ink); }
.docnav .nm { min-width: 0; display: flex; flex-direction: column; }
.docnav .nm b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docnav .nm small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docnav p.note { margin: 2px 6px 6px; }
.reader .crumbs { color: var(--muted); font-size: 12.5px; }
.reader .crumbs a { color: var(--ink-2); text-decoration: underline; }
.dtitle { font-size: 20px; margin: 6px 0 8px; letter-spacing: -0.01em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.pill { display: inline-block; border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; margin: 2px 4px 2px 0; font-size: 12px; background: var(--surface); }
a.pill:hover { border-color: var(--ink-2); }
dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; margin: 0 0 12px; font-size: 13px; }
dl.meta dt { color: var(--ink-2); } dl.meta dd { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.tscroll { overflow-x: auto; }
.rawtext { overflow: auto; max-height: 70vh; margin: 0; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
.empty-big { text-align: left; } .empty-big h3 { margin: 0 0 6px; font-size: 16px; } .empty-big p { margin: 0 0 8px; color: var(--ink-2); max-width: 70ch; }
.snip { color: var(--ink-2); font-size: 12.5px; border-left: 2px solid var(--grid); padding-left: 8px; margin-top: 4px; }
.deadlink { text-decoration: underline dotted; color: var(--ink-2); }
.riskbar { display: inline-flex; align-items: center; gap: 8px; min-width: 150px; justify-content: flex-end; }
.riskbar i { display: block; height: 8px; border-radius: 4px; min-width: 3px; }
.riskbar b { font-weight: 500; min-width: 42px; text-align: right; }
.svgwrap { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px; overflow: auto; max-height: 75vh; }
.svgwrap svg { display: block; margin: 0 auto; max-width: none; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.thumb { display: block; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.thumb:hover { border-color: var(--ink-2); }
.thumb .frame { background: #fff; height: 130px; display: grid; place-items: center; padding: 8px; }
.thumb .frame svg { max-width: 100%; max-height: 114px; width: auto; height: auto; }
.thumb span { display: block; padding: 6px 10px; font-size: 12.5px; border-top: 1px solid var(--grid); }

/* Rendered Markdown */
.md { line-height: 1.6; font-size: 14px; overflow-wrap: anywhere; }
.md h3, .md h4, .md h5, .md h6 { margin: 18px 0 6px; line-height: 1.25; }
.md h3 { font-size: 18px; border-bottom: 1px solid var(--grid); padding-bottom: 4px; } .md h4 { font-size: 15.5px; } .md h5, .md h6 { font-size: 14px; color: var(--ink-2); }
.md p { margin: 8px 0; } .md ul, .md ol { margin: 8px 0; padding-left: 22px; } .md li.nested { margin-left: 18px; list-style: circle; }
.md li input { margin-right: 4px; } .md hr { border: 0; border-top: 1px solid var(--grid); margin: 16px 0; }
.md blockquote { margin: 10px 0; padding: 4px 12px; border-left: 3px solid var(--axis); color: var(--ink-2); background: var(--wash); border-radius: 0 8px 8px 0; }
.md code { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12.5px; background: var(--wash); border-radius: 4px; padding: 1px 5px; }
.md pre { background: var(--wash); border-radius: 8px; padding: 10px 12px; overflow: auto; } .md pre code { background: none; padding: 0; }
.md a { text-decoration: underline; }
.md table { margin: 10px 0; }
a.pill.gap { border-style: dashed; color: var(--serious); }

/* Skills screen */
.chip.primary { background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 600; }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.skills-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 480px); gap: 16px; align-items: start; }
@media (max-width: 980px) { .skills-layout { grid-template-columns: 1fr; } }
.skills-side { position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow: auto; }
.skill-group { margin-bottom: 14px; }
.skill-group > summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; padding: 6px 2px; list-style: none; }
.skill-group > summary::-webkit-details-marker { display: none; }
.skill-group > summary::before { content: "▸"; color: var(--muted); }
.skill-group[open] > summary::before { content: "▾"; }
.skill-group .count { background: var(--wash); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--ink-2); }
.skill-group ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
a.skill { display: block; height: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
a.skill:hover { border-color: var(--axis); }
a.skill[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.skill-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.skill-top b { font-size: 13px; word-break: break-all; }
.tag { font-size: 11px; font-weight: 600; border-radius: 6px; padding: 0 6px; border: 1px solid var(--border); }
.tag.new { color: var(--info); border-color: var(--info); } .tag.warn { color: #8a5d00; border-color: var(--warning); background: rgba(250,178,25,.12); }
.tag.bad { color: var(--critical); border-color: var(--critical); }
.skill-desc { margin: 4px 0 6px; color: var(--ink-2); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.skill-meta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.skill-meta .pill { margin: 0; }
.cmdbox { background: var(--wash); border-radius: 8px; padding: 8px 10px; margin: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cmdbox code { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12.5px; flex: 1 1 260px; overflow-wrap: anywhere; }
.cmdbox p { flex-basis: 100%; margin: 2px 0 0; }
.actionpanel { border: 1px dashed var(--axis); border-radius: 10px; padding: 8px 12px; margin: 4px 0 10px; }
.maqueta { font-style: italic; }
.disc { background: var(--wash); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.banner { margin-bottom: 14px; }
.side-empty { color: var(--ink-2); }
h3.h3 { font-size: 14px; margin: 16px 0 6px; }
dialog.dlg { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--ink); width: min(720px, calc(100% - 32px)); max-height: min(86vh, 780px); overflow: auto; padding: 0 22px 18px; }
.dlg-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0 10px; margin-bottom: 4px; background: var(--surface); border-bottom: 1px solid var(--grid); }
.dlg-head h2 { margin: 0; font-size: 17px; }
dialog.dlg .cmdbox { flex-wrap: wrap; }
dialog.dlg table td { vertical-align: top; }
dialog.dlg::backdrop { background: rgba(0,0,0,.45); }
.form { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: start; margin: 10px 0; }
.form label { padding-top: 6px; color: var(--ink-2); }
.form textarea.search { width: 100%; resize: vertical; }

/* Skills: agents tab and the audit flow */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 12px 0; }
a.agent { display: block; color: inherit; text-decoration: none; }
a.agent:hover, a.agent:focus-visible { border-color: var(--accent, currentColor); }
.agent h2 { margin: 0 0 4px; font-size: 16px; }
.auditor { margin-top: 16px; }
.audit-steps { margin: 8px 0 12px; padding-left: 20px; }
.audit-steps li { margin: 6px 0; }

/* Constellation (night sky) */
.sky { position: relative; height: clamp(460px, 72vh, 720px); border-radius: 14px; overflow: hidden; background: #04050c; border: 1px solid var(--border); margin-top: 8px; }
.sky-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.sky-ctl { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
.sky-ctl .chip { background: rgba(20, 24, 44, .8); color: #dfe6ff; border-color: rgba(160, 180, 255, .3); }
.sky-hint { position: absolute; left: 12px; bottom: 8px; margin: 0; font-size: 12px; color: rgba(210, 220, 255, .6); pointer-events: none; }
.sky.has-card .sky-hint { display: none; }
.sky-card { position: absolute; top: 12px; bottom: 12px; right: 12px; width: min(54%, 600px); overflow: auto; padding: 16px 18px; border-radius: 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0, 0, 0, .5); transform-origin: left center; animation: unfold .5s cubic-bezier(.2, .8, .2, 1) both; }
.sky-card:focus { outline: none; }
.sky-close { margin-bottom: 10px; }
.sky-card .reader { margin: 0; }
.starcard .h3 { margin: 14px 0 6px; font-size: 13px; }
.linkpill { cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
.linkpill:hover { background: var(--wash); }
.starlist { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; margin: 0; }
@keyframes unfold { from { opacity: 0; transform: perspective(900px) rotateY(-40deg) scale(.6); } to { opacity: 1; transform: none; } }
@media (max-width: 720px) { .sky-card { top: auto; left: 8px; right: 8px; width: auto; height: 62%; transform-origin: top center; } }
@media (prefers-reduced-motion: reduce) { .sky-card { animation: none; } }
.cards.wide { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.evol-agent h2 { font-size: 15px; }
.pill.gap { color: var(--serious); border-color: var(--serious); }
.disc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; padding: 8px 0 12px; }
.disc-cell { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 10px; background: var(--surface); }
.disc-cell small { color: var(--ink-2); }

}

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);

  const hm = d.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === today.toDateString()) return `hoy ${hm}`;
  return d.toLocaleDateString("es", { day: "numeric", month: "short" }) + ` ${hm}`;

/* ---------- domain: what the real data says about a project ---------- */
function discOk(d) { return d.artefactos.every((a) => a.encontrados >= a.min && a.pendientes === 0); }
function progress(p) {
  const ds = p.estado.disciplinas;
  return { ok: ds.filter(discOk).length, total: ds.length };
}
function badge(p) {
  const e = p.estado;
  if (e.fase === "done") return { tone: "good", icon: "✓", text: "Terminado" };
  if (p.problemas.length > 0) return { tone: "serious", icon: "!", text: `Bloqueado · ${p.problemas.length}` };
  if (e.aprobacion.state === "vigente") return { tone: "info", icon: "→", text: "Aprobada", full: "Aprobada: falta ejecutar evol next" };
  if (e.aprobacion.state === "obsoleta") return { tone: "warning", icon: "!", text: "Aprobación obsoleta" };
  if (e.aprobacion.state === "no-integro") return { tone: "critical", icon: "×", text: "Registro no íntegro" };

  if (!tipEl) { tipEl = el("div", { class: "tip", role: "tooltip" }); document.body.append(tipEl); }
  if (content == null) { tipEl.style.display = "none"; return; }

/* ---------- heat ramp: few = blue, many = red (hubs stand out, like a force-directed network map) ---------- */
const HEAT_STOPS = [[0, [42, 120, 214]], [0.25, [47, 179, 106]], [0.5, [200, 214, 58]], [0.72, [245, 166, 35]], [1, [229, 36, 29]]];
function heat(t) {
  const x = Math.max(0, Math.min(1, t));
  for (let i = 1; i < HEAT_STOPS.length; i++) {
    const [t1, c1] = HEAT_STOPS[i];
    if (x <= t1) {
      const [t0, c0] = HEAT_STOPS[i - 1], k = (x - t0) / (t1 - t0 || 1);
      return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * k)).join(",")})`;
    }
  }
  return "rgb(229,36,29)";
}
