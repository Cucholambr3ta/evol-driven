<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skills</title><style>:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.05);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --seq-100: #cde2fb; --seq-250: #86b6ef; --seq-450: #2a78d6; --seq-600: #184f95;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --info: #2a78d6;
  --focus: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --seq-100: #0d366b; --seq-250: #184f95; --seq-450: #3987e5; --seq-600: #86b6ef;
    --info: #3987e5; --focus: #6da7ec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.06);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --seq-100: #0d366b; --seq-250: #184f95; --seq-450: #3987e5; --seq-600: #86b6ef;
  --info: #3987e5; --focus: #6da7ec;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; color: var(--ink); background: var(--page); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; text-decoration: none; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* App shell */
.top { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--grid); }
.top-in { max-width: 1400px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 28px; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.brand span { color: var(--muted); font-weight: 500; }
.nav { display: flex; gap: 4px; }
.nav a { padding: 8px 12px; border-radius: 8px; color: var(--ink-2); }
.nav a:hover { background: var(--wash); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--wash); font-weight: 600; }
.spacer { flex: 1; }
.badge-data { font-size: 12px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
.icon-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--wash); }
main { max-width: 1400px; margin: 0 auto; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
.lede { color: var(--ink-2); margin: 0 0 20px; max-width: 80ch; }
h2 { font-size: 15px; margin: 0 0 12px; }

/* Filter row (one row above everything it scopes) */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--ink-2); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-2); background: var(--wash); font-weight: 600; }
.search { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-width: 220px; }
.note { color: var(--ink-2); font-size: 13px; }
select.sel { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; }

/* Stat tiles (hero numbers; no plot) */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tile b { display: block; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 650; }
.tile span { color: var(--ink-2); font-size: 13px; }
.tile small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 980px) { .grid2 { grid-template-columns: 1fr; } }

/* Status badge: icon + label, never color alone */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px 2px 6px; background: var(--surface); max-width: 100%; }
.st i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; color: #fff; font-weight: 700; }
.st.good i { background: var(--good); } .st.warning i { background: var(--warning); color: #1a1a19; }
.st.serious i { background: var(--serious); color: #1a1a19; } .st.critical i { background: var(--critical); }
.st.info i { background: var(--info); } .st.muted i { background: var(--muted); }

/* Kanban */
.board { display: grid; grid-template-columns: repeat(7, minmax(158px, 1fr)); gap: 12px; align-items: start; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--wash); border-radius: 12px; padding: 10px; min-height: 160px; }
.col h3 { margin: 2px 4px 2px; font-size: 13px; display: flex; justify-content: space-between; align-items: baseline; }
.col h3 em { font-style: normal; color: var(--ink-2); font-weight: 500; }
.col p { margin: 0 4px 10px; color: var(--muted); font-size: 12px; min-height: 32px; }
.empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 18px 6px; border: 1px solid var(--grid); border-radius: 10px; }
.card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; }
.card:hover { border-color: var(--axis); box-shadow: 0 1px 0 var(--grid); }
.card h4 { margin: 0 0 2px; font-size: 14px; }
.card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.card .problem { color: var(--ink-2); font-size: 12px; margin: 8px 0 0; }
.card .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 8px; }
.steps { display: flex; gap: 3px; margin: 9px 0 6px; }
.steps span { flex: 1; height: 6px; border-radius: 3px; background: var(--grid); }
.steps span.done { background: var(--seq-450); } .steps span.adopted { background: var(--seq-250); }
.steps span.now { background: var(--surface); box-shadow: inset 0 0 0 2px var(--seq-450); }
.meter { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.meter > b { display: block; height: 100%; background: var(--seq-450); border-radius: 3px; }
.mods { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.mods span { font-size: 11.5px; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; color: var(--ink-2); }

/* Tables (the accessible twin of every view) */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--axis); padding: 6px 8px; }
td { border-bottom: 1px solid var(--grid); padding: 7px 8px; vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12px; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); margin: 0 0 16px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; cursor: pointer; color: var(--ink-2); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* Stepper */
.stepper { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 14px 0 20px; }
.step { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.step b { display: block; font-size: 13px; }
.step small { color: var(--muted); font-size: 12px; }
.step.done { border-color: var(--seq-450); } .step.now { box-shadow: inset 0 0 0 2px var(--seq-450); }
.step.adopted { border-color: var(--seq-250); }
@media (max-width: 780px) { .stepper { grid-template-columns: repeat(3, 1fr); } }

.check { list-style: none; padding: 0; margin: 0; }
.check li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.check li:last-child { border-bottom: 0; }
.mark { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; margin-top: 1px; }
.mark.ok { background: var(--good); color: #fff; } .mark.no { background: var(--serious); color: #1a1a19; } .mark.opt { background: var(--grid); color: var(--ink-2); }
.matrix td, .matrix th { text-align: center; } .matrix td:first-child, .matrix th:first-child { text-align: left; }

/* Graphs */
.gwrap { position: relative; }
svg.graph { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0; }
.legend button { background: none; border: 0; padding: 2px 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); border-radius: 6px; }
.legend button[aria-pressed="false"] { opacity: .4; }
.sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.sw.ring { background: transparent !important; border: 2px solid var(--muted); }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--page); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; max-width: 280px; box-shadow: 0 4px 16px rgba(0,0,0,.25); display: none; }
.side h3 { margin: 0 0 2px; font-size: 15px; word-break: break-all; }
.side dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0; }
.side dt { color: var(--ink-2); } .side dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; margin: 2px 4px 2px 0; font-size: 12px; }
.empty-state { border: 1px solid var(--grid); border-radius: 12px; padding: 16px; color: var(--ink-2); background: var(--surface); }
.hidden { display: none !important; }
.tw { margin-top: 14px; }
details.tw > summary { cursor: pointer; color: var(--ink-2); padding: 4px 0; }
.foot { color: var(--muted); font-size: 12px; margin-top: 28px; }

/* Heat scale legend */
.heatbar { display: inline-flex; align-items: center; gap: 8px; margin-left: 8px; }
.heatbar i { display: inline-block; width: 160px; height: 10px; border-radius: 5px; border: 1px solid var(--border); }
.heatbar small { color: var(--muted); font-size: 12px; }

/* Documentation screen */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.docs-tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
a.tile-link { display: block; color: inherit; }
a.tile-link:hover { border-color: var(--axis); }
.warnline { color: var(--serious) !important; font-weight: 600; }
.docs-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .docs-layout { grid-template-columns: 1fr; } }
.docnav { padding: 8px 10px 12px; position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow: auto; }
.docnav h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); margin: 14px 4px 4px; display: flex; justify-content: space-between; }
.docnav h3 em { font-style: normal; font-weight: 500; }
.docnav ul { list-style: none; margin: 0; padding: 0; }
.docnav a { display: flex; gap: 8px; align-items: flex-start; padding: 6px 6px; border-radius: 8px; }
.docnav a:hover { background: var(--wash); }
.docnav a[aria-current="true"] { background: var(--wash); box-shadow: inset 2px 0 0 var(--ink); }
.docnav .nm { min-width: 0; display: flex; flex-direction: column; }
.docnav .nm b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docnav .nm small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docnav p.note { margin: 2px 6px 6px; }
.reader .crumbs { color: var(--muted); font-size: 12.5px; }
.reader .crumbs a { color: var(--ink-2); text-decoration: underline; }
.dtitle { font-size: 20px; margin: 6px 0 8px; letter-spacing: -0.01em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.pill { display: inline-block; border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; margin: 2px 4px 2px 0; font-size: 12px; background: var(--surface); }
a.pill:hover { border-color: var(--ink-2); }
dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; margin: 0 0 12px; font-size: 13px; }
dl.meta dt { color: var(--ink-2); } dl.meta dd { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.tscroll { overflow-x: auto; }
.rawtext { overflow: auto; max-height: 70vh; margin: 0; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
.empty-big { text-align: left; } .empty-big h3 { margin: 0 0 6px; font-size: 16px; } .empty-big p { margin: 0 0 8px; color: var(--ink-2); max-width: 70ch; }
.snip { color: var(--ink-2); font-size: 12.5px; border-left: 2px solid var(--grid); padding-left: 8px; margin-top: 4px; }
.deadlink { text-decoration: underline dotted; color: var(--ink-2); }
.riskbar { display: inline-flex; align-items: center; gap: 8px; min-width: 150px; justify-content: flex-end; }
.riskbar i { display: block; height: 8px; border-radius: 4px; min-width: 3px; }
.riskbar b { font-weight: 500; min-width: 42px; text-align: right; }
.svgwrap { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px; overflow: auto; max-height: 75vh; }
.svgwrap svg { display: block; margin: 0 auto; max-width: none; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.thumb { display: block; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.thumb:hover { border-color: var(--ink-2); }
.thumb .frame { background: #fff; height: 130px; display: grid; place-items: center; padding: 8px; }
.thumb .frame svg { max-width: 100%; max-height: 114px; width: auto; height: auto; }
.thumb span { display: block; padding: 6px 10px; font-size: 12.5px; border-top: 1px solid var(--grid); }

/* Rendered Markdown */
.md { line-height: 1.6; font-size: 14px; overflow-wrap: anywhere; }
.md h3, .md h4, .md h5, .md h6 { margin: 18px 0 6px; line-height: 1.25; }
.md h3 { font-size: 18px; border-bottom: 1px solid var(--grid); padding-bottom: 4px; } .md h4 { font-size: 15.5px; } .md h5, .md h6 { font-size: 14px; color: var(--ink-2); }
.md p { margin: 8px 0; } .md ul, .md ol { margin: 8px 0; padding-left: 22px; } .md li.nested { margin-left: 18px; list-style: circle; }
.md li input { margin-right: 4px; } .md hr { border: 0; border-top: 1px solid var(--grid); margin: 16px 0; }
.md blockquote { margin: 10px 0; padding: 4px 12px; border-left: 3px solid var(--axis); color: var(--ink-2); background: var(--wash); border-radius: 0 8px 8px 0; }
.md code { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12.5px; background: var(--wash); border-radius: 4px; padding: 1px 5px; }
.md pre { background: var(--wash); border-radius: 8px; padding: 10px 12px; overflow: auto; } .md pre code { background: none; padding: 0; }
.md a { text-decoration: underline; }
.md table { margin: 10px 0; }
a.pill.gap { border-style: dashed; color: var(--serious); }

/* Skills screen */
.chip.primary { background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 600; }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.skills-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 480px); gap: 16px; align-items: start; }
@media (max-width: 980px) { .skills-layout { grid-template-columns: 1fr; } }
.skills-side { position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow: auto; }
.skill-group { margin-bottom: 14px; }
.skill-group > summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; padding: 6px 2px; list-style: none; }
.skill-group > summary::-webkit-details-marker { display: none; }
.skill-group > summary::before { content: "▸"; color: var(--muted); }
.skill-group[open] > summary::before { content: "▾"; }
.skill-group .count { background: var(--wash); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--ink-2); }
.skill-group ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
a.skill { display: block; height: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
a.skill:hover { border-color: var(--axis); }
a.skill[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.skill-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.skill-top b { font-size: 13px; word-break: break-all; }
.tag { font-size: 11px; font-weight: 600; border-radius: 6px; padding: 0 6px; border: 1px solid var(--border); }
.tag.new { color: var(--info); border-color: var(--info); } .tag.warn { color: #8a5d00; border-color: var(--warning); background: rgba(250,178,25,.12); }
.tag.bad { color: var(--critical); border-color: var(--critical); }
.skill-desc { margin: 4px 0 6px; color: var(--ink-2); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.skill-meta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.skill-meta .pill { margin: 0; }
.cmdbox { background: var(--wash); border-radius: 8px; padding: 8px 10px; margin: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cmdbox code { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12.5px; flex: 1 1 260px; overflow-wrap: anywhere; }
.cmdbox p { flex-basis: 100%; margin: 2px 0 0; }
.actionpanel { border: 1px dashed var(--axis); border-radius: 10px; padding: 8px 12px; margin: 4px 0 10px; }
.maqueta { font-style: italic; }
.disc { background: var(--wash); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.banner { margin-bottom: 14px; }
.side-empty { color: var(--ink-2); }
h3.h3 { font-size: 14px; margin: 16px 0 6px; }
dialog.dlg { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--ink); max-width: 640px; width: calc(100% - 32px); padding: 18px 20px; }
dialog.dlg::backdrop { background: rgba(0,0,0,.45); }
.form { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: start; margin: 10px 0; }
.form label { padding-top: 6px; color: var(--ink-2); }

s":2377},{"ruta":".gitkeep","bytes":0}],"bytes":2377,"huella":"77b1fc876f13af31","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (83 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/agent-eval","enlace":false}],"proyectos":[{"proyecto":"ajicolor","ruta":"skills/agent-eval"},{"proyecto":"ajicolor","ruta":".agents/skills/agent-eval"}],"texto":"\n# agent-eval\n\n## Philosophy\nEval harness for skills/agents/workflows. Suite per skill with cases.jsonl + grader.yaml.\n\n## Grader Types\n\n### structural\nVerify file structure, presence of required elements.\n\n### behavioral\nVerify script behavior: exit codes, output format.\n\n### output_match\nExact output matching for deterministic outputs.\n\n### pass_at_k\nPass@k sampling: run k times, succeed if any pass.\n\n### llm_judge\nLLM as judge for nuanced evaluation.\n\n## Suite Structure\n```\nevals/<skill-name>/\n  cases.jsonl    # Test cases (one JSON per line)\n  grader.yaml    # Grader configuration\n```\n\n## Commands\n```\n/eval run --suite=<skill-name>\n/eval list\n/eval report <run-id>\n```\n\n## Integration\n- Runs in CI to gate merges\n- Can run locally: evol eval run --suite=NAME\n- Results persisted in evol-state.db\n\n## Reference\nskills/agent-eval/SKILL.md\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"quality-gate","grupo":"calidad","disciplina":null,"enBiblioteca":false},{"id":"airtable-739e5a","nombre":"airtable","carpeta":"airtable","descripcion":"Airtable REST API via curl. Records CRUD, filters, upserts.","categoria":"productivity","origen":null,"licencia":"MIT","version":"1.1.0","triggers":[],"cuandoUsarla":[],"compatible":[],"frontmatter":{"version":"1.1.0","author":"community","license":"MIT","platforms":["linux","macos","windows"],"prerequisites":{"env_vars":["AIRTABLE_API_KEY"],"commands":["curl"]},"metadata":{"hermes":{"tags":["Airtable","Productivity","Database","API"],"homepage":"https://airtable.com/developers/web/api/introduction"}}},"archivos":[{"ruta":"SKILL.md","bytes":11314}],"bytes":11314,"huella":"bc11fce18a912d74","modificado":"2026-10-22T01:07:27.574Z","nueva":false,"propia":false,"fuente":"hermes","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El fr matterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (57 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"hermes","agente":"hermes","ruta":"~/.hermes/skills/creative/claude-design","enlace":false}],"proyectos":[],"texto":null},{"id":"code-indexer-a50aae","nombre":"code-indexer","carpeta":"code-indexer","descripcion":"Tree-sitter code graph indexing for impact analysis, process tracing, and incremental git-based updates. Separate LadybugDB instance for code symbols.","categoria":"code-analysis","origen":null,"licencia":null,"version":null,"triggers":["/code-index"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"code-analysis","trigger":"/code-index"},"archivos":[{"ruta":"SKILL.md","bytes":3877}],"bytes":3877,"huella":"99ee8b1e101a114e","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (150 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/code-indexer","enlace":false}],"proyectos":[],"texto":"\n# code-indexer\n\n## Philosophy\nCode awareness is fundamental to safe refactoring, impact analysis, and process tracing. The code graph indexer uses Tree-sitter (mandatory) to parse code into a structured graph stored in a separate LadybugDB instance (`evol_dd_codigo.lbug`).\n\n## Features\n- **Tree-sitter parsing**: Python, JavaScript, TypeScript (mandatory, no regex fallback)\n- **Code graph nodes**: File, Module, Symbol (Function/Class/Method), Test, Commit, Branch\n- **Code graph relations**: IMPORTS, CALLS, EXTENDS, CONTAINS, EXPORTS, TESTS, MODIFIES, BLAME\n- **Impact analysis**: Direct/indirect callers, blast radius computation\n- **Process tracing**: Follow execution paths from entry points\n- **Incremental indexing**: Git diff-based updates via `git diff --name-only $LAST_COMMIT..HEAD`\n- **Separate graph**: Independent from knowledge graph (`evol_dd_memoria.lbug`)\n\n## When to Use\n- Before refactoring to understand blast radius\n- During code review to trace impact of changes\n- When onboarding to understand codebase structure\n- After implementing features to update the code graph\n- When debugging to trace execution paths\n\n## Commands\n\n### Full Project Index\n```bash\npython3 scripts/evol_code_indexer.py index\n```\n\n### Incremental Index (Git Diff)\n```bash\npython3 scripts/evol_code_indexer.py incremental\n```\n\n### Impact Analysis\n```bash\npython3 scripts/evol_code_indexer.py impact <SymbolName> --depth=3\n```\n\n### Process Tracing\n```bash\npython3 scripts/evol_code_indexer.py trace <EntryPoint> --max-depth=5\n```\n\n### Symbol Query\n```bash\npython3 scripts/evol_code_indexer.py query <Pattern>\n```\n\n### Stats\n```bash\npython3 scripts/evol_code_indexer.py stats\n```\n\n## Via EDMS Orchestrator\n```bash\nedms-code-index          # Full project index\nedms-code-impact <Sym>   # Impact analysis\nedms-code-trace <Entry>  # Process tracing\nedms-code-query <Pat>    # Symbol search\nedms-code-stats          # Code graph statistics\n```\n\n## Reference\n- `scripts/evol_code_indexer.py` — Core implementation (1000+ lines)\n- `scripts/evol_memory_store.py` — `code_impact()`, `code_trace()`, `code_query()`, `code_stats()`\n- `tests/test_code_indexer.py` — 11 tests\n- `tests/test_impact.py` — 6 tests\n- `docs/adr/ADR-0009-code-graph-indexer.md` — Architecture decision\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"code-analysis","grupo":"codigo","disciplina":null,"enBiblioteca":false},{"id":"codebase-inspection-fcae20","nombre":"codebase-inspection","carpeta":"codebase-inspection","descripcion":"Inspect codebases w/ pygount: LOC, languages, ratios.","categoria":"software-development","origen":null,"licencia":"MIT","version":"1.0.0","triggers":[],"cuandoUsarla":[],"compatible":[],"frontmatter":{"version":"1.0.0","author":"Hermes Agent","license":"MIT","platforms":["linux","macos","windows"],"metadata":{"hermes":{"tags":["LOC","Code Analysis","pygount","Codebase","Metrics","Repository"],"related_skills":["github"]}},"prerequisites":{"commands":["pygount"]}},"archivos":[{"ruta":"SKILL.md","bytes":3612}],"bytes":3612,"huella":"751cbcffbd7be164","modificado":"2026-10-22T01:07:27.577Z","nueva":false,"propia":false,"fuente":"hermes","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (53 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"hermes","agente":"hermes","ruta":"~/.hermes/skills/software-development/codebase-inspection","enlace":false}],"proyectos":[],"texto":null},{"id":"codex-fdcf9d","nombre":"codex","carpeta":"codex","descripcion":"Delegate coding to OpenAI Codex CLI (features, PRs).","categoria":"autonomous-ai-agents","origen":null,"licencia":"MIT","version":"1.0.1","triggers":[],"cuandoUsarla":[],"compatible":[],"frontmatter":{"version":"1.0.1","author":"Hermes Agent","license":"MIT","platforms":["linux","macos","windows"],"metadata":{"hermes":{"tags":["Coding-Agent","Codex","OpenAI","Code-Review","Refactoring"],"related_skills":["claude-code","hermes-agent"]}}},"archivos":[{"ruta":"SKILL.md","bytes":5852}],"bytes":5852,"huella":"28b1536394f159fe","modificado":"2026-10-22T01:14:35.772Z","nueva":false,"propia":false,"fuente":"hermes","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (52 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"hermes","agente":"hermes","ruta":"~/.hermes/skills/autonomous-ai-agents/codex","enlace":false}],"proyectos":[],"texto":null},{"id":"competitor-news-monitor-70d023","nombre":"competitor-news-monitor","carpeta":"competitor-news-monitor","descripcion":"Watch named companies s, links and financial actions. It is not for websites, which go through Claude in Chrome or the built-in browser and their own skills.","categoria":"synced","origen":null,"licencia":"Proprietary. LICENSE.txt has complete terms","version":null,"triggers":[],"cuandoUsarla":[],"compatible":[],"frontmatter":{"compatibility":"Cowork in the Claude desktop app, and Cowork Remote or upgraded claude.ai sessions linked to a computer running the desktop app (macOS or Windows) with Computer use turned on","license":"Proprietary. LICENSE.txt has complete terms"},"archivos":[{"ruta":"SKILL.md","bytes":9269},{"ruta":"LICENSE.txt","bytes":1467}],"bytes":10736,"huella":"2bc73803a3456df2","modificado":"2026-10-22T02:49:59.239Z","nueva":false,"propia":false,"fuente":"claude","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (934 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"claude","agente":"claude","ruta":"~/.claude/skills/synced/f6ab78f1-8641-4ebc-9ca5-8f86782dfe4b_ec7f8368-6378-471a-ad0e-c2192d6f85ee/computer-use","enlace":false}],"proyectos":[],"texto":null},{"id":"computer-use-ed3815","nombre":"computer-use","carpeta":"computer-use","descripcion":"Drive the desktop background-first; escalate on signal.","categoria":"autonomous-ai-agents","origen":null,"licencia":"MIT","version":"2.1.0","triggers":[],"cuandoUsarla":[],"compatible":[],"frontmatter":{"version":"2.1.0","author":"Francesco Bonacci (f-trycua), Hermes Agent","license":"MIT","platforms":["macos","windows","linux"],"metadata":{"hermes":{"tags":["computer-use","desktop","automation","gui","cross-platform"],"category":"desktop","related_skills":[]}}},"archivos":[{"ruta":"SKILL.md","bytes":18054}],"bytes":18054,"huella":"d528536846945672","modificado":"2026-10-22T01:14:35.772Z","nueva":false,"propia":false,"fuente":"hermes","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (55 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"hermes","agente":"hermes","ruta":"~/.hermes/skills/autonomous-ai-agents/computer-use","enlace":false}],"proyectos":[],"texto":null},{"id":"crear-agente-e95502","nombre":"crear-agente","carpeta":"crear-agente","descripcion":"Crea nuevos agentes Evol-DD desde cero (permanentes o efimeros): genera el .md del agente con identidad, mision, reglas y limites; registra en registry.json; crea agent.template.md si no existe. Usar SOLO cuando el usuario quiera CREAR un agente nuevo — \"crear agente\", \"crea un agente para X\", \"nuevo agente que haga Y\", \"añadir especialista en Z\", \"necesito un agente que sepa de X\", o cuando una tarea requiera un rol ausente del sistema. También activar con \"quiero un agente que sea experto en X\", \"agente para [dominio]\", \"necesito alguien que sepa de X\". NO usar para: listar agentes, crear skills (usar /crear-skill), crear workflows, o preguntas generales sobre el sistema. Soporta agentes permanentes (prompts/agents/<categoria>/) y agentes efimeros (van a prompts/agents/ephemeral/, tienen fecha de expiracion).","categoria":"lifecycle","origen":"evol-dd","licencia":null,"version":null,"triggers":["/crear-agente","crear agente","nuevo agente","necesito un agente","agente para"],"cuandoUsarla":["El usuario quiere un agente especializado que no existe en el registry","Una tarea requiere expertise que ningun agente core cubre","El usuario dice \"crea un agente para X\" o variantes","Se detecta un patron recurrente que justifica un agente dedicado"],"compatible":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"],"frontmatter":{"origin":"evol-dd","category":"lifecycle","when_to_use":["El usuario quiere un agente especializado que no existe en el registry","Una tarea requiere expertise que ningun agente core cubre","El usuario dice \"crea un agente para X\" o variantes","Se detecta un patron recurrente que justifica un agente dedicado"],"triggers":["/crear-agente","crear agente","nuevo agente","necesito un agente","agente para"],"compatible_with":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"]},"archivos":[{"ruta":"SKILL.md","bytes":7714},{"ruta":"evals/evals.json","bytes":4078},{"ruta":"evals/trigger_evals.json","bytes":1922},{"ruta":"evals/workspace/iter-1/eval-1-legal-saas/baseline/agent.md","bytes":22126},{"ruta":"evals/workspace/iter-1/eval-1-legal-saas/with_skill/specialized-legal-saas-reviewer.md","bytes":6397},{"ruta":"evals/workspace/iter-1/eval-2-a11y-efimero/baseline/agent.md","bytes":6523},{"ruta":"evals/workspace/iter-1/eval-2-a11y-efimero/with_skill/2026-06-02-wcag-auditor.md","bytes":5334},{"ruta":"evals/workspace/iter-1/eval-3-data-engineer/baseline/agent.md","bytes":20095},{"ruta":"evals/workspace/iter-1/eval-3-data-engineer/with_skill/engineering-data-engineer-ecommerce.md","bytes":6936},{"ruta":"references/agent-template-spec.md","bytes":2349},{"ruta":"references/categorias.md","bytes":2176},{"ruta":"references/ejemplos.md","bytes":2884},{"ruta":"scripts/validate_agent.py","bytes":3014}],"bytes":91548,"huella":"309b8a2f34225ddd","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (822 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"aviso","texto":"Incluye 1 script(s) que el agente puede ejecutar: scripts/validate_agent.py. Revísalos antes de usarla."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/crear-agente","enlace":false}],"proyectos":[],"texto":"\n# Crear Agente Evol-DD\n\nSkill para crear agentes Evol-DD con identidad, mision y reglas bien definidas. Genera el\narchivo `.md` del agente, lo registra en `registry.json`, y opcionalmente crea\n`templates/agent.template.md` como base para futuros agentes efimeros.\n\n## Proceso\n\n### 1. Entrevistar al usuario\n\nAntes de escribir nada, hacer estas preguntas (las que no esten claras del contexto):\n\n- **Que hace este agente?** (1-2 lineas — su responsabilidad principal)\n- **Que NO hace?** (limites explícitos — evitar scope creep)\n- **Es permanente o efimero?**\n  - Permanente: experto de dominio que el sistema siempre necesita\n  - Efimero: especialista para una tarea concreta, se retira al terminar\n- **Que categoria corresponde?**\n  Ver referencias/categorias.md para la lista valida\n- **Tiene un tono o personalidad especifica?** (tecnico, colaborativo, directo, educativo)\n- **Con que otros agentes o skills trabaja?**\n\nSi el usuario da suficiente contexto, extraer respuestas del historial sin preguntar todo.\n\n### 2. Verificar si ya existe\n\nAntes de crear, buscar en el registry:\n\n```bash\npython3 scripts/validate-registry.py --strict\ngrep -i \"<nombre-candidato>\" prompts/agents/registry.json\n```\n\nSi existe uno similar, mostrarlo al usuario y preguntar si prefiere mejorar el existente\no crear uno nuevo con diferente enfoque.\n\n### 3. Crear el archivo .md del agente\n\n**Destino segun tipo:**\n- Permanente: `prompts/agents/<categoria>/<categoria>-<nombre>.md`\n- Efimero: `prompts/agents/ephemeral/<timestamp>-<nombre>.md`\n\n**Formato obligatorio:**\n\n```markdown\n---\nname: Nombre del Agente\ndescription: Una linea precisa que describe que hace y cuando usarlo.\ncolor: <color-hex-o-nombre>\nvibe: Una frase que captura la personalidad y enfoque del agente.\n---\n\n# [Nombre del Agente]\n\nParrafo de apertura: quien es, que hace, por que importa su rol.\n\n## Mision principal\n\n[Descripcion detallada de la responsabilidad central. Explicar el POR QUE,\nno solo el QUE. El agente debe entender el razonamiento para ir mas alla\nde instrucciones literales.]\n\n## Reglas criticas\n\n[Maximo 6 reglas. Solo las que realmente importan. Explicar cada una con\nrazonamiento, no con SIEMPRE/NUNCA en mayusculas.]\n\n1. [Regla con razon]\n2. [Regla con razon]\n\n## Como trabajar\n\n[Patron de trabajo tipico: como recibe una tarea, como la procesa,\nque produce, como comunica resultados.]\n\n## Limites\n\n[Que NO hace este agente. Ser explicito sobre lo que esta fuera de scope.]\n```\n\n**Principios de escritura del agente:**\n- Explicar el POR QUE detrás de cada instruccion — los LLMs son inteligentes y funcionan\n  mejor con razonamiento que con reglas rigidas\n- Evitar SIEMPRE/NUNCA en mayusculas — reformular con explicacion del razonamiento\n- El tono debe ser coherente con la personalidad declarada en `vibe:`\n- Usar segunda persona (\"Eres X\", \"Tu rol es Y\") para identidad fuerte\n- `## Limites` es OBLIGATORIA — declara explícitamente qué NO hace el agente. Sin esta\n  sección el agente asume que puede hacer todo, lo que genera scope creep.\n- NO duplicar nombres de sección. Cada `##` debe aparecer exactamente una vez. Revisar\n  el draft antes de guardar y eliminar duplicados.\n\n### 4. Registrar en registry.json\n\nAñadir entry al final del array `agents`:\n\n```json\n{\n  \"id\": \"<categoria>-<nombre-kebab>\",\n  \"name\": \"<Nombre Legible>\",\n  \"category\": \"<categoria>\",\n  \"description\": \"<descripcion una linea>\",\n  \"color\": \"<color>\",\n  \"vibe\": \"<personalidad>\",\n  \"prompt_file\": \"prompts/agents/<categoria>/<archivo>.md\",\n  \"ide_compat\": [\"claude-code\", \"opencode\", \"cursor\", \"windsurf\", \"vscode-copilot\", \"antigravity\", \"codex\"],\n  \"skills\": [],\n  \"constraints\": [],\n  \"triggers\": [],\n  \"fallback_agent\": null\n}\n```\n\nPara agentes **efimeros**, añadir campos adicionales:\n```json\n{\n  ...campos_base...,\n  \"ephemeral\": true,\n  \"created_for_task\": \"<descripcion de la tarea>\",\n  \"expires_after_days\": 30,\n  \"created_at\": \"<ISO8601>\"\n}\n```\n\n### 5. Validar\n\n```bash\npython3 scripts/validate-registry.py --strict\n```\n\nDebe reportar: `✓ schema OK (N+1 agents)`. Si falla, corregir antes de continuar.\n\n### 6. Crear agent.template.md si no existe\n\nSi `templates/agent.template.md` no existe, crearlo como base para futuros agentes\nefimeros. Ver referencias/agent-template-spec.md para el formato completo.\n\n### 7. Reportar al usuario\n\n```\nAgente creado: [Nombre]\nArchivo: prompts/agents/<categoria>/<archivo>.md\nRegistry: registry.json actualizado (N+1 agentes)\nTipo: permanente | efimero (expira en N dias)\n\nPara invocar este agente en el sistema:\n  /evol → mencionar el agente por nombre\n  O via composition_pattern si necesita coordinacion con otros agentes\n```\n\n## Referencias\n\n- `references/categorias.md` — lista de categorias validas y cuando usar cada una\n- `references/agent-template-spec.md` — spec completa del formato de agente efimero\n- `references/ejemplos.md` — ejemplos de agentes bien escritos del registry\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"lifecycle","grupo":"ciclo","disciplina":null,"enBiblioteca":false},{"id":"crear-skill-29cb94","nombre":"crear-skill","carpeta":"crear-skill","descripcion":"Crea nuevas skills para Evol-DD desde cero con loop iterativo de eval. Mejora skills existentes. Optimiza la descripcion del frontmatter para mejor triggering. Genera evals cuantitativos y cualitativos. Porta la skill a los 7 IDEs via evol-adapt.sh. Usar cuando el usuario quiera crear una skill nueva, mejorar una existente, testear una skill, o necesite que una capacidad este disponible como trigger en Claude Code, Cursor, Windsurf, OpenCode, Antigravity, VSCode Copilot o Codex. Sinonimos: /crear-skill, crear skill, nueva skill, quiero una skill para, hazme una skill.","categoria":"growth","origen":"evol-dd","licencia":null,"version":null,"triggers":["/crear-skill","crear skill","nueva skill","quiero una skill","hazme una skill"],"cuandoUsarla":["Usuario quiere crear una skill nueva","Usuario quiere mejorar una skill existente","Usuario quiere testear una skill","Necesita una capacidad disponible como trigger en IDE"],"compatible":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"],"frontmatter":{"origin":"evol-dd","category":"growth","when_to_use":["Usuario quiere crear una skill nueva","Usuario quiere mejorar una skill existente","Usuario quiere testear una skill","Necesita una capacidad disponible como trigger en IDE"],"triggers":["/crear-skill","crear skill","nueva skill","quiero una skill","hazme una skill"],"compatible_with":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"]},"archivos":[{"ruta":"SKILL.md","bytes":5977}],"bytes":5977,"huella":"846e93af00fa5563","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (574 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/crear-skill","enlace":false}],"proyectos":[],"texto":"\n# crear-skill\n\n## Proposito\n\nLoop completo de creacion iterativa de skills con eval cuantitativo/cualitativo\ny portabilidad a 7 IDEs. Patron inspirado en anthropics/skills/skill-creator (Apache-2.0).\n\nEl sistema no puede crecer sin este mecanismo. Cada proyecto puede generar skills\nespecificas que luego se comparten en el registry global.\n\n## Uso\n\n```\n/crear-skill\n```\n\nEl agente abre un workflow guiado con 8 pasos:\n\n1. **Capturar intencion** — entrevista al usuario\n2. **Estructura** — crea directorio `skills/<nombre>/`\n3. **Draft** — escribe SKILL.md con frontmatter\n4. **Casos de prueba** — genera 2-3 prompts realistas\n5. **Loop eval** — runs paralelos with-skill vs baseline\n6. **Optimizar description** — recall/precision >= 0.85\n7. **Portar a 7 IDEs** — `bash scripts/evol-adapt.sh all`\n8. **Registro** — actualiza catalogo + memoria.md\n\n## Estructura de skill\n\n```\nskills/<nombre>/\n├── SKILL.md              (requerido)\n├── references/           (opcional)\n├── scripts/              (opcional)\n└── evals/                (si output es verificable)\n    ├── evals.json\n    └── cases.jsonl\n```\n\n## Formato SKILL.md\n\n```yaml\n---\nname: nombre-kebab-case\ndescription: > Descripcion que determina triggering\norigin: evol-dd\ncategory: context-engineering | quality-gate | security | compression | research | lifecycle | growth\nwhen_to_use:\n  - caso de uso 1\ntriggers:\n  - /trigger-principal\ncompatible_with:\n  - claude-code\n  - opencode\n  - cursor\n  - windsurf\n  - vscode-copilot\n  - antigravity\n  - codex\n---\n\n# Nombre de la Skill\n\n## Proposito\n\n## Uso\n\n## Referencias\n```\n\n## Principios\n\n- Explicar el POR QUE, no solo el QUE\n- Evitar SIEMPRE/NUNCA en mayusculas\n- Mantener SKILL.md bajo 500 lineas\n- Description \"un poco agresiva\" — mejor overtrigger que undertrigger\n\n## CSO — Claude Search Optimization (description que dispara, no que resume)\n\nLa `description` del frontmatter es lo unico que el agente lee para decidir si\ncarga la skill. Optimizarla para **triggering**, no para resumir el workflow.\n\n- Describe CONDICIONES de activacion (\"usar cuando el usuario quiera X\"), no el\n  procedimiento interno. Si la description detalla el workflow, el agente puede\n  seguir la description en vez de leer el SKILL.md completo.\n- Tercera persona, orientada a gatillos. Incluir sinonimos y triggers naturales.\n- Maximo util ~1024 caracteres; concision > exhaustividad.\n\nInspirado en obra/superpowers (writing-skills).\n\n## RED-GREEN-REFACTOR (escribir skills es TDD aplicado a procesos)\n\nNinguna skill se da por buena sin un test que falle primero. El loop de eval\n(paso 5) se formaliza asi:\n\n1. **RED** — correr 2-3 escenarios de presion SIN la skill; documentar las\n   racionalizaciones/errores exactos que comete el baseline.\n2. **GREEN** — escribir la skill minima que resuelve esos fallos especificos.\n3. **REFACTOR** — re-testear; identificar nuevas racionalizaciones; agregar\n   contras explicitas; repetir hasta que sea a prueba de balas.\n\nInspirado en obra/superpowers (writing-skills): \"no skill deploys without a\nfailing test first\".\n\n## Criterio de calidad\n\n- Test primero (RED): baseline documentado antes de escribir la skill\n- Benchmark iter-1: with-skill supera baseline en >= 30pp (GREEN)\n- Description CSO: recall >= 0.85, precision >= 0.85 (condiciones, no workflow)\n- 0 emojis en body, seccion `## Limites` presente\n\n## Limites\n\n- No crea agentes (usar `crear-agente` para eso)\n- No modifica skills core del sistema\n- No genera MCP servers\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"growth","grupo":"ciclo","disciplina":null,"enBiblioteca":false},{"id":"deep-research-ea21bf","nombre":"deep-research","carpeta":"deep-research","descripcion":"Use this skill when the user's prompt requires (1) researching a topic across multiple sources, comparing options or alternatives, analyzing trends or history, understanding markets or industries, or reviewing literature or studies and (2) synthesizing that research into a comprehensive, narrative report. If you're planning to search the web or internal knowledge bases, consider using this skill. This skill coordinates research subagents, so use it only when you have a tool for spawning subagents (the Agent or Task tool); otherwise, research the question directly.","categoria":"synced","origen":null,"licencia":null,"version":null,"triggers":[],"cuandoUsarla":[],"compatible":[],"frontmatter":{},"archivos":[{"ruta":"SKILL.md","bytes":13132},{"ruta":"references/report-writer.md","bytes":6168},{"ruta":"references/researcher.md","bytes":4222}],"bytes":23522,"huella":"6fbbb0c6f0c3eafe","modificado":"2026-10-22T02:49:59.492Z","nueva":false,"propia":false,"fuente":"claude","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (570 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"claude","agente":"claude","ruta":"~/.claude/skills/synced/f6ab78f1-8641-4ebc-9ca5-8f86782dfe4b_ec7f8368-6378-471a-ad0e-c2192d6f85ee/deep-research","enlace":false}],"proyectos":[],"texto":null},{"id":"design-md-7f3546","nombre":"design-md","carpeta":"design-md","descripcion":"Author/validate/export Google's DESIGN.md token spec files.","categoria":"creative","origen":null,"licencia":"MIT","version":"1.1.0","triggers":[],"cuandoUsarla":[],"compatibl arla":[],"compatible":[],"frontmatter":{"version":"0.2.0","author":"Ben Barclay (benbarclay), Hermes Agent","license":"MIT","platforms":["linux","macos","windows"],"metadata":{"hermes":{"tags":["Email","Inbox","Triage","Replies","Productivity"],"related_skills":["himalaya","google-workspace"]}}},"archivos":[{"ruta":"SKILL.md","bytes":5447}],"bytes":5447,"huella":"187a2d734a2827fe","modificado":"2026-10-22T01:14:35.773Z","nueva":false,"propia":false,"fuente":"hermes","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (58 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"hermes","agente":"hermes","ruta":"~/.hermes/skills/email/email-inbox-triage","enlace":false}],"proyectos":[],"texto":null},{"id":"evol-a11ydd-c5230b","nombre":"evol-a11ydd","carpeta":"evol-a11ydd","descripcion":"Accessibility-Driven Development. Asigna criterios WCAG 2.1 AA por componente, ejecuta Lighthouse/axe-core, y genera tests de lector de pantalla.","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/a11y"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/a11y"},"archivos":[{"ruta":"SKILL.md","bytes":4416}],"bytes":4416,"huella":"89b2e08ab9fe105a","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (145 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-a11ydd","enlace":false}],"proyectos":[],"texto":"\n# evol-a11ydd\n\n## Fase del Pipeline\nBriefing (Fase 1) + QA (Fase 5)\n\n## Artefacto Clave\n`a11y/wcag_criteria.json`\n\n## Flujo de Trabajo\n\n### 1. Asignar criterios WCAG por componente\n```bash\n# Leer componentes de UI y asignar criterios\nevol-a11ydd assign --ui-messages=ux/ui_messages/ --output=a11y/wcag_criteria.json\n```\n\n### 2. Generar tests de lector de pantalla\n```bash\n# Generar escenarios Gherkin para navegacion con lector\nevol-a11ydd screen-reader-tests --criteria=a11y/wcag_criteria.json --output=a11y/screen_reader_tests/\n```\n\n### 3. Ejecutar testing automatico\n```bash\n# Lighthouse Accessibility audit\nnpx lighthouse http://localhost:3000 --only-categories=accessibility --output=json --output-path=a11y/lighthouse-report.json\n\n# axe-core en tests automatizados\nnpx playwright test --project=a11y\n```\n\n### 4. Verificar scores\n```bash\n# Validar que Lighthouse A11y > 90\nevol-a11ydd check-score --report=a11y/lighthouse-report.json --threshold=90\n\n# Validar 0 issues criticos axe-core\nevol-a11ydd check-criticals --report=a11y/axe-report.json --block-on=critical\n```\n\n## Formato WCAG Criteria\n\n```json\n{\n  \"componente\": \"LoginForm\",\n  \"criterios\": [\n    {\n      \"id\": \"WCAG-1.1.1\",\n      \"nivel\": \"A\",\n      \"descripcion\": \"Texto alternativo para iconos decorativos\",\n      \"implementado\": false\n    },\n    {\n      \"id\": \"WCAG-1.3.1\",\n      \"nivel\": \"A\",\n      \"descripcion\": \"Estructura semantica del formulario\",\n      \"implementado\": false\n    },\n    {\n      \"id\": \"WCAG-2.4.7\",\n      \"nivel\": \"AA\",\n      \"descripcion\": \"Indicador de foco visible en campos\",\n      \"implementado\": false\n    }\n  ]\n}\n```\n\n## Formato Screen Reader Test\n\n```gherkin\n@a11y\nFeature: Navegacion con lector de pantalla en LoginForm\n\n  Scenario: El usuario navega al campo de email\n    Given el usuario esta en la pagina de login\n    And el lector de pantalla esta activo\n    When el usuario presiona Tab\n    Then el lector annuncia \"Email, campo de texto, requerido\"\n\n  Scenario: El usuario envia el formulario con error\n    Given el usuario dejo el campo email vacio\n    When el usuario presiona \"Iniciar sesion\"\n    Then el lector annuncia \"Error: El email es requerido\"\n```\n\n## Integracion con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Briefing | Asignar criterios WCAG por componente |\n| Build | Implementar accesibilidad; inyectar axe-core en tests |\n| QA | Lighthouse + axe-core + revision manual de flujos clave |\n| Gate | Bloquea si Lighthouse A11y < 90 o hay issues criticos |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/constitucion.md` Art. 9 (Evol-DD Pipeline)\n- `docs/disciplinas/A11yDD.md`\n- [WCAG 2.2 — W3C Recommendation](https://www.w3.org/TR/WCAG22/)\n- [axe-core — Deque](https://github.com/dequelabs/axe-core)\n- [The A11Y Project](https://github.com/a11yproject/a11yproject.com)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"A11yDD","nombre":"Accessibility-Driven Development","tipo":"extendida","fases":["briefing","qa"]},"enBiblioteca":false},{"id":"evol-add-arch-3198fc","nombre":"evol-add-arch","carpeta":"evol-add-arch","descripcion":"ADD — Architecture-Driven Development, ADR generation, architecture fitness functions, trade-off analysis","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/add-arch"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/add-arch"},"archivos":[{"ruta":"SKILL.md","bytes":5131}],"bytes":5131,"huella":"daf060ebfb0877eb","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (105 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-add-arch","enlace":false}],"proyectos":[],"texto":"\n# evol-add-arch\n\n## Fase del Pipeline\n\n**Spec (Fase 2) — Especificación y Diseño**\n\nActivar cuando se necesita documentar decisiones arquitectónicas:\n- ADR (Architecture Decision Records) generation\n- Architecture fitness functions\n- Trade-off analysis\n- Architectural runway tracking\n\n## Artefacto Clave\n\n**`docs/adr/ADR-NNN.md`**\n\n```markdown\n# ADR-001: Use Event-Driven Architecture\n\n## Status\nAccepted\n\n## Date\n2026-06-07\n\n## Context\nWe need to build a system that handles 10k orders/day with real-time inventory updates.\nCurrent synchronous architecture creates bottlenecks during peak hours.\n\n## Decision\nWe will use event-driven architecture with:\n- Kafka for event streaming\n- CQRS for read/write separation\n- Saga pattern for distributed transactions\n\n## Consequences\n### Positive\n- Better scalability and fault tolerance\n- Real-time inventory updates\n- Decoupled services\n\n### Negative\n- Increased operational complexity\n- Eventual consistency challenges\n- Need for event schema management\n\n## Alternatives Considered\n| Alternative | Pros | Cons |\n|-------------|------|------|\n| REST APIs | Simple, well-known | Tight coupling, sync bottleneck |\n| Message Queue | Decentralized | No event replay |\n\n## Architecture Fitness Functions\n- [ ] Latency p99 < 500ms\n- [ ] Event processing lag < 1s\n- [ ] System availability > 99.9%\n```\n\n## Flujo de Trabajo\n\n```bash\n# 1. Detectar decisiones arquitectónicas\npython3 scripts/adr/detect.py \\\n  --source . \\\n  --output docs/adr/ADR_CANDIDATES.md\n\n# 2. Generar ADR\npython3 scripts/adr/generate.py \\\n  --title \"Use Event-Driven Architecture\" \\\n  --context \"High throughput requirements\" \\\n  --output docs/adr/ADR-001.md\n\n# 3. Analizar trade-offs\npython3 scripts/adr/trade-off.py \\\n  --adr docs/adr/ADR-001.md \\\n  --output docs/adr/TRADE_OFF_ANALYSIS.md\n\n# 4. Definir fitness functions\npython3 scripts/adr/fitness-functions.py \\\n  --adr docs/adr/ADR-001.md \\\n  --output docs/adr/FITNESS_FUNCTIONS.md\n\n# 5. Validar consistencia de ADRs\npython3 scripts/adr/validate.py \\\n  --adr-dir docs/adr/ \\\n  --output docs/adr/CONSISTENCY_REPORT.md\n\n# 6. Generar diagrama de decisiones\npython3 scripts/adr/visualize.py \\\n  --adr-dir docs/adr/ \\\n  --output docs/adr/DECISION_GRAPH.md\n```\n\n### ADR Template\n\n```markdown\n# ADR-{NNN}: {Title}\n\n## Status\n{Proposed | Accepted | Deprecated | Superseded by ADR-{NNN}}\n\n## Date\n{YYYY-MM-DD}\n\n## Context\n{What is the issue that we're seeing that motivates this decision?}\n\n## Decision\n{What is the change that we're proposing and/or doing?}\n\n## Consequences\n### Positive\n{What becomes easier or more supported?}\n\n### Negative\n{What becomes harder?}\n\n## Alternatives Considered\n{What other options were evaluated?}\n```\n\n## Integración con Pipeline\n\n| Fase | Gate | Check | Automático |\n|------|------|-------|------------|\n| Briefing | Architecture context | Contexto arquitectónico definido | No |\n| Spec | ADRs generated | ADRs creados para decisiones clave | Sí |\n| Plan | Trade-offs analyzed | Trade-offs documentados | Sí |\n| Build | Fitness functions | Fitness functions monitoreados | Sí |\n| QA | Architecture validated | Consistencia verificada | Sí |\n| Retro | ADR review | Decisiones revisadas | No |\n\n## Referencia\n\n- **Constitución Art. 8** — Estándares de ingeniería\n- **Constitución Art. 9** — Fase Spec del Pipeline\n- **Discipline Doc** — `docs/disciplines/ADD_Arch.md`\n- **ADR Template** — https://github.com/joelparkerhenderson/architecture-decision-record\n- **Fitness Functions** — https://www.thoughtworks.com/radar/techniques/fitness-functions\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"ADD","nombre":"Architecture-Driven Development","tipo":"extendida","fases":["spec"]},"enBiblioteca":false},{"id":"evol-ai-review-0ff7ed","nombre":"evol-ai-review","carpeta":"evol-ai-review","descripcion":"Quality gate review using AI for nuanced assessment.","categoria":"quality-gate","origen":null,"licencia":null,"version":null,"triggers":["/ai-review"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"quality-gate","trigger":"/ai-review"},"archivos":[{"ruta":"SKILL.md","bytes":2225},{"ruta":".gitkeep","bytes":0}],"bytes":2225,"huella":"1b62bf12743725f7","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (52 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-ai-review","enlace":false}],"proyectos":[],"texto":"\n# evol-ai-review\n\n## Philosophy\nAI-as-judge for quality gates. Supplement static checks with LLM reasoning.\n\n## Tiers\n1. **Static** (automated): grep, lint, schema validation\n2. **Functional** (automated): test execution, contract testing\n3. **AI Judge** (LLM): nuanced quality assessment\n\n## When to Use\n- Complex refactoring decisions\n- Architecture trade-off evaluation\n- Security vulnerability severity\n- Documentation quality\n\n## Commands\n```\n/ai-review --type=security <target>\n/ai-review --type=quality <target>\n/ai-review --type=architecture <target>\n```\n\n## Integration\n- Run after static checks pass\n- Input: code + context\n- Output: assessment + confidence score\n\n## Reference\nskills/evol-ai-review/SKILL.md\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"quality-gate","grupo":"calidad","disciplina":null,"enBiblioteca":false},{"id":"evol-apivdd-36fa29","nombre":"evol-apivdd","carpeta":"evol-apivdd","descripcion":"API Versioning-Driven Development. Detecta breaking changes, genera calendarios de deprecacion, y planes de migracion entre versiones de API.","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/apivdd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/apivdd"},"archivos":[{"ruta":"SKILL.md","bytes":4740}],"bytes":4740,"huella":"0dac0d3600dfd034","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (141 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-apivdd","enlace":false}],"proyectos":[],"texto":"\n# evol-apivdd\n\n## Fase del Pipeline\nPlan (Fase 3)\n\n## Artefacto Clave\n`docs/plan/API_VERSIONING.md`\n\n## Flujo de Trabajo\n\n### 1. Detectar breaking changes entre versiones\n```bash\n# Comparar contratos versionados\nevol-apivdd detect --current=api/openapi.yaml --previous=api/openapi_v1.yaml --output=api_versions/breaking_changes/\n\n# Generar reporte de cambios\nevol-apivdd diff --current=api/openapi.yaml --previous=api/openapi_v1.yaml --output=api_versions/diff_report.json\n```\n\n### 2. Generar calendario de deprecacion\n```bash\n# Generar schedule desde breaking changes\nevol-apivdd deprecation-schedule --breaking=api_versions/breaking_changes/ --output=api_versions/deprecation_schedule.json\n\n# Calcular fecha minima de deprecation (min 90 dias)\nevol-apivdd validate-schedule --schedule=api_versions/deprecation_schedule.json --min-days=90\n```\n\n### 3. Generar guias de migracion\n```bash\n# Para cada breaking change, generar guia de migracion\nevol-apivdd migration-guide --breaking=api_versions/breaking_changes/ --output=api_versions/breaking_changes/\n\n# Ejemplo: breaking change en nombre de campo\n# Antes: { \"usuario_id\": \"usr_001\" }\n# Despues: { \"userId\": \"usr_001\" }\n```\n\n### 4. Generar reporte de versioning\n```bash\nevol-apivdd report --breaking=api_versions/breaking_changes/ --schedule=api_versions/deprecation_schedule.json --output=docs/plan/API_VERSIONING.md\n```\n\n## Formato Breaking Change\n\n```markdown\n# Breaking Change — BC-001\n\n**Tipo:** Renombrado de campo\n**Endpoint:** GET /api/usuarios\n**Campo:** `usuario_id` -> `userId`\n**Impacto:** Todos los consumidores que usan `usuario_id`\n\n## Impacto en Consumidores\n- Frontend: requiere cambio en 3 componentes\n- Movil: requiere cambio en 2 pantallas\n\n## Plan de Migracion\n1. Publicar nueva version v2 con campo `userId`\n2. Mantener `usuario_id` deprecated por 90 dias\n3. Headers `Deprecation: true` y `Sunset: 2026-09-05`\n4. Eliminar campo en v3\n```\n\n## Formato deprecation_schedule.json\n\n```json\n{\n  \"version_from\": \"v1\",\n  \"version_to\": \"v2\",\n  \"breaking_changes\": [\n    {\n      \"id\": \"BC-001\",\n      \"description\": \"Renombrado usuario_id -> userId\",\n      \"deprecation_date\": \"2026-06-07\",\n      \"sunset_date\": \"2026-09-05\",\n      \"migration_guide\": \"api_versions/breaking_changes/BC-001.md\"\n    }\n  ],\n  \"headers\": {\n    \"Deprecation\": \"true\",\n    \"Sunset\": \"Sat, 05 Sep 2026 00:00:00 GMT\",\n    \"Link\": \"<https://docs.api.com/migration/v2>; rel=\\\"successor-version\\\"\"\n  }\n}\n```\n\n## Integracion con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Plan | Definir estrategia de versionado + calendario de deprecacion |\n| Build | Implementar versiones conviviendo + headers de deprecacion |\n| QA | Verificar que ningun breaking change carece de plan |\n| Gate | Bloquea si hay breaking change sin plan de migracion |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/constitucion.md` Art. 9 (Evol-DD Pipeline)\n- `docs/disciplinas/APIVDD.md`\n- [Semantic Versioning 2.0.0](https://semver.org/)\n- [RFC 8594 — The Sunset HTTP Header Field](https://www.rfc-editor.org/rfc/rfc8594)\n- [API Versioning Strategies — API7](https://api7.ai/blog/api-versioning-strategies)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"APIVDD","nombre":"API Versioning-Driven Development","tipo":"extendida","fases":["plan"]},"enBiblioteca":false},{"id":"evol-atdd-acceptance-3ee488","nombre":"evol-atdd-acceptance","carpeta":"evol-atdd-acceptance","descripcion":"Acceptance Test-Driven Development. Genera stubs de acceptance tests que fallan por diseno y bloquean merge hasta implementacion completa.","categoria":"discipline-base","origen":null,"licencia":null,"version":null,"triggers":["/atdd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-base","trigger":"/atdd"},"archivos":[{"ruta":"SKILL.md","bytes":4804}],"bytes":4804,"huella":"faaaaeb62fdd52ef","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (138 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-atdd-acceptance","enlace":false}],"proyectos":[],"texto":"\n# evol-atdd-acceptance\n\n## Fase del Pipeline\nBriefing + QA (Fase 1+5)\n\n## Artefacto Clave\n`tests/acceptance/*.acceptance.test.ts`\n\n## Flujo de Trabajo\n\n### 1. Generar stubs de acceptance tests\n```bash\n# Desde criterios de aceptacion en FEATURES.md\nevol-atdd stub --from=docs/features/FEATURES.md --output=tests/acceptance/\n\n# Para un feature especifico\nevol-atdd stub --feature=FEAT-001 --output=tests/acceptance/\n```\n\n### 2. Validar estructura de stubs\n```bash\n# Verificar que stubs fallan por diseno\nevol-atdd verify-stubs --expect=failing --output=tests/results/stub-status.json\n\n# Contar stubs vs criterios de aceptacion\nevol-atdd coverage --features=docs/features/FEATURES.md --stubs=tests/acceptance/\n```\n\n### 3. Ejecutar acceptance tests\n```bash\n# Ejecutar suite de acceptance tests\nnpx playwright test tests/acceptance/\n\n# Ejecutar un test especifico\nnpx playwright test tests/acceptance/feat-001-exportar-pdf.acceptance.test.ts\n\n# Generar reporte\nnpx playwright test tests/acceptance/ --reporter=json --output=tests/results/acceptance-results.json\n```\n\n### 4. Validar contra el pipeline CI\n```bash\n# Verificar que los tests bloquean merge si fallan\nevol-atdd ci-check --results=tests/results/acceptance-results.json --block-on=failure\n\n# Generar reporte para gate de Fase 5\nevol-atdd gate-report --results=tests/results/acceptance-results.json --output=.evol/qa/acceptance-gate.json\n```\n\n## Formato Acceptance Test\n\n```typescript\n// tests/acceptance/feat-001-exportar-pdf.acceptance.test.ts\n// ATDD Stub — FEAT-001: Exportar reporte PDF del periodo de facturacion\n// Estado: FAILING BY DESIGN — implementacion pendiente en Fase 4\n// REQ: REQ-001 (SPEC.md)\n\nimport { test, expect } from '@playwright/test';\nimport { loginAs } from '../helpers/auth';\nimport { crearPeriodoConClientes } from '../helpers/billing';\n\ntest.describe('FEAT-001: Exportar reporte PDF', () => {\n\n  test('REQ-001 — Operador puede exportar PDF de periodo vigente', async ({ page }) => {\n    await loginAs(page, 'operador-admin');\n    await crearPeriodoConClientes('2026-05', 3);\n    \n    await page.goto('/reportes');\n    await page.click('[data-testid=\"exportar-pdf-2026-05\"]');\n    const [download] = await Promise.all([\n      page.waitForEvent('download'),\n      page.click('[data-testid=\"confirmar-exportar\"]'),\n    ]);\n    \n    expect(download.suggestedFilename()).toMatch(/reporte-2026-05\\.pdf/);\n  });\n\n  test('REQ-001-ERR1 — Rechaza exportacion sin datos', async ({
