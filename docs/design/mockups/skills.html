e con la carpeta."},{"nivel":"ok","texto":"description clara (90 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-slo-sla","enlace":false}],"proyectos":[],"texto":"\n# evol-slo-sla\n\n## Fase del Pipeline\n\n**QA (Fase 5) — Verificación y Validación**\n\nActivar cuando se necesita definir o auditar niveles de servicio:\n- Definición de SLOs por servicio\n- Cálculo de error budgets\n- Redacción de SLAs\n- Configuración de burn rate alerts\n\n## Artefacto Clave\n\n**`docs/qa/SLO_DEFINITIONS.md`**\n\n```markdown\n# SLO Definitions\n\n## Service: api-gateway\n| SLI | Target | Window | Error Budget |\n|-----|--------|--------|--------------|\n| Availability | 99.9% | 30d | 43.2min |\n| Latency (p99) | < 500ms | 30d | 0.1% |\n| Correctness | 99.99% | 30d | 4.32min |\n\n## Burn Rate Alerts\n| SLO | Burn Rate | Window | Severity |\n|-----|-----------|--------|----------|\n| Availability | 14.4x | 1h | critical |\n| Availability | 6x | 6h | warning |\n\n## SLA Summary\n- **Availability SLO:** 99.9% monthly\n- **Latency SLO:** p99 < 500ms\n- **Support Response:** 4h for critical, 24h for high\n```\n\n## Flujo de Trabajo\n\n```bash\n# 1. Extraer métricas existentes\npython3 scripts/slo-sla/extract-slis.py --source . --output docs/qa/SLIS_RAW.md\n\n# 2. Generar definiciones SLO\npython3 scripts/slo-sla/generate-slos.py \\\n  --slis docs/qa/SLIS_RAW.md \\\n  --output docs/qa/SLO_DEFINITIONS.md \\\n  --targets \"availability=99.9,latency_p99=500,correctness=99.99\"\n\n# 3. Calcular error budgets\npython3 scripts/slo-sla/calc-budgets.py \\\n  --slos docs/qa/SLO_DEFINITIONS.md \\\n  --window 30d \\\n  --output docs/qa/ERROR_BUDGETS.md\n\n# 4. Generar burn rate alerts\npython3 scripts/slo-sla/burn-rate-alerts.py \\\n  --slos docs/qa/SLO_DEFINITIONS.md \\\n  --output alerts/slo-burn-rate.yml\n\n# 5. Validar SLA vs SLO alignment\npython3 scripts/slo-sla/validate-sla-slo.py \\\n  --slos docs/qa/SLO_DEFINITIONS.md \\\n  --sla docs/compliance/SLA.md\n\n# 6. Generar dashboard config\npython3 scripts/slo-sla/dashboard.py \\\n  --slos docs/qa/SLO_DEFINITIONS.md \\\n  --output dashboards/slo-overview.json\n```\n\n### Error Budget Formula\n\n```\nError Budget = (1 - SLO Target) × Time Window\nExample: 99.9% SLO over 30d = 0.1% × 30 × 24 × 60 = 43.2 minutes\n```\n\n## Integración con Pipeline\n\n| Fase | Gate | Check | Automático |\n|------|------|-------|------------|\n| Briefing | SLI identificados | Métricas clave definidas | No |\n| Spec | SLOs propuestos | Targets documentados | Sí |\n| Plan | Error budgets calculados | Budgets por SLO | Sí |\n| Build | Instrumentación SLIs | Métricas recolectadas | Sí |\n| QA | SLOs validados | Burn rate alerts configurados | Sí |\n| Retro | Error budget review | Consumo vs presupuesto | No |\n\n## Referencia\n\n- **Constitución Art. 8** — Estándares de ingeniería\n- **Constitución Art. 9** — Fase QA del Pipeline\n- **Discipline Doc** — `docs/disciplines/SLO_SLA.md`\n- **Google SRE Book** — https://sre.google/sre-book/service-level-objectives/\n- **OpenSLO Spec** — https://openslo.com/\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"SLO","nombre":"SLO/SLA-Driven Development","tipo":"extendida","fases":["qa"]},"enBiblioteca":false},{"id":"evol-stdd-security-test-8f13f4","nombre":"evol-stdd-security-test","carpeta":"evol-stdd-security-test","descripcion":"Security-Test-Driven Development. Extiende TDD con tests de seguridad basados en amenazas STRIDE de THREATS.md.","categoria":"discipline-base","origen":null,"licencia":null,"version":null,"triggers":["/stdd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-base","trigger":"/stdd"},"archivos":[{"ruta":"SKILL.md","bytes":5383}],"bytes":5383,"huella":"7ca625345217bafe","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (111 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-stdd-security-test","enlace":false}],"proyectos":[],"texto":"\n# evol-stdd-security-test\n\n## Fase del Pipeline\nBuild (Fase 4)\n\n## Artefacto Clave\n`tests/security/**/*.security.test.ts`\n\n## Flujo de Trabajo\n\n### 1. Generar stubs desde THREATS.md\n```bash\n# Generar security tests para amenazas con security test requerido\nevol-stdd stub --from=docs/specs/THREATS.md --output=tests/security/\n\n# Por amenaza especifica\nevol-stdd stub --threat=THR-001 --output=tests/security/authz/\n```\n\n### 2. Ejecutar ciclo STDD extendido\n```bash\n# ROJO — Test funcional falla\nnpx vitest run tests/unit/facturacion/exportar-reporte.test.ts\n\n# ROJO-SEC — Security test falla\nnpx vitest run tests/security/authz/exportar-reporte.security.test.ts\n\n# VERDE — Implementar codigo minimo para que ambos pasen\nnpx vitest watch tests/unit/facturacion/exportar-reporte.test.ts tests/security/authz/\n\n# REFACTOR + HARDENING — Mejorar sin romper tests\nnpx vitest run tests/unit/ tests/security/\n```\n\n### 3. Ejecutar suite de security tests\n```bash\n# Ejecutar todos los security tests\nnpx vitest run tests/security/\n\n# Ejecutar por categoria STRIDE\nnpx vitest run tests/security/authz/    # Elevation of Privilege\nnpx vitest run tests/security/auth/     # Spoofing\nnpx vitest run tests/security/disclosure/ # Information Disclosure\nnpx vitest run tests/security/availability/ # Denial of Service\nnpx vitest run tests/security/audit/    # Repudiation\nnpx vitest run tests/security/injection/ # Tampering\n\n# Generar reporte para auditoria\nnpx vitest run tests/security/ --reporter=verbose\n```\n\n### 4. Validar cobertura contra THREATS.md\n```bash\n# Verificar que cada THR-NNN con security test requerido tiene su test\nevol-stdd coverage --threats=docs/specs/THREATS.md --tests=tests/security/\n\n# Generar reporte de cobertura\nevol-stdd report --output=tests/results/stdd-coverage.json\n```\n\n## Formato Security Test\n\n```typescript\n// tests/security/authz/feat-001-rbac.security.test.ts\n// THR: THR-001 (THREATS.md) — Escalada de privilegios en exportacion\n// SEC-REQ: SEC-REQ-001 (SPEC.md) — RBAC en exportacion de reportes\n// STRIDE: Elevation of Privilege\n// Estado: FAILING BY DESIGN — implementacion RBAC pendiente\n// Autor: Security-Engineer | Revisor: SecOps\n\nimport { test, expect } from 'vitest';\nimport { exportarReportePDF } from '../../../src/facturacion/exportar-reporte';\nimport { crearContextoUsuario } from '../../helpers/auth';\n\ntest.describe('THR-001 — RBAC en exportacion de reportes', () => {\n\n  test('SEC-REQ-001 — Usuario sin rol \"administrador\" no puede exportar', async () => {\n    const ctx = crearContextoUsuario({ rol: 'operador-lectura' });\n    await expect(exportarReportePDF('2026-05', ctx)).rejects.toThrow('AuthorizationError');\n  });\n\n  test('SEC-REQ-001 — Token expirado es rechazado', async () => {\n    const ctx = crearContextoUsuario({ rol: 'administrador', tokenExpirado: true });\n    await expect(exportarReportePDF('2026-05', ctx)).rejects.toThrow('TokenExpiredError');\n  });\n\n  test('SEC-REQ-001 — IDOR: usuario A no accede a reportes del tenant B', async () => {\n    const ctx = crearContextoUsuario({ rol: 'administrador', tenantId: 'tenant-a' });\n    await expect(exportarReportePDF('2026-05', ctx, { tenantId: 'tenant-b' }))\n      .rejects.toThrow('AuthorizationError');\n  });\n\n});\n```\n\n## Integración con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Spec | THREATS.md define amenazas con security test requerido |\n| Build | Ejecutar ciclo STDD para funciones con amenazas |\n| QA | Tier 2 ejecuta security tests; 100% passing |\n| Gate | Bloquea merge si algun security test falla |\n\n## Referencia\n- `docs/constitucion.md` Art. 8 (Mandato de testing)\n- `docs/disciplinas/STDD.md`\n- `docs/specs/THREATS.md` (amenazas con security test requerido)\n- [OWASP Web Security Testing Guide (WSTG)](https://owasp.org/www-project-web-security-testing-guide/)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-base","grupo":"disciplinas","disciplina":{"id":"STDD","nombre":"Security-Test-Driven Development","tipo":"base","fases":["build"]},"enBiblioteca":false},{"id":"evol-systems-design-f04398","nombre":"evol-systems-design","carpeta":"evol-systems-design","descripcion":"Diseña interacciones agent-workflow aplicando principios de game design: feedback loops, sistemas de progresión, balance y mecánicas de engagement.","categoria":"game-inspired","origen":null,"licencia":null,"version":null,"triggers":["/systems-design"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"game-inspired","trigger":"/systems-design"},"archivos":[{"ruta":"SKILL.md","bytes":5669}],"bytes":5669,"huella":"53de10bfb38aa26a","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":true,"revision":[{"nivel":"error","texto":"Frontmatter: YAML inválido: Nested mappings are not allowed in compact mappings at line 2, column 14:. Suele arreglarse poniendo la description entre comillas o con el bloque «description: >»."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (147 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-systems-design","enlace":false}],"proyectos":[],"texto":"\n# evol-systems-design\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita diseñar o evaluar sistemas de interacción entre agentes y workflows:\n\n- **Feedback loops**: loops de refuerzo positivo/negativo, emergence, unintended consequences\n- **Sistemas de progresión**: niveles de agente, unlock de skills, progression trees\n- **Balance de agentes**: capacidad vs. carga, distribución equitativa, evitar cuellos de botella\n- **Mecánicas de engagement**: motivación intrínseca, variedad, sensación de progreso\n- **Arquitectura de reglas**: constraints, boundaries, decision trees para agentes\n- **Flow states**: diseñar para que los agentes mantengan flow (challenge = skill level)\n\n**No usar para**: optimización de rendimiento técnico (usar evol-balance), documentación narrativa (usar evol-narrative-docs).\n\n## Conocimiento de Dominio\n\n### Feedback Loops\n- **Positive feedback loops**: refuerzan comportamiento (más uso → más datos → mejor servicio → más uso)\n- **Negative feedback loops**: estabilizan el sistema (load balancing, auto-scaling)\n- **Delay loops**: efectos diferidos que causan oscilaciones (stock → demanda → stock)\n- **Emergence**: comportamientos no diseñados que emergen de interacciones simples\n\n### Progression Systems\n- **Linear progression**: niveles 1→2→3, claro y predecible\n- **Branching progression**: árbol de habilidades, choice matters\n- **Prestige systems**: reset con beneficios, replayability\n- **Unlock systems**: contenido que se desbloquea con achievement\n\n### Balance\n- **Power budget**: cada agente tiene un \"presupuesto\" de capacidad\n- **Rock-paper-scissors**: agentes complementarios, no competidores\n- **Diminishing returns**: más de lo mismo no siempre es mejor\n- **Skill ceiling**: límite de cuánto puede mejorar un agente con práctica\n\n### Engagement Mechanics\n- **Intrinsic motivation**: mastery, autonomy, purpose (Daniel Pink)\n- **Flow channel**: balance entre challenge y skill (Csikszentmihalyi)\n- **Loss aversion**: miedo a perder es más fuerte que deseo de ganar\n- **Variable reward**: unpredictability mantiene engagement (slot machine effect)\n\n### Decision Architecture\n- **Choice architecture**: cómo se presentan las opciones afecta la decisión\n- **Default effects**: el default es lo que la mayoría elige\n- **Nudge theory**: cambios sutiles que guían comportamiento\n- **Choice overload**: demasiadas opciones paralizan\n\n## Flujo de Trabajo\n\n1. **Mapear el sistema actual**: ¿Qué agentes existen? ¿Cómo interactúan? ¿Qué loops existen?\n2. **Identificar feedback loops**: positivos (refuerzo), negativos (estabilización), delay (oscilaciones)\n3. **Diseñar progresión**: niveles, unlocks, progression trees para agentes\n4. **Evaluar balance**: distribución de carga, power budget, complementariedad\n5. **Definir mecánicas de engagement**: flow states, motivación, variedad\n6. **Prototipar reglas**: decision trees, constraints, boundaries\n7. **Simular comportamiento**: ejecutar el sistema y observar emergence\n8. **Iterar basado en datos**: métricas de engagement, balance, unintended consequences\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: entender el sistema de agentes y sus objetivos\n- **Spec (Fase 2)**: documentar arquitectura de reglas, feedback loops, progression\n- **Plan (Fase 3)**: diseñar sistema de balance, métricas de engagement\n- **Build (Fase 4)**: implementar reglas, progression, métricas de sistema\n- **QA (Fase 5)**: testear balance, simular edge cases, medir engagement\n- **Retro (Fase 6)**: analizar emergence, unintended consequences, iterar diseño\n\n## Referencia\n\n- Constitución Evol-DD: Art. 6 (orquestación multi-agente)\n- Art. 2: pipeline con gates (feedback loops de control)\n- Agentes relacionados: evol-orchestrator (composición), evol-balance (optimización), evol-pacing (timing)\n- Jesse Schell - \"The Art of Game Design\": lenses para diseñar sistemas\n- Will Wright - \"SimCity\": emergence en sistemas complejos\n- Dan Cook - \"Chemical Courage\": game design patterns for emergent gameplay\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"game-inspired","grupo":"descubrimiento","disciplina":null,"enBiblioteca":false},{"id":"evol-talk-compact-91cae2","nombre":"evol-talk-compact","carpeta":"evol-talk-compact","descripcion":"Compresion de output del orquestador Evol-DD. 3 niveles. Ahorro tokens ~50-75%.","categoria":"compression","origen":null,"licencia":null,"version":null,"triggers":["/compact-talk"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"compression","trigger":"/compact-talk"},"archivos":[{"ruta":"SKILL.md","bytes":2252},{"ruta":".gitkeep","bytes":0}],"bytes":2252,"huella":"ed48cbe48fc08fb3","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (79 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-talk-compact","enlace":false}],"proyectos":[],"texto":"\n# evol-talk-compact\n\n## Philosophy\nOrquestador output compression inspired by caveman (juliusbrussee/caveman, MIT).\n\n## Levels\n- **light**: Remove redundant headers, keep technical precision\n- **medium**: Fragment sentences, drop articles/fillers\n- **aggressive**: Keep only technical terms + action verbs\n\n## Example Transformations\n| Original | Compacted |\n|----------|-----------|\n| \"The answer is 4.\" | \"4\" |\n| \"Based on the information provided, the answer is...\" | \"[info provided] → ...\" |\n| \"I will now execute the following command...\" | \"Exec: ...\" |\n\n## When to Use\n- Orchestrator verbose output\n- Multi-agent coordination logs\n- CI/CD pipeline output\n\n## Reference\nskills/evol-talk-compact/SKILL.md\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"compression","grupo":"contexto","disciplina":null,"enBiblioteca":false},{"id":"evol-tdd-unit-c1bcc7","nombre":"evol-tdd-unit","carpeta":"evol-tdd-unit","descripcion":"Test-Driven Development. Aplica ciclo Rojo-Verde-Refactor para toda logica de negocio con mandato constitucional (Art. 8).","categoria":"discipline-base","origen":null,"licencia":null,"version":null,"triggers":["/tdd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-base","trigger":"/tdd"},"archivos":[{"ruta":"SKILL.md","bytes":4362}],"bytes":4362,"huella":"9063829ad160f029","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (122 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-tdd-unit","enlace":false}],"proyectos":[],"texto":"\n# evol-tdd-unit\n\n## Fase del Pipeline\nBuild (Fase 4)\n\n## Artefacto Clave\n`tests/unit/*.test.ts`\n\n## Flujo de Trabajo\n\n### 1. Identificar logica de negocio para TDD\n```bash\n# Analizar codigo fuente para identificar funciones que requieren TDD\nevol-tdd analyze --src=src/ --output=.evol/tdd-candidates.json\n\n# Filtrar por tipo de codigo (logica de negocio vs scaffolding)\nevol-tdd filter --candidates=.evol/tdd-candidates.json --type=business-logic\n```\n\n### 2. Escribir test que falla (ROJO)\n```bash\n# Generar stub de test unitario\nevol-tdd stub --function=calcularTotalPeriodo --output=tests/unit/facturacion/calcular-total.test.ts\n\n# Ejecutar para confirmar fallo\nnpx vitest run tests/unit/facturacion/calcular-total.test.ts\n```\n\n### 3. Implementar codigo minimo (VERDE)\n```bash\n# Ejecutar test mientras se implementa\nnpx vitest watch tests/unit/facturacion/calcular-total.test.ts\n\n# Confirmar que el test pasa\nnpx vitest run tests/unit/facturacion/calcular-total.test.ts\n```\n\n### 4. Refactorizar sin romper tests\n```bash\n# Ejecutar todos los tests para verificar que no se rompieron\nnpx vitest run tests/unit/\n\n# Verificar cobertura\nnpx vitest --coverage\n```\n\n### 5. Ejecutar suite completa\n```bash\n# Ejecutar todos los tests unitarios\nnpx vitest run tests/unit/\n\n# Generar reporte de cobertura\nnpx vitest --coverage --reporter=json --output=tests/results/coverage.json\n```\n\n## Formato Test Unitario\n\n```typescript\n// tests/unit/facturacion/calcular-total.test.ts\n// REQ: REQ-001 (SPEC.md) — Calcular total del periodo de facturacion\n// FEAT: FEAT-001 (FEATURES.md)\n// Autor: Builder | Revisor: Reviewer\n\nimport { describe, it, expect } from 'vitest';\nimport { calcularTotalPeriodo } from '../../../src/facturacion/calcular-total';\n\ndescribe('calcularTotalPeriodo', () => {\n\n  it('retorna la suma de subtotales de N lineas', () => {\n    const lineas = [{ subtotal: 100 }, { subtotal: 250 }, { subtotal: 75 }];\n    expect(calcularTotalPeriodo(lineas)).toBe(425);\n  });\n\n  it('retorna 0 para un array vacio de lineas', () => {\n    expect(calcularTotalPeriodo([])).toBe(0);\n  });\n\n  it('lanza DomainError si el total resulta negativo', () => {\n    const lineas = [{ subtotal: -100 }];\n    expect(() => calcularTotalPeriodo(lineas)).toThrow('DomainError');\n  });\n\n});\n```\n\n## Integración con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Build | Ejecutar ciclo TDD para toda logica de negocio |\n| QA | Tier 1 ejecuta tests unitarios; 100% passing |\n| Gate | Bloquea si hay logica de negocio sin test previo (Art. 8) |\n\n## Referencia\n- `docs/constitucion.md` Art. 8 (Mandato TDD)\n- `docs/constitucion.md` Art. 9 (Evol-DD Pipeline)\n- `docs/disciplinas/TDD.md`\n- [Test-Driven Development: By Example — Kent Beck (2002)](https://www.oreilly.com/library/view/test-driven-development/0321146530/)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-base","grupo":"disciplinas","disciplina":{"id":"TDD","nombre":"Test-Driven Development","tipo":"base","fases":["build"]},"enBiblioteca":false},{"id":"evol-team-dynamics-2dcdda","nombre":"evol-team-dynamics","carpeta":"evol-team-dynamics","descripcion":"Dinámica de equipos y rendimiento colaborativo. Analiza patrones de colaboración, diseñar cultura y optimizar trabajo en equipo.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/team-dynamics"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/team-dynamics"},"archivos":[{"ruta":"SKILL.md","bytes":5639}],"bytes":5639,"huella":"d5fa448ee58b8ba8","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (128 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-team-dynamics","enlace":false}],"proyectos":[],"texto":"\n# evol-team-dynamics\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita mejorar el rendimiento del equipo:\n\n- **Team dynamics**: entender cómo trabaja el equipo, qué funciona, qué no\n- **Collaboration patterns**: patrones de comunicación,.review, pairing\n- **Culture engineering**: diseñar la cultura del equipo intencionalmente\n- **Conflict resolution**: manejar desacuerdos constructivamente\n- **Psychological safety**: crear ambiente donde sea seguro take risks\n- **Team health**: medir y mejorar la salud del equipo\n\n**No usar para**: gestión de proyectos (usar evol-pm), gestión del cambio (usar evol-change-mgmt), orquestación de agentes (usar evol-orchestrator).\n\n## Conocimiento de Dominio\n\n### Team Dynamics\n- **Tuckman model**: forming → storming → norming → performing\n- **Lencioni's 5 dysfunctions**: absence of trust, fear of conflict, lack of commitment, avoidance of accountability, inattention to results\n- **Psychological safety**: Amy Edmondson's research on safe teams\n- **Dunbar's number**: cognitive limits on team size (5, 15, 50, 150)\n\n### Collaboration Patterns\n- **Pair programming**: two people, one code, real-time review\n- **Mob programming**: whole team, one code, collective ownership\n- **Code review**: asynchronous quality and knowledge sharing\n- **Architecture Decision Records**: document decisions for future reference\n- **Tech talks**: knowledge sharing sessions\n\n### Culture Engineering\n- **Values definition**: what we believe and how we behave\n- **Norms**: unwritten rules that govern behavior\n- **Rituals**: recurring practices that reinforce culture\n- **Stories**: narratives that embody culture\n- **Artifacts**: visible manifestations of culture\n\n### Conflict Resolution\n- **Interest-based resolution**: focus on interests, not positions\n- **Thomas-Kilmann modes**: competing, collaborating, compromising, avoiding, accommodating\n- **Nonviolent communication**: observations, feelings, needs, requests\n- **Mediation**: neutral third party facilitates resolution\n\n### Psychological Safety\n- **Speak up**: team members feel safe to voice opinions\n- **Take risks**: safe to try new things and fail\n- **Ask questions**: safe to say \"I don't know\"\n- **Challenge authority**: safe to disagree with leadership\n- **Admit mistakes**: safe to own failures\n\n### Team Health Metrics\n- **eNPS**: employee Net Promoter Score\n- **Engagement surveys**: regular pulse checks\n- **Velocity stability**: consistent delivery over time\n- **Defect rates**: quality as team health indicator\n- **Turnover**: people leaving as signal of problems\n\n## Flujo de Trabajo\n\n1. **Assess current state**: how does the team work today?\n2. **Identify dynamics**: what patterns exist? what works? what doesn't?\n3. **Measure health**: surveys, metrics, observation\n4. **Identify improvements**: where to focus for maximum impact\n5. **Design interventions**: specific actions to improve dynamics\n6. **Implement changes**: pilot, measure, iterate\n7. **Build psychological safety**: trust, respect, openness\n8. **Sustain improvements**: rituals, norms, continuous feedback\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: understand team context, dynamics, constraints\n- **Spec (Fase 2)**: document team requirements, collaboration needs\n- **Plan (Fase 3)**: design team structure, communication patterns\n- **Build (Fase 4)**: implement collaboration practices, tools\n- **QA (Fase 5)**: verify team dynamics support quality delivery\n- **Retro (Fase 6)**: team retrospective as continuous improvement\n\n## Referencia\n\n- Constitución Evol-DD: Art. 6 (multi-agent coordination parallels human teams)\n- Agentes relacionados: evol-pm (project management), evol-change-mgmt (change adoption), evol-ux (user-centered team)\n- Amy Edmondson - \"The Fearless Organization\": psychological safety\n- Patrick Lencioni - \"The Five Dysfunctions of a Team\"\n- Bruce Tuckman - \"Developmental Sequence in Small Groups\"\n- Netflix Culture Deck: culture of freedom and responsibility\n- Google Project Aristotle: psychological safety as #1 factor\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"equipo","disciplina":null,"enBiblioteca":false},{"id":"evol-threat-model-7061b1","nombre":"evol-threat-model","carpeta":"evol-threat-model","descripcion":"Threat-Driven Development. Aplica modelado de amenazas STRIDE antes del desarrollo para definir controles de seguridad obligatorios.","categoria":"discipline-base","origen":null,"licencia":null,"version":null,"triggers":["/threat-model"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-base","trigger":"/threat-model"},"archivos":[{"ruta":"SKILL.md","bytes":5137}],"bytes":5137,"huella":"5ecb06ad9827ddbe","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (132 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-threat-model","enlace":false}],"proyectos":[],"texto":"\n# evol-threat-model\n\n## Fase del Pipeline\nSpec (Fase 2)\n\n## Artefacto Clave\n`docs/specs/THREATS.md`\n\n## Flujo de Trabajo\n\n### 1. Identificar activos y actores adversariales\n```bash\n# Analizar DOMAIN.md para identificar activos criticos\nevol-threat assets --from=docs/specs/DOMAIN.md --output=.evol/threats/assets.json\n\n# Definir actores adversariales\nevol-threat actors --output=.evol/threats/actors.json\n```\n\n### 2. Construir DFD con fronteras de confianza\n```bash\n# Generar Data Flow Diagram desde DOMAIN.md\nevol-threat dfd --from=docs/specs/DOMAIN.md --output=docs/specs/dfd.mermaid\n\n# Identificar fronteras de confianza\nevol-threat trust-boundaries --dfd=docs/specs/dfd.mermaid --output=.evol/threats/trust-zones.json\n```\n\n### 3. Aplicar STRIDE por aggregate y endpoint\n```bash\n# Analizar cada componente del dominio\nevol-threat stride --domain=docs/specs/DOMAIN.md --output=.evol/threats/stride-analysis.json\n\n# Generar THR-NNN desde el analisis\nevol-threat generate --analysis=.evol/threats/stride-analysis.json --output=docs/specs/THREATS.md\n```\n\n### 4. Clasificar amenazas por riesgo\n```bash\n# Evaluar probabilidad e impacto\nevol-threat classify --threats=docs/specs/THREATS.md --output=.evol/threats/classification.json\n\n# Identificar amenazas criticas que bloquean gate\nevol-threat critical --classification=.evol/threats/classification.json --output=.evol/threats/critical.json\n```\n\n### 5. Generar SEC-REQ y stubs STDD\n```bash\n# Generar SEC-REQ-NNN para amenazas criticas\nevol-threat sec-req --critical=.evol/threats/critical.json --output=docs/specs/SEC-REQ.md\n\n# Copiar SEC-REQ-NNN a SPEC.md\nevol-threat copy-sec-req --from=docs/specs/SEC-REQ.md --to=docs/specs/SPEC.md\n\n# Generar stubs STDD desde THREATS.md\nevol-threat stubs --threats=docs/specs/THREATS.md --output=tests/security/\n```\n\n### 6. Validar THREATS.md\n```bash\n# Verificar que todos los aggregates tienen al menos una amenaza\nevol-threat coverage --threats=docs/specs/THREATS.md --domain=docs/specs/DOMAIN.md\n\n# Validar estructura del archivo\nevol-threat validate --file=docs/specs/THREATS.md\n```\n\n## Formato THR-NNN\n\n```markdown\n## THR-001: IDOR en exportacion de facturas\n\n**Categoria STRIDE:** Elevation of Privilege\n**Componente afectado:** Aggregate: Factura\n**Vector de ataque:** IDOR en GET /facturas/:id — acceso a facturas de otro tenant\n**Probabilidad:** HIGH\n**Impacto:** HIGH\n**Riesgo:** CRITICO\n\n### Control propuesto\nEn cada consulta a la tabla `facturas`, agregar una clausula WHERE que verifique\nque `tenant_id` coincide con el `tenant_id` extraido del JWT del solicitante.\n\n### Implementacion obligatoria\n- El repositorio `FacturaRepository.findById(id, tenantId)` siempre recibe el tenantId\n- El servicio extrae el tenantId del contexto de autenticacion, nunca de la URL\n- El test STDD verifica que el acceso cross-tenant retorna 403\n\n**SEC-REQ vinculado:** SEC-REQ-001\n**Security test requerido:** SI\n**Estado:** ABIERTO\n```\n\n## Integración con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Spec | Amenazas se identifican antes del codigo |\n| Spec | SEC-REQ-NNN van a SPEC.md como requisitos |\n| Build | Stubs STDD guian el ciclo de seguridad |\n| QA | SecDD verifica controles en runtime |\n| Retro | Amenazas no mitigadas van a lecciones.md |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/disciplinas/THREAT-DRIVEN.md`\n- [STRIDE — Microsoft Threat Modeling](https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats)\n- [OWASP Threat Modeling](https://owasp.org/www-community/Threat_Modeling)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-base","grupo":"disciplinas","disciplina":{"id":"THREAT","nombre":"Threat-Driven Development","tipo":"base","fases":["spec"]},"enBiblioteca":false},{"id":"evol-udd-usecase-373e0f","nombre":"evol-udd-usecase","carpeta":"evol-udd-usecase","descripcion":"UDD — Use-Case-Driven Development, use case modeling, user story mapping, scenario analysis","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/udd-usecase"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/udd-usecase"},"archivos":[{"ruta":"SKILL.md","bytes":5672}],"bytes":5672,"huella":"fa8b876319ed5c8e","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (91 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-udd-usecase","enlace":false}],"proyectos":[],"texto":"\n# evol-udd-usecase\n\n## Fase del Pipeline\n\n**Briefing (Fase 1) — Análisis de Requisitos**\n\nActivar cuando se necesita modelar casos de uso:\n- Use case modeling (UML)\n- User story mapping\n- Scenario analysis\n- Acceptance criteria definition\n\n## Artefacto Clave\n\n**`docs/usecases/USE_CASES.md`**\n\n```markdown\n# Use Cases\n\n## Actors\n| Actor | Role | Description |\n|-------|------|-------------|\n| Customer | Primary | Places orders and manages account |\n| Admin | Secondary | Manages products and orders |\n| System | Supporting | Payment processing, notifications |\n\n## Use Cases\n| ID | Name | Actor(s) | Priority | Status |\n|----|------|----------|----------|--------|\n| UC-001 | Place Order | Customer | High | Implemented |\n| UC-002 | Process Payment | System | High | Implemented |\n| UC-003 | Manage Inventory | Admin | Medium | In Progress |\n\n## Use Case: Place Order (UC-001)\n### Main Flow\n1. Customer adds items to cart\n2. Customer proceeds to checkout\n3. System displays order summary\n4. Customer confirms order\n5. System creates order\n6. System sends confirmation email\n\n### Alternate Flows\n- 3a. Cart is empty → Display message\n- 4a. Payment fails → Show error, retry\n- 5a. Item out of stock → Notify customer\n\n### Acceptance Criteria\n- [ ] Cart supports up to 50 items\n- [ ] Checkout completes in < 3 steps\n- [ ] Order confirmation shown within 2s\n\n## User Story Map\n```\nBackbone: Place Order → Process Payment → Fulfill Order → Deliver\nTasks: Add to cart → Checkout → Pay → Confirm → Ship → Track\n```\n\n## Scenario Matrix\n| Scenario | Preconditions | Steps | Expected Result |\n|----------|---------------|-------|-----------------|\n| Happy path | Items in stock | 1-6 | Order confirmed |\n| Payment failure | Invalid card | 1-4, 4a | Error shown |\n| Out of stock | Item unavailable | 1-5, 5a | Notification sent |\n```\n\n## Flujo de Trabajo\n\n```bash\n# 1. Capturar requisitos\npython3 scripts/udd/capture-requirements.py \\\n  --source docs/briefing/ \\\n  --output docs/usecases/REQUIREMENTS_RAW.md\n\n# 2. Identificar actores\npython3 scripts/udd/identify-actors.py \\\n  --requirements docs/usecases/REQUIREMENTS_RAW.md \\\n  --output docs/usecases/ACTORS.md\n\n# 3. Generar use cases\npython3 scripts/udd/generate-usecases.py \\\n  --actors docs/usecases/ACTORS.md \\\n  --requirements docs/usecases/REQUIREMENTS_RAW.md \\\n  --output docs/usecases/USE_CASES.md\n\n# 4. Crear user story map\npython3 scripts/udd/story-map.py \\\n  --usecases docs/usecases/USE_CASES.md \\\n  --output docs/usecases/STORY_MAP.md\n\n# 5. Definir acceptance criteria\npython3 scripts/udd/acceptance-criteria.py \\\n  --usecases docs/usecases/USE_CASES.md \\\n  --output docs/usecases/ACCEPTANCE_CRITERIA.md\n\n# 6. Generar scenario matrix\npython3 scripts/udd/scenario-matrix.py \\\n  --usecases docs/usecases/USE_CASES.md \\\n  --output docs/usecases/SCENARIO_MATRIX.md\n```\n\n### User Story Format\n\n```markdown\n## User Story: UC-001-01\n**As a** Customer\n**I want to** add items to my shopping cart\n**So that** I can purchase multiple items in one order\n\n### Acceptance Criteria\n- Given I am on the product page\n  When I click \"Add to Cart\"\n  Then the item is added to my cart\n  And the cart count increases by 1\n\n### Definition of Done\n- [ ] Code complete\n- [ ] Unit tests passing\n- [ ] Integration tests passing\n- [ ] UI reviewed\n```\n\n## Integración con Pipeline\n\n| Fase | Gate | Check | Automático |\n|------|------|-------|------------|\n| Briefing | Use cases defined | Use cases principales documentados | Sí |\n| Spec | Use case details | Flujos y escenarios completos | Sí |\n| Plan | Story mapping | User stories priorizadas | No |\n| Build | Acceptance criteria | Criteria verificables | Sí |\n| QA | Scenario testing | Escenarios validados | Sí |\n| Retro | Use case review | Cobertura evaluada | No |\n\n## Referencia\n\n- **Constitución Art. 1** — Filtro de ambigüedad\n- **Constitución Art. 9** — Fase Briefing del Pipeline\n- **Discipline Doc** — `docs/disciplines/UDD_UseCase.md`\n- **Use Case Modeling** — https://www.uml-diagrams.org/use-case-diagram.html\n- **User Story Mapping** — https://www.jeffpatton.com/resources/\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"UDD","nombre":"Use-Case-Driven Development","tipo":"extendida","fases":["briefing"]},"enBiblioteca":false},{"id":"evol-uxdd-ux-d40401","nombre":"evol-uxdd-ux","carpeta":"evol-uxdd-ux","descripcion":"UX-Driven Development. Disena user journeys, mensajes de UI sin jerga tecnica, y microinteracciones antes de escribir codigo frontend.","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/uxdd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/uxdd"},"archivos":[{"ruta":"SKILL.md","bytes":4337}],"bytes":4337,"huella":"99812ac9a287a322","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (134 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-uxdd-ux","enlace":false}],"proyectos":[],"texto":"\n# evol-uxdd-ux\n\n## Fase del Pipeline\nBriefing (Fase 1)\n\n## Artefacto Clave\n`ux/user_journeys/*.json`\n\n## Flujo de Trabajo\n\n### 1. Generar user journeys desde features\n```bash\n# Leer features y wireframes del briefing\nevol-uxdd journey-generate --features=docs/features/FEATURES.md --wireframes=acuerdos/wireframes/ --output=ux/user_journeys/\n```\n\n### 2. Redactar mensajes de UI\n```bash\n# Generar mensajes sin jerga tecnica\nevol-uxdd ui-messages --journeys=ux/user_journeys/ --output=ux/ui_messages/\n\n# Verificar unicidad de strings\nevol-uxdd check-duplicates --dir=ux/ui_messages/\n```\n\n### 3. Especificar microinteracciones\n```bash\n# Definir feedback y estados de componentes\nevol-uxdd microinteractions --journeys=ux/user_journeys/ --output=ux/microinteractions/\n```\n\n### 4. Validar completitud\n```bash\n# Verificar que todo flujo principal tiene journey\nevol-uxdd validate --journeys=ux/user_journeys/ --features=docs/features/FEATURES.md\n```\n\n## Formato User Journey\n\n```json\n{\n  \"journey\": \"JOURNEY-001\",\n  \"name\": \"Registro de usuario\",\n  \"flow\": [\n    {\n      \"step\": 1,\n      \"action\": \"El usuario hace clic en 'Registrarse'\",\n      \"screen\": \"landing\",\n      \"emotion\": \"curioso\"\n    },\n    {\n      \"step\": 2,\n      \"action\": \"Completa el formulario de registro\",\n      \"screen\": \"register-form\",\n      \"emotion\": \"motivado\"\n    },\n    {\n      \"step\": 3,\n      \"action\": \"Recibe confirmacion por email\",\n      \"screen\": \"confirmation\",\n      \"emotion\": \"satisfecho\"\n    }\n  ],\n  \"error_flows\": [\n    {\n      \"step\": 2,\n      \"error\": \"Email ya registrado\",\n      \"message\": \"Este email ya tiene una cuenta. Puedes iniciar sesion o recuperar tu contrasena.\",\n      \"recovery_action\": \"Link a iniciar sesion\"\n    }\n  ]\n}\n```\n\n## Formato UI Messages\n\n```markdown\n# Mensajes de UI — [Pantalla]\n\n| Clave | Mensaje | Contexto |\n|-------|---------|----------|\n| error.email.duplicate | Este email ya tiene una cuenta. Puedes iniciar sesion o recuperar tu contrasena. | Formulario de registro |\n| success.registration | Tu cuenta ha sido creada. Revisa tu email para confirmar. | Post-registro |\n```\n\n## Integracion con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Briefing | Generar journeys, mensajes y microinteracciones |\n| Spec | Conectar journeys con REQ-NNN |\n| Build | Implementar la UI conforme a los journeys |\n| QA | Verificar que los flujos implementados coinciden |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/constitucion.md` Art. 5 (Domain consulting proactiva)\n- `docs/disciplinas/UXDD.md`\n- [User Journey Maps — Nielsen Norman Group](https://www.nngroup.com/articles/journey-mapping-101/)\n- [Error Message Guidelines — Nielsen Norman Group](https://www.nngroup.com/articles/error-message-guidelines/)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"UXDD","nombre":"UX-Driven Development","tipo":"extendida","fases":["briefing"]},"enBiblioteca":false},{"id":"evol-workflow-design-5b016e","nombre":"evol-workflow-design","carpeta":"evol-workflow-design","descripcion":"Diseño de procesos automatizados, patrones de workflow, CI/CD design e integración de sistemas.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/workflow"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/workflow"},"archivos":[{"ruta":"SKILL.md","bytes":5204}],"bytes":5204,"huella":"1804ceb29fcb8434","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (95 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-workflow-design","enlace":false}],"proyectos":[],"texto":"\n# evol-workflow-design\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita diseñar o mejorar procesos automatizados:\n\n- **Workflow patterns**: secuencia, paralelismo, branching, merging\n- **CI/CD design**: pipelines de integración continua y delivery\n- **System integration**: conectar sistemas heterogéneos\n- **Process automation**: automatizar tareas repetitivas\n- **Error handling**: retry, fallback, compensation, dead letter queues\n- **Orchestration**: coordinar múltiples servicios/tareas\n\n**No usar para**: orquestación de agentes Evol-DD (usar evol-orchestrator), infraestructura (usar evol-devops).\n\n## Conocimiento de Dominio\n\n### Workflow Patterns\n- **Sequential**: A → B → C (simple, predictable)\n- **Parallel**: A → (B | C) → D (faster, concurrent)\n- **Conditional**: A → if X then B else C (decision points)\n- **Loop**: A → B → if not done, back to A (iteration)\n- **Fork-join**: split into parallel, wait for all to complete\n- **Compensation**: undo previous steps if something fails\n\n### CI/CD Design\n- **Build stage**: compile, lint, type check\n- **Test stage**: unit, integration, E2E tests\n- **Security stage**: SAST, dependency scanning, secrets detection\n- **Deploy stage**: staging, canary, production\n- **Rollback**: automatic rollback on failure\n- **Feature flags**: decouple deployment from release\n\n### System Integration\n- **Synchronous**: REST, gRPC (real-time, blocking)\n- **Asynchronous**: queues, events (non-blocking, resilient)\n- **Event-driven**: pub/sub, event sourcing\n- **API gateway**: single entry point, routing, rate limiting\n- **Service mesh**: inter-service communication, observability\n\n### Error Handling\n- **Retry with backoff**: exponential backoff, jitter\n- **Circuit breaker**: stop calling failing service\n- **Fallback**: provide degraded functionality\n- **Dead letter queue**: capture failed messages for investigation\n- **Compensation**: undo completed steps (saga pattern)\n- **Idempotency**: safe to retry, same result\n\n### Process Automation\n- **Rule engines**: business rules without code changes\n- **Scheduled tasks**: cron, time-based triggers\n- **Event-driven**: trigger on events, not time\n- **Human-in-the-loop**: approval steps, manual intervention\n- **Audit trail**: log all actions for compliance\n\n## Flujo de Trabajo\n\n1. **Map current process**: how does it work today? (as-is)\n2. **Identify automation opportunities**: repetitive, error-prone, slow\n3. **Design target process**: how should it work? (to-be)\n4. **Select patterns**: sequential, parallel, event-driven, etc.\n5. **Design error handling**: retry, fallback, compensation\n6. **Implement pipeline**: CI/CD, workflow engine, integration\n7. **Test end-to-end**: happy path, error paths, edge cases\n8. **Monitor and improve**: metrics, alerts, continuous optimization\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: understand current processes, pain points\n- **Spec (Fase 2)**: document workflow requirements, integration points\n- **Plan (Fase 3)**: design workflow architecture, select tools\n- **Build (Fase 4)**: implement workflows with error handling\n- **QA (Fase 5)**: test all paths, error scenarios, edge cases\n- **Retro (Fase 6)**: analyze workflow metrics, identify improvements\n\n## Referencia\n\n- Constitución Evol-DD: Art. 9 (pipeline de 6 fases)\n- Art. 2 (gated workflow patterns)\n- Agentes relacionados: evol-devops (CI/CD), evol-systems-design (system interactions), evol-orchestrator (agent orchestration)\n- Martin Fowler - \"Patterns of Enterprise Application Architecture\"\n- Chris Richardson - \"Microservices Patterns\": saga, circuit breaker\n- Camunda: workflow automation platform\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"descubrimiento","disciplina":null,"enBiblioteca":false},{"id":"findmy-3dd3f4","nombre":"findmy","carpeta":"findmy","descripcion":"Track Apple devices/AirTags via FindMy.app on macOS.","categoria":"apple","origen":null,"licencia":"MIT","version":"1.0.0","triggers":[],"cuandoUsarla":[],"compatible":[],"frontmatter":{"version":"1.0.0","author":"Hermes Agent","license":"MIT","platforms":["macos"],"metadata":{"hermes":{"tags":["FindMy","AirTag","location","tracking","macOS","Apple"]}}},"archivos":[{"ruta":"SKILL.md","bytes":3823}],"bytes":3823,"huella":"fab21db526a70b8f","modificado":"2026-10-22T01:14:35.772Z","nueva":false,"propia":false,"fuente":"hermes","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","text working with TradingView's lightweight-charts — creating charts, adding series (Line/Area/Bar/Candlestick/Histogram), configuring time and price scales, streaming realtime or historical data, panes, markers, per-bar/per-point colors, tooltips, coordinate conversion, custom plugins or primitives, non-financial horizontal scales, SSR/browser loading, or React/Vue/Web Components wrappers. Covers v5 API conventions and the common time, scale, marker, plugin, and wrapper foot-guns.","categoria":"charting","origen":"local","licencia":null,"version":null,"triggers":["lightweight-charts","tradingview charts","financial charts","createChart","addSeries"],"cuandoUsarla":["Creating financial charts with TradingView lightweight-charts","Adding series (Line/Area/Bar/Candlestick/Histogram)","Configuring time and price scales","Streaming realtime or historical data","Working with panes, markers, per-bar colors","Tooltips, coordinate conversion"],"compatible":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"],"frontmatter":{"origin":"local","category":"charting","local_only":true,"when_to_use":["Creating financial charts with TradingView lightweight-charts","Adding series (Line/Area/Bar/Candlestick/Histogram)","Configuring time and price scales","Streaming realtime or historical data","Working with panes, markers, per-bar colors","Tooltips, coordinate conversion","Custom plugins or primitives","React/Vue/Web Components wrappers"],"triggers":["lightweight-charts","tradingview charts","financial charts","createChart","addSeries"],"compatible_with":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"]},"archivos":[{"ruta":"SKILL.md","bytes":29452}],"bytes":29452,"huella":"0afb3445b72dbbc1","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (490 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/lightweight-charts","enlace":false}],"proyectos":[],"texto":"\n# Lightweight Charts skill\n\nWorks the same whether the project is a downstream npm consumer app or an upstream `lightweight-charts` source checkout. Detect which one you are in (below) and resolve every API name from whatever typings are locally available.\n\n## Source lookup order\n\nDo not assume you are inside the upstream source repository.\n\n1. In a consumer app, inspect the installed package first:\n   - `node_modules/lightweight-charts/package.json` for the actual version.\n   - `node_modules/lightweight-charts/dist/typings.d.ts` for the API surface.\n2. In the upstream repo, inspect `dist/typings.d.ts` first, then `src/` if generated output is unavailable.\n3. Use official docs/examples as supporting evidence, but local typings win when they disagree.\n\nVerify before answering (copy-paste):\n\n```sh\nnode -p \"require('./node_modules/lightweight-charts/package.json').version\"\nrg -n \"createSeriesMarkers|addSeries|IPrimitivePaneRenderer|createImageWatermark|createOptionsChart\" node_modules/lightweight-charts/dist/typings.d.ts\n# upstream checkout instead of a consumer app:\nrg -n \"createSeriesMarkers|IPrimitivePaneRenderer|createImageWatermark|createOptionsChart\" dist/typings.d.ts src\n```\n\nIf the relevant file is unavailable, say what could not be verified. Do not invent option names, methods, exports, or wrapper behavior.\n\nIf the user's code imports `from lightweight_charts import ...` (underscore), uses pandas/asyncio, or talks about a Python window wrapper, they are probably using the third-party Python wrapper rather than the TypeScript package. Say that clearly before giving core `lightweight-charts` v5 JavaScript advice.\n\n## Mental model\n\nEight layers, in dependency order. Most bugs come from confusing one for another:\n\n1. **Chart** — `createChart(container, options)` returns an `IChartApi`. One chart per container element.\n2. **Series** — added via `chart.addSeries(SeriesType, options, paneIndex?)`. Each call returns an `ISeriesApi`. v5 requires importing the series type explicitly.\n3. **Scales** — `chart.timeScale()` (`ITimeScaleApi`), `chart.priceScale(id)` (`IPriceScaleApi`). Govern range, ticks, autoscale, visibility.\n4. **Data model** — arrays of `{ time, … }` points. `Time = UTCTimestamp | BusinessDay | string`. `UTCTimestamp` is **seconds**, not milliseconds. Times must be unique and ascending per series.\n5. **Interaction** — `chart.subscribeCrosshairMove`, `chart.subscribeClick`, `timeScale.subscribeVisibleLogicalRangeChange`, etc.\n6. **Layout** — `chart.panes()`, `chart.addPane()`. Adding a series with an out-of-range `paneIndex` auto-creates the pane.\n7. **Extension** — pane primitives, series primitives, custom series, watermarks, custom renderers (canvas via `fancy-canvas`).\n8. **Wrappers** — React/Vue/Web Components/iOS/Android. Lifecycle is the wrapper's responsibility; the core library is framework-agnostic.\n\n## v5 essentials\n\nThe conventions that catch people copying older snippets:\n\n```ts\nimport { createChart, CandlestickSeries, LineSeries } from 'lightweight-charts';\n\nconst chart = createChart(container, { /* ChartOptions */ });\nconst candles = chart.addSeries(CandlestickSeries, { /* options */ });\ncandles.setData([\n    { time: 1700000000, open: 1, high: 2, low: 0.5, close: 1.5 },\n]);\n```\n\nKey v5 changes versus older snippets:\n\n- `chart.addSeries(SeriesType, options, paneIndex?)` replaces `addLineSeries` / `addCandlestickSeries` / …\n- `createSeriesMarkers(series, markers)` replaces `series.setMarkers(...)`. The returned primitive owns `.setMarkers(...)` / `.markers()`.\n- `createTextWatermark(pane, options)` and `createImageWatermark(pane, imageUrl, options)` replace the `watermark` chart option.\n- Series types are tree-shaken — importing them is required for ESM.\n\nIf a snippet calls `addLineSeries` or `series.setMarkers`, it's v4 or older. Confirm the user's version before forwarding it.\n\nWhen the task targets v5, show the v5 API directly — do not hedge by mixing in v4 syntax.\n\n## Triage (problem → API → avoid)\n\n| User asks about | First check | Answer with | Avoid |\n|---|---|---|---|\n| v5 series creation | package version + typings | `chart.addSeries(SeriesType, options)` | `addLineSeries` / `addCandlestickSeries` |\n| markers | `createSeriesMarkers` export | marker primitive + required `color` | `series.setMarkers` |\n| timezone | formatter need vs data semantics | `Intl.DateTimeFormat` in formatters | fake `timeScale.timezone` |\n| realtime updates | last-bar vs full replace | `series.update(point)` | `setData` on every tick |\n| panes | `paneIndex` + `chart.panes()` | v5 pane APIs, `pane.setHeight` | private widget / DOM hacks |\n| per-bar colors | data-point color fields | `color`/`borderColor`/`wickColor` on points | extra series / markers to recolor |\n| plugins | primitive vs custom series | scaffold/examples + public coordinate APIs | invented renderer names |\n| attribution logo | `layout.attributionLogo` | `layout: { attributionLogo: false }` | CSS hiding / DOM manipulation |\n\n### v4 → v5 replacement matrix\n\nStale copy-pasted snippets are the most common failure. Map them directly:\n\n| Old or wrong | v5 replacement |\n|---|---|\n| `chart.addLineSeries(options)` | `chart.addSeries(LineSeries, options)` |\n| `chart.addCandlestickSeries(options)` | `chart.addSeries(CandlestickSeries, options)` |\n| `series.setMarkers(markers)` | `createSeriesMarkers(series, markers)` |\n| chart `watermark` option | `createTextWatermark(chart.panes()[0], options)` |\n| `createImageWatermark(pane, options)` | `createImageWatermark(pane, imageUrl, options)` |\n| `IPanePrimitivePaneRenderer` | `IPrimitivePaneRenderer` |\n| `timeScale: { timezone }` | label formatters using `Intl.DateTimeFormat` |\n| `time: Date.now()` (ms) | `time: Math.floor(Date.now() / 1000)` for `UTCTimestamp` |\n\n## Routing map (problem → where to look)\n\nUse local typings first. The repo paths below exist only in the upstream `lightweight-charts` checkout; in a consumer app, translate them to the installed package typings or official docs.\n\n| Task | Canonical sources |\n|---|---|\n| First chart / series | `website/docs/intro.mdx`, `website/tutorials/customization/` |\n| Time / range behavior | `website/docs/time-scale.md`, `website/docs/time-zones.md` |\n| Realtime / history | `website/tutorials/demos/realtime-updates.{mdx,js}`, `website/tutorials/demos/infinite-history.{mdx,js}` |\n| Whitespace / gaps | `website/tutorials/demos/whitespace.{mdx,js}` |\n| Price format / locale | `website/tutorials/customization/price-format.mdx`, `website/tutorials/demos/custom-locale.{mdx,js}` |\n| Two scales / inverted | `website/tutorials/how_to/two-price-scales.{mdx,js}`, `website/tutorials/how_to/inverted-price-scale.{mdx,js}` |\n| Panes / price + volume | `website/docs/panes.md`, `website/tutorials/how_to/panes.{mdx,js}`, `website/tutorials/how_to/price-and-volume.{mdx,js}` |\n| Markers / tooltips / legends | `website/tutorials/how_to/series-markers.{mdx,js}`, `website/tutorials/how_to/tooltips.mdx`, `website/tutorials/how_to/legends.mdx` |\n| Crosshair (programmatic) | `website/tutorials/how_to/set-crosshair-position*.js` |\n| Watermarks | `website/tutorials/how_to/watermark.mdx` |\n| Plugins / custom series / primitives | `website/docs/plugins/`, `plugin-examples/src/plugins/` |\n| Coordinate conversion / hit-testing | `dist/typings.d.ts` for `subscribeClick`, `coordinateToPrice`, `timeScale().coordinateToLogical` |\n| Non-time horizontal scales / options chart | `dist/typings.d.ts` for `createOptionsChart`, `createChartEx`, `IHorzScaleBehavior` |\n| Pixel-perfect renderi {"ruta":"evals/evals.json","bytes":1458}],"bytes":7658,"huella":"3a64ed953378b5cd","modificado":"2026-10-22T08:40:01.929Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (351 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/readme-master","enlace":false}],"proyectos":[],"texto":"\n# Skill: Readme Master\n\n## Propósito\nEsta skill genera y actualiza archivos `README.md` inyectando la calidad de diseño visual y las narrativas de los proyectos de software más populares (Top 100). Evita la monotonía del texto plano integrando componentes HTML embebidos, diagramas Mermaid, tablas comparativas y un storytelling adaptado al tipo de repositorio, cumpliendo siempre con el estándar estricto de **Evol-DD** (Cero Emojis).\n\n## Uso\nEl agente evaluará el código base o la descripción entregada y reconstruirá el archivo `README.md` siguiendo estrictamente esta arquitectura:\n\n### 1. El Estándar Intermedio (Top 100 + Semántica)\nTodo `README.md` generado debe contener, en orden estricto:\n1. **Hero Visual Atractivo:** Un bloque `<div align=\"center\">` con el `<h1>` principal, y una sola línea hiper-enfocada (Focus Message) describiendo la propuesta de valor.\n2. **Badges Coloridos y Estéticos:** Uso de Shields.io con colores temáticos e íconos (`?logo=python&logoColor=white`) para denotar profesionalismo sin caer en la monotonía.\n3. **Tabla Comparativa (Problema vs Solución):** Una tabla limpia en HTML que contraste el enfoque tradicional vs el enfoque moderno del proyecto.\n4. **Core Features:** Títulos semánticos directos (para que los LLMs y humanos indexen rápido) seguidos de bloques de código Markdown ````bash`` o ````python`` ultracortos.\n5. **Arquitectura:** **Obligatorio un diagrama de arquitectura en Mermaid** (````mermaid`) que describa el sistema.\n6. **Instalación y Desinstalación:** Bloques de código copiables con pasos de ejecución y un apartado explícito para desinstalar.\n7. **Documentación Extendida / FAQ:** Uso de tags `<details>` y `<summary>` para esconder información sin romper el ritmo de lectura.\n\n### 2. Storytelling: Adaptación del Relato\nAntes de escribir, el agente inferirá la naturaleza del repositorio:\n- **Developer Experience (DX):** Si es un Framework, CLI o Herramienta. La narrativa debe ser agresiva hacia la eficiencia (\"Instalar toma 10 segundos, ahorra 3 horas\"). Minimizar teoría, maximizar ejemplos copiables de inmediato.\n- **Ecosistema Open Source:** Si es una librería comunitaria. Enfocarse en la gobernanza y extender el llamado a colaboradores. Usar cuadros o tablas de contribuidores.\n- **Utilitario / Kernel:** Si es una herramienta de bajo nivel. El relato debe ser directo y minimalista.\n\n### 3. Técnicas 2026 de Maquetación HTML\n- **Cero Emojis (Regla Evol-DD):** Está terminantemente prohibido usar emojis. Utiliza caracteres Unicode estéticos como `❖`, `►`, `■`.\n- **Alineación HTML:** Para el Hero y badges, usar `<div align=\"center\">`.\n- **Secciones Colapsables:** Todo bloque de configuración gigante o FAQs deben ir envueltos en `<details><summary><b>► Mostrar Detalle</b></summary><br>... </details>`.\n\n## Ejecución Recursiva\nCuando el usuario solicite la creación o actualización, el agente debe:\n1. Buscar los archivos `README.md` a actualizar (ya sea en la raíz, en una subcarpeta específica, o **todos** los READMEs del proyecto si se solicita de forma global).\n2. Analizar el código fuente adyacente y **escanear el árbol de directorios locales** (buscando específicamente carpetas como `docs/`, o archivos Markdown hermanos) para entender la misión del proyecto y descubrir automáticamente qué enlaces debe incluir en la sección de \"Documentación\".\n3. Rediseñar y escribir cada archivo `README.md` encontrado, aplicando el estándar estructural, HTML y Markdown de manera proporcional a su contexto local.\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"documentation","grupo":"documentacion","disciplina":null,"enBiblioteca":false},{"id":"reddit-reading-9979d2","nombre":"reddit-reading","carpeta":"reddit-reading","descripcion":"Read Reddit: subreddits, search, threads, users. No browser.","categoria":"social-media","origen":null,"licencia":"MIT","version":"1.0.0","triggers":[],"cuandoUsarla":[],"compatibl
