:"Hermes Agent (adapted from obra/superpowers)","license":"MIT","platforms":["linux","macos","windows"],"metadata":{"hermes":{"tags":["testing","tdd","development","quality","red-green-refactor"],"related_skills":["systematic-debugging","subagent-driven-development"]}}},"archivos":[{"ruta":"SKILL.md","bytes":10300}],"bytes":10300,"huella":"95ed2d20a4206f5f","modificado":"2026-10-22T01:07:27.577Z","nueva":false,"propia":false,"fuente":"hermes","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (51 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"hermes","agente":"hermes","ruta":"~/.hermes/skills/software-development/test-driven-development","enlace":false}],"proyectos":[],"texto":null},{"id":"update-context-fe3408","nombre":"update-context","carpeta":"update-context","descripcion":"Sincroniza contexto entre IDEs/maquinas usando archivos de memoria actualizados. Usar al cambiar de IDE o maquina para que el agente conozca lo que otro entorno hizo. Requiere git pull previo para traer cambios remotos.","categoria":"context","origen":null,"licencia":null,"version":null,"triggers":["/update-context","sincronizar contexto","actualizar contexto","sync context"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"context","trigger":"/update-context","triggers":["/update-context","sincronizar contexto","actualizar contexto","sync context"]},"archivos":[{"ruta":"SKILL.md","bytes":4616}],"bytes":4616,"huella":"d97502b33f0c479d","modificado":"2026-10-22T08:40:01.929Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (219 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/update-context","enlace":false}],"proyectos":[],"texto":"\n# /update-context — Sincronizacion Cross-Environment\n\n> Cuando trabajas en 2+ IDEs/maquinas sobre el mismo proyecto, `/update-context`\n> lee todos los archivos de memoria que `/update-memory` actualiza y te inyecta\n> el contexto completo usando busqueda hibrida v2 (vector + BM25 + graph).\n\n---\n\n## Protocolo\n\nAl recibir `/update-context`, ejecutar en orden:\n\n### 1. Sync git (obligatorio)\n\n```bash\ngit pull --ff-only 2>/dev/null || echo \"[sync] No hay repo remoto o hay conflictos de merge\"\n```\n\nSi hay conflictos de merge, informar al usuario y pedir resolucion antes de continuar.\n\n### 2. Leer archivos de memoria\n\nLeer los siguientes archivos y extraer los puntos clave de cada uno:\n\n| Archivo | Que extraer |\n|---------|-------------|\n| `acuerdos/memoria/decisiones.md` | Ultimas 5 decisiones arquitectonicas |\n| `acuerdos/memoria/convenciones.md` | Convenciones activas (no todas, solo las relevantes) |\n| `acuerdos/memoria/riesgos.md` | Riesgos activos (no mitigados) |\n| `acuerdos/memoria/MEMORY.md` | Agregado de atomos (resumen general) |\n| `lecciones.md` | Ultimas 3 lecciones relevantes |\n| `memoria.md` | Estado actual del proyecto, fase, ultimo hito |\n| `AGENT_MEMORY.md` | Preferencias del agente/usuario |\n| `WORKING-CONTEXT.md` | Branch activo, fase, proximo paso |\n\n### 3. Memory v2.0: Hybrid Search\n\nUsar busqueda hibrida v2 para contexto relevante:\n\n```bash\n# Buscar decisiones recientes\npython3 scripts/evol-memory.py edms-hybrid-search \"decisiones arquitectonicas\" --top-k 5\n\n# Buscar lecciones relevantes\npython3 scripts/evol-memory.py edms-hybrid-search \"lecciones aprendidas\" --top-k 3\n\n# Buscar riesgos activos\npython3 scripts/evol-memory.py edms-hybrid-search \"riesgos activos\" --top-k 3\n\n# Verificar entidades del proyecto\npython3 scripts/evol-memory.py edms-entity \"proyecto\" --type technology\n```\n\nSi los comandos v2 no estan disponibles o retornan vacio, continuar con los archivos planos (no es bloqueante).\n\n### 4. Presentar resumen estructurado\n\nDespues de leer todos los archivos, presentar un resumen estructurado:\n\n```\n=== Contexto Sincronizado (v2) ===\n\n[RAMA] Branch: <branch>, Fase: <fase>, Version: <version>\n\n[DECISIONES]\n- <decision 1>\n- <decision 2>\n- <decision 3>\n- <decision 4>\n- <decision 5>\n\n[CONVENCIONES]\n- <convencion 1>\n- <convencion 2>\n- <convencion 3>\n\n[RIESGOS]\n- <riesgo activo 1>\n- <riesgo activo 2>\n\n[LECCIONES]\n- <leccion 1>\n- <leccion 2>\n- <leccion 3>\n\n[ESTADO] <ultimo hito>\n[PROXIMO] <siguiente paso]\n\n[PREFERENCIAS]\n- <preferencia 1>\n- <preferencia 2>\n- <preferencia 3>\n\n[v2 ENTIDADES]\n- <entidad 1>: <tipo> (confianza: <confianza>)\n\n[v2 HIBRIDA]\n- <resultado 1>: <score>\n\n============================\n```\n\n### 5. EDMS Index (opcional)\n\nAlmacenar el contexto sincronizado para futuras busquedas:\n\n```bash\npython3 scripts/evol-memory.py edms-store \"$(cat WORKING-CONTEXT.md)\" --tipo contexto\npython3 scripts/evol-memory.py edms-extract \"$(cat acuerdos/memoria/decisiones.md)\"\npython3 scripts/evol-memory.py edms-link \"$(cat acuerdos/memoria/decisiones.md)\"\n```\n\n### 6. Confirmar\n\nAl finalizar, informar:\n- Cuantos archivos se leyeron\n- Si `git pull` trajo cambios nuevos\n- Si el contexto esta actualizado o hay drift\n- **v2**: Cuantas entidades se extrajeron\n- **v2**: Cuantos resultados hibridos se encontraron\n\n---\n\n## Relacion con otros comandos\n\n| Comando | Quando usar |\n|---------|-------------|\n| `/update-memory` | Actualizar la memoria del proyecto (atomos, lecciones, MEMORY.md) |\n| `/update-context` | Sincronizar contexto desde archivos actualizados por otro entorno |\n| `session:start:context-load` | Hook automatico al iniciar sesion (ligero, ~170 tokens) |\n\n---\n\n## Ejemplo de uso\n\n```\nUsuario: /update-context\n\nAgente:\n1. Ejecuta git pull -> \"3 archivos actualizados desde remoto\"\n2. Lee los 8 archivos de memoria\n3. Ejecuta busquedas hibridas v2\n4. Presenta resumen:\n   [RAMA] Branch: feature/edms-ui, Fase: F7, Version: 0.6.3\n   [DECISIONES]\n   - TUI scaffold completado: 29 archivos\n   - Wireframes EDMS aprobados: 9 pantallas\n   - ...\n   [RIESGOS]\n   - VERSION drift: pyproject.toml=0.6.3 vs VERSION=0.6.0\n   - ...\n   [ESTADO] TUI scaffold completada y smoke-testeada\n   [PROXIMO] Validar TUI con usuario\n   ...\n```\n","cuerpoCompleto":true,"categoriaOriginal":"context","grupo":"contexto","disciplina":null,"enBiblioteca":false},{"id":"update-memory-c650a2","nombre":"update-memory","carpeta":"update-memory","descripcion":"Revisa y actualiza todos los documentos de memoria persistente (decisiones, convenciones, riesgos) con Memory v2.0. Ejecutar despues de cambios significativos o al final de sesion.","categoria":"memory","origen":null,"licencia":null,"version":null,"triggers":["/update-memory","actualizar memoria","sincronizar memoria"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"memory","trigger":"/update-memory","triggers":["/update-memory","actualizar memoria","sincronizar memoria"]},"archivos":[{"ruta":"SKILL.md","bytes":4512}],"bytes":4512,"huella":"15e32af10c290932","modificado":"2026-10-22T08:40:01.929Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (180 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/update-memory","enlace":false}],"proyectos":[],"texto":"\n# /update-memory — Actualizacion de Memoria Persistente\n\n> Gatillo global para mantener **todo el ecosistema de Memoria Persistente** estructurado y actualizado usando Memory v2.0.\n\n## 1. Revision de Contexto\n\n### 0. Sync git (obligatorio antes de leer)\n```bash\ngit pull --ff-only 2>/dev/null || echo \"[sync] Conflicto de merge — resolver ANTES de continuar con update-memory\"\n```\nSi hay conflictos de merge, **detenerse** y pedir resolucion al usuario. No continuar con pasos 1-4 hasta que el repo este limpio.\n\n### 1. Leer estado actual\nEl agente **debe** leer el estado actual del repositorio, los ultimos cambios en codigo, los commits recientes y los siguientes documentos de memoria:\n- `WORKING-CONTEXT.md` (estado activo de desarrollo).\n- `acuerdos/memoria/` (`decisiones.md`, `convenciones.md`, `riesgos.md`).\n- `lecciones.md` (errores recientes o aprendizajes).\n- `AGENT_MEMORY.md` (comportamiento y estilo del usuario).\n- `memoria.md` (bitacora y flight recorder).\n\n## 2. Actualizacion de Capas de Memoria\nEl agente procedera a actualizar sistematicamente las capas:\n\n### A. Memoria Estructural (Atomos)\n- Si existen nuevas decisiones arquitectonicas, dependencias, o convenciones adoptadas que no esten registradas, el agente actualizara `acuerdos/memoria/decisiones.md` y `convenciones.md`.\n- Si hay riesgos mitigados o nuevos, se actualizara `acuerdos/memoria/riesgos.md`.\n\n### B. Aprendizajes y Errores\n- Extraer lecciones recientes de las interacciones, herramientas o bloqueos y anadirlas al archivo `lecciones.md` siguiendo el formato estandar de categorias.\n\n### C. Preferencias del Agente/Usuario\n- Anotar cualquier nuevo patron de interaccion, preferencia de codigo o regla descubierta en el archivo `AGENT_MEMORY.md`.\n\n### D. Bitacora del Proyecto\n- Registrar el estado actual de alto nivel, la fase de desarrollo y las tareas completadas en `memoria.md` para mantener el *flight recorder* actualizado.\n\n## 3. Memory v2.0 Integration\nUna vez actualizados los atomos, ejecutar los siguientes comandos v2:\n\n### 3.1 Verbatim Storage\n```bash\n# Almacenar atomos actualizados en verbatim store\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/convenciones.md)\" --tipo convencion\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/riesgos.md)\" --tipo riesgo\n```\n\n### 3.2 Entity Extraction\n```bash\n# Extraer entidades de los atomos\npython3 scripts/evol-memory.py edms-extract \"$(cat acuerdos/memoria/decisiones.md)\"\npython3 scripts/evol-memory.py edms-extract \"$(cat acuerdos/memoria/convenciones.md)\"\npython3 scripts/evol-memory.py edms-extract \"$(cat acuerdos/memoria/riesgos.md)\"\n```\n\n### 3.3 Auto-Linking\n```bash\n# Crear relaciones entre entidades\npython3 scripts/evol-memory.py edms-link \"$(cat acuerdos/memoria/decisiones.md)\"\npython3 scripts/evol-memory.py edms-link \"$(cat acuerdos/memoria/convenciones.md)\"\n```\n\n### 3.4 Conflict Detection\n```bash\n# Detectar contradicciones en la memoria\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n## 4. Consolidacion\n- Una vez actualizados los atomos de la Memoria Estructural, el agente debe ejecutar `python3 scripts/evol-memory.py memory-split` para asegurar que el `MEMORY.md` agregado se regenere.\n- Verificar integridad con `python3 scripts/evol-memory.py edms-verify`.\n\n## Criterios de Salida\n1. Los 3 atomos de memoria en `acuerdos/memoria/` reflejan el estado real del proyecto.\n2. El agregado `MEMORY.md` esta sincronizado.\n3. Nuevas lecciones han sido indexadas en `lecciones.md`.\n4. La bitacora `memoria.md` y el estado `AGENT_MEMORY.md` estan al dia.\n5. **v2**: Atomos almacenados en verbatim store.\n6. **v2**: Entidades extraidas y relaciones creadas.\n7. **v2**: Sin conflictos detectados.\n\n---\n\n## Relacion con otros comandos\n\n| Comando | Quando usar |\n|---------|-------------|\n| `/update-memory` | Actualizar la memoria del proyecto (atomos, lecciones, MEMORY.md) |\n| `/update-context` | Sincronizar contexto desde archivos actualizados por otro entorno |\n| `session:start:context-load` | Hook automatico al iniciar sesion (ligero, ~170 tokens) |\n","cuerpoCompleto":true,"categoriaOriginal":"memory","grupo":"contexto","disciplina":null,"enBiblioteca":false},{"id":"weekly-review-planning-91939e","nombre":"weekly-review-planning","carpeta":"weekly-review-planning","descripcion":"Weekly reset: commitments, stalled work, next-week plan.","categoria":"productivity","origen":null,"licencia":"MIT","version":"0.1.0","triggers":[],"cuandoUsarla":[],"compatible":[],"frontmatter":{"version":"0.1.0","author":"Ben Barclay (benbarclay), Hermes Agent","license":"MIT","platforms":["linux","macos","windows"],"metadata":{"hermes":{"tags":["Weekly-Review","Planning","Tasks","Calendar","Productivity"],"related_skills":["obsidian","notion","airtable","google-workspace","email-inbox-triage"]}}},"archivos":[{"ruta":"SKILL.md","bytes":3975}],"bytes":3975,"huella":"cbfe6632b24c9418","modificado":"2026-10-22T01:07:27.576Z","nueva":false,"propia":false,"fuente":"hermes","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (56 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"hermes","agente":"hermes","ruta":"~/.hermes/skills/productivity/weekly-review-planning","enlace":false}],"proyectos":[],"texto":null},{"id":"xlsx-dcc91e","nombre":"xlsx","carpeta":"xlsx","descripcion":"Use this skill any time a spreadsheet file is the primary input or output. This means any task where the user wants to: open, read, edit, or fix an existing .xlsx, .xlsm, .xltx, .csv, or .tsv file (e.g., adding columns, computing formulas, formatting, charting, cleaning <script>const PHASES = ["briefing", "spec", "plan", "build", "qa", "retro"];
const PHASE_INFO = {
  briefing: ["Briefing", "Entender el problema y qué se pide"],
  spec: ["Spec", "Definir qué se construye y cómo se acepta"],
  plan: ["Plan", "Cómo y en qué orden se hace"],
  build: ["Build", "Construir guiado por pruebas"],
  qa: ["QA", "Verificar y asegurar"],
  retro: ["Retro", "Registrar lo aprendido"],
  done: ["Terminado", "Todas las fases aprobadas"],
};

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}
const svgNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, ...kids) {
  const node = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null && v !== false) node.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null) node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return node;
}
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const today = new Date();
  const hm = d.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === today.toDateString()) return `hoy ${hm}`;
  return d.toLocaleDateString("es", { day: "numeric", month: "short" }) + ` ${hm}`;
}
const fmtNum = (n) => new Intl.NumberFormat("es").format(n);
function storeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } }

/* ---------- theme ---------- */
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme(storeGet("evol-theme"));

/* ---------- shell ---------- */
function shell(current) {
  const links = [["index.html", "Tablero", "tablero"], ["proyecto.html", "Proyecto", "proyecto"], ["documentacion.html", "Documentación", "documentacion"], ["skills.html", "Skills", "skills"], ["grafos.html", "Grafos", "grafos"]];
  const top = el("header", { class: "top" }, el("div", { class: "top-in" },
    el("a", { class: "brand", href: "index.html" }, "evol", el("span", { text: " · panel" })),
    el("nav", { class: "nav", "aria-label": "Principal" }, links.map(([h, t, id]) => el("a", { href: h, "aria-current": id === current ? "page" : false }, t))),
    el("div", { class: "spacer" }),
    el("span", { class: "badge-data", title: "Todo lo que ves sale del estado real de los proyectos, no de ejemplos inventados" }, "Datos reales · " + EVOL.generado),
    el("button", { class: "icon-btn", type: "button", "aria-label": "Cambiar tema", onclick: () => {
      const cur = document.documentElement.getAttribute("data-theme");
      const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      const next = dark ? "light" : "dark"; applyTheme(next); storeSet("evol-theme", next);
    } }, "Tema")));
  document.body.prepend(top);
}

/* ---------- domain: what the real data says about a project ---------- */
function discOk(d) { return d.artefactos.every((a) => a.encontrados >= a.min && a.pendientes === 0); }
function progress(p) {
  const ds = p.estado.disciplinas;
  return { ok: ds.filter(discOk).length, total: ds.length };
}
function badge(p) {
  const e = p.estado;
  if (e.fase === "done") return { tone: "good", icon: "✓", text: "Terminado" };
  if (p.problemas.length > 0) return { tone: "serious", icon: "!", text: `Bloqueado · ${p.problemas.length}` };
  if (e.aprobacion.state === "vigente") return { tone: "info", icon: "→", text: "Aprobada", full: "Aprobada: falta ejecutar evol next" };
  if (e.aprobacion.state === "obsoleta") return { tone: "warning", icon: "!", text: "Aprobación obsoleta" };
  if (e.aprobacion.state === "no-integro") return { tone: "critical", icon: "×", text: "Registro no íntegro" };
  return { tone: "good", icon: "✓", text: "Listo para aprobar" };
}
function statusChip(b) { return el("span", { class: "st " + b.tone, title: b.full || b.text }, el("i", { "aria-hidden": "true", text: b.icon }), b.text); }
function stepsBar(p) {
  const e = p.estado;
  return el("div", { class: "steps", role: "img", "aria-label": "Pipeline: " + PHASES.map((ph) => `${ph} ${e.adoptadas.includes(ph) ? "adoptada" : e.completadas.includes(ph) ? "hecha" : e.fase === ph ? "actual" : "pendiente"}`).join(", ") },
    PHASES.map((ph) => el("span", { class: e.adoptadas.includes(ph) ? "adopted" : e.completadas.includes(ph) ? "done" : e.fase === ph ? "now" : "", title: PHASE_INFO[ph][0] })));
}
function projectById(id) { return EVOL.portfolio.find((p) => p.id === id); }

/* ---------- tooltip (enhances; every value is also in a table) ---------- */
let tipEl;
function tip(content, x, y) {
  if (!tipEl) { tipEl = el("div", { class: "tip", role: "tooltip" }); document.body.append(tipEl); }
  if (content == null) { tipEl.style.display = "none"; return; }
  tipEl.replaceChildren(...[].concat(content));
  tipEl.style.display = "block";
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
  tipEl.style.top = Math.min(y + 14, innerHeight - h - 8) + "px";
}

/* ---------- heat ramp: few = blue, many = red (hubs stand out, like a force-directed network map) ---------- */
const HEAT_STOPS = [[0, [42, 120, 214]], [0.25, [47, 179, 106]], [0.5, [200, 214, 58]], [0.72, [245, 166, 35]], [1, [229, 36, 29]]];
function heat(t) {
  const x = Math.max(0, Math.min(1, t));
  for (let i = 1; i < HEAT_STOPS.length; i++) {
    const [t1, c1] = HEAT_STOPS[i];
    if (x <= t1) {
      const [t0, c0] = HEAT_STOPS[i - 1], k = (x - t0) / (t1 - t0 || 1);
      return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * k)).join(",")})`;
    }
  }
  return "rgb(229,36,29)";
