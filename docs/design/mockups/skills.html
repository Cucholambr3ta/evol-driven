 page }) => {\n    await loginAs(page, 'operador-admin');\n    const response = await page.request.get('/api/reportes/2026-03/pdf');\n    expect(response.status()).toBe(404);\n  });\n\n});\n```\n\n## Integración con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Briefing | Escribir stubs de acceptance tests (FAILING BY DESIGN) |\n| Build | Implementar feature hasta que stubs pasen |\n| QA | Ejecutar suite completa; 100% passing en Tier 2 |\n| Gate | Bloquea merge si algun acceptance test falla |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/constitucion.md` Art. 8 (Mandato de testing)\n- `docs/disciplinas/ATDD.md`\n- [ATDD by Example — Markus Gartner (2012)](https://www.oreilly.com/library/view/atdd-by-example/9780132542883/)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-base","grupo":"disciplinas","disciplina":{"id":"ATDD","nombre":"Acceptance Test-Driven Development","tipo":"base","fases":["briefing","qa"]},"enBiblioteca":false},{"id":"evol-balance-a5baec","nombre":"evol-balance","carpeta":"evol-balance","descripcion":"Balance de carga y optimización de recursos en el sistema Evol-DD. Aplica patrones de workload balancing, resource allocation y performance optimization.","categoria":"game-inspired","origen":null,"licencia":null,"version":null,"triggers":["/balance"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"game-inspired","trigger":"/balance"},"archivos":[{"ruta":"SKILL.md","bytes":5269}],"bytes":5269,"huella":"fd32e106594f379d","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (153 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-balance","enlace":false}],"proyectos":[],"texto":"\n# evol-balance\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita optimizar la distribución de carga y recursos:\n\n- **Workload balancing**: distribuir tareas entre agentes equitativamente\n- **Resource allocation**: asignar CPU, memoria, tokens de LLM, tiempo de humanos\n- **Performance optimization**: identificar cuellos de botella, optimizar throughput\n- **Capacity planning**: prever necesidades futuras de recursos\n- **Bottleneck analysis**: encontrar y resolver cuellos de botella\n- **Cost optimization**: maximizar valor por unidad de recurso\n\n**No usar para**: diseño de sistemas de interacción (usar evol-systems-design), timing del pipeline (usar evol-pacing).\n\n## Conocimiento de Dominio\n\n### Workload Balancing\n- **Round-robin**: distribución circular simple, no considera capacidad\n- **Weighted distribution**: asignar carga proporcional a capacidad\n- **Least connections**: enviar trabajo al agente con menos carga actual\n- **Resource-aware routing**: routing basado en disponibilidad de recursos\n\n### Resource Allocation\n- **Token budgets**: asignar presupuestos de tokens por agente/tarea\n- **Time boxing**: limitar tiempo máximo por tarea\n- **Priority queues**: tareas de mayor prioridad primero\n- **Preemption**: interrumpir tareas de baja prioridad para high priority\n\n### Performance Optimization\n- **Amdahl's Law**: speedup limitado por la parte serial del sistema\n- **Little's Law**: L = λW (items in system = arrival rate × wait time)\n- **Queuing theory**:理解 tiempos de espera y throughput\n- **Caching strategies**: cache hit/miss, invalidation, warming\n\n### Capacity Planning\n- **Horizontal scaling**: más instancias, no más potentes\n- **Vertical scaling**: instancias más potentes, no más\n- **Auto-scaling**: escalar basado en métricas (CPU, queue depth, etc.)\n- **Graceful degradation**: funcionar con menos recursos, no fallar\n\n### Cost Optimization\n- **Cost per task**: cuánto cuesta cada tarea en recursos\n- **ROI por agente**: retorno de inversión por agente\n- **Spot instances**: usar recursos baratos para workloads flexibles\n- **Reserved capacity**: comprometerse a cambio de descuento\n\n## Flujo de Trabajo\n\n1. **Mapear recursos actuales**: ¿Qué hay? (agentes, LLM tokens, tiempo humano, infra)\n2. **Medir utilización**: trackear uso real vs. capacidad disponible\n3. **Identificar cuellos de botella**: dónde se acumula trabajo, dónde hay idle\n4. **Redistribuir carga**: reasignar tareas para equilibrar utilización\n5. **Optimizar resource allocation**: ajustar budgets, prioridades, limits\n6. **Implementar métricas**: throughput, latency, utilization, cost\n7. **Planificar capacidad**: prever necesidades futuras, escalar proactivamente\n8. **Monitorear y ajustar**: continuous optimization basado en datos reales\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: entender recursos disponibles y constraints\n- **Spec (Fase 2)**: documentar requisitos de recursos por fase\n- **Plan (Fase 3)**: asignar recursos a fases, identificar dependencias de recursos\n- **Build (Fase 4)**: monitorear uso de recursos, optimizar en tiempo real\n- **QA (Fase 5)**: testear con carga real, identificar bottlenecks\n- **Retro (Fase 6)**: analizar eficiencia de uso de recursos, planificar mejoras\n\n## Referencia\n\n- Constitución Evol-DD: Art. 6 (orquestación multi-agente)\n- Art. 2 (pipeline con gates - resource allocation)\n- Agentes relacionados: evol-systems-design (diseño de sistemas), evol-devops (infra), evol-pm (capacity planning)\n- Tom DeMarco - \"Peopleware\": human factors in productivity\n- Gene Kim - \"The Phoenix Project\": theory of constraints in dev\n- opsdev.io: DevOps metrics and optimization\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"game-inspired","grupo":"operacion","disciplina":null,"enBiblioteca":false},{"id":"evol-bdd-behavior-d12a7f","nombre":"evol-bdd-behavior","carpeta":"evol-bdd-behavior","descripcion":"Behavior-Driven Development. Convierte criterios de aceptacion en especificaciones Gherkin ejecutables con escenarios de tres tiers.","categoria":"discipline-base","origen":null,"licencia":null,"version":null,"triggers":["/bdd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-base","trigger":"/bdd"},"archivos":[{"ruta":"SKILL.md","bytes":4646}],"bytes":4646,"huella":"feda8029a501ff21","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (132 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-bdd-behavior","enlace":false}],"proyectos":[],"texto":"\n# evol-bdd-behavior\n\n## Fase del Pipeline\nBriefing + QA (Fase 1+5)\n\n## Artefacto Clave\n`tests/features/*.feature`\n\n## Flujo de Trabajo\n\n### 1. Generar archivos .feature skeleton\n```bash\n# Desde criterios de aceptacion en FEATURES.md\nevol-bdd generate --from=docs/features/FEATURES.md --output=tests/features/\n\n# Por epica especifica\nevol-bdd generate --epic=EPIC-001 --output=tests/features/\n```\n\n### 2. Escribir escenarios Gherkin\n```bash\n# Validar sintaxis Gherkin\nevol-bdd validate --file=tests/features/feature-001.feature\n\n# Verificar vocabulario contra DOMAIN.md\nevol-bdd check-vocab --file=tests/features/feature-001.feature --domain=docs/specs/DOMAIN.md\n```\n\n### 3. Implementar step definitions\n```bash\n# Generar steps stub\nevol-bdd stub-steps --feature=tests/features/feature-001.feature --output=tests/steps/\n\n# Verificar que todos los steps tienen implementacion\nevol-bdd dry-run --features=tests/features/\n```\n\n### 4. Ejecutar suite BDD\n```bash\n# Ejecutar todos los tests BDD\nnpx playwright test --grep @bdd\n\n# Ejecutar un feature especifico\nnpx playwright test tests/features/feature-001*\n\n# Generar reporte HTML\nnpx playwright test --reporter=html\n```\n\n### 5. Validar cobertura de escenarios\n```bash\n# Verificar estructura de tres tiers\nevol-bdd check-tiers --features=tests/features/\n\n# Contar escenarios por tier\nevol-bdd count --features=tests/features/ --output=tests/results/bdd-coverage.json\n```\n\n## Formato Gherkin\n\n```gherkin\nFeature: Exportar reporte PDF\n  Como operador administrador\n  Quiero exportar el reporte de facturacion en PDF\n  Para entregarlo a los clientes\n\n  Background:\n    Given el operador esta autenticado con rol \"administrador\"\n\n  @happy-path\n  Scenario: Exportar reporte de periodo vigente\n    Given existe un Periodo de Facturacion del \"2026-05-01\" al \"2026-05-31\"\n    When el operador solicita exportar el reporte del periodo \"2026-05\"\n    Then el sistema genera un PDF con los totales\n    And el PDF incluye la fecha de generacion\n\n  @error\n  Scenario: Rechazar exportacion sin datos\n    Given no existen clientes en el Periodo de Facturacion \"2026-03\"\n    When el operador solicita exportar el reporte del periodo \"2026-03\"\n    Then el sistema muestra el error \"No hay datos para el periodo seleccionado\"\n\n  @edge\n  Scenario: Exportar reporte con un solo cliente\n    Given existe exactamente 1 cliente en el Periodo de Facturacion \"2026-05\"\n    When el operador solicita exportar el reporte del periodo \"2026-05\"\n    Then el sistema genera un PDF con los datos del unico cliente\n```\n\n## Integración con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Briefing | Crear archivos .feature skeleton por epica |\n| Spec | Verificar vocabulario Gherkin contra DOMAIN.md |\n| Build | Implementar step definitions |\n| QA | Ejecutar suite completa; 100% passing en Tier 2 |\n\n## Referencia\n- `docs/constitucion.md` Art. 9 (Evol-DD Pipeline)\n- `docs/disciplinas/BDD.md`\n- [Gherkin Reference — Cucumber](https://cucumber.io/docs/gherkin/reference/)\n- [Introducing BDD — Dan North (2006)](https://dannorth.net/introducing-bdd/)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-base","grupo":"disciplinas","disciplina":{"id":"BDD","nombre":"Behavior-Driven Development","tipo":"base","fases":["briefing","qa"]},"enBiblioteca":false},{"id":"evol-ccdd-contract-112c40","nombre":"evol-ccdd-contract","carpeta":"evol-ccdd-contract","descripcion":"Consumer-Driven Contract Development. Verifica que el proveedor cumple los contratos de consumidor (Pact), bloqueando si algun contrato se rompe.","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/ccdd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/ccdd"},"archivos":[{"ruta":"SKILL.md","bytes":4759}],"bytes":4759,"huella":"cde7919d92353fd1","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (145 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-ccdd-contract","enlace":false}],"proyectos":[],"texto":"\n# evol-ccdd-contract\n\n## Fase del Pipeline\nQA (Fase 5)\n\n## Artefacto Clave\n`tests/contract/*.contract.test.ts`\n\n## Flujo de Trabajo\n\n### 1. Publicar contratos de consumidor\n```bash\n# Consumidores publican sus expectativas al broker\nevol-ccdd publish --consumer=consumers/frontend/ --broker=$PACT_BROKER_URL\n\n# Listar contratos registrados\nevol-ccdd list-contracts --broker=$PACT_BROKER_URL\n```\n\n### 2. Descargar contratos del broker\n```bash\n# Descargar contratos pendientes de verificacion\nevol-ccdd fetch --provider=api-service --broker=$PACT_BROKER_URL --output=tests/contract/pacts/\n\n# Generar tests de verificacion desde contratos\nevol-ccdd generate-tests --pacts=tests/contract/pacts/ --output=tests/contract/\n```\n\n### 3. Ejecutar verificacion del proveedor\n```bash\n# Ejecutar tests de contrato\nnpx vitest run tests/contract/ --reporter=json --output=tests/contract/results.json\n\n# Publicar resultado al broker\nevol-ccdd publish-result --results=tests/contract/results.json --broker=$PACT_BROKER_URL\n```\n\n### 4. Verificar que todos los contratos pasaron\n```bash\n# Validar 100% contratos verificados\nevol-ccdd verify-all --results=tests/contract/results.json --block-on=failure\n\n# Generar reporte\nevol-ccdd report --results=tests/contract/results.json --output=tests/contract/verification_results.json\n```\n\n## Formato Contract Test\n\n```typescript\n// tests/contract/frontend.contract.test.ts\nimport { describe, it, expect } from 'vitest';\nimport { Pact } from '@pact-foundation/pact';\n\nconst provider = new Pact({\n  consumer: 'frontend',\n  provider: 'api-service',\n  port: 1234,\n});\n\ndescribe('Contrato: Frontend -> API Service', () => {\n\n  it('GET /api/usuarios retorna lista de usuarios', async () => {\n    await provider.addInteraction({\n      state: 'usuarios existen',\n      uponReceiving: 'una peticion GET /api/usuarios',\n      withRequest: {\n        method: 'GET',\n        path: '/api/usuarios',\n      },\n      willRespondWith: {\n        status: 200,\n        body: {\n          usuarios: [{ id: 'usr_001', nombre: 'Ana' }],\n        },\n      },\n    });\n\n    const response = await fetch('http://localhost:1234/api/usuarios');\n    expect(response.status).toBe(200);\n  });\n\n});\n```\n\n## Formato verification_results.json\n\n```json\n{\n  \"provider\": \"api-service\",\n  \"timestamp\": \"2026-06-07T10:00:00Z\",\n  \"contracts_verified\": 3,\n  \"contracts_passed\": 3,\n  \"contracts_failed\": 0,\n  \"results\": [\n    {\n      \"consumer\": \"frontend\",\n      \"status\": \"passed\",\n      \"interactions\": 5\n    }\n  ]\n}\n```\n\n## Integracion con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Spec | Los consumidores declaran sus expectativas |\n| QA | El proveedor verifica todos los contratos |\n| Retro | Revisar contratos rotos historicos |\n| Gate | Bloquea si el proveedor rompe algun contrato de consumidor |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/constitucion.md` Art. 9 (Evol-DD Pipeline)\n- `docs/disciplinas/CCDD.md`\n- [Consumer-Driven Contracts — Martin Fowler](https://martinfowler.com/articles/consumerDrivenContracts.html)\n- [Pact Foundation](https://github.com/pact-foundation)\n- [Pact — CI/CD Setup Guide](https://docs.pact.io/ci_cd)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"CCDD","nombre":"Consumer-Driven Contract Testing","tipo":"extendida","fases":["qa"]},"enBiblioteca":false},{"id":"evol-cdcdd-390e18","nombre":"evol-cdcdd","carpeta":"evol-cdcdd","descripcion":"Change Data Capture-Driven Development. Disena pipelines CDC log-based con transformaciones trazables y SLOs de latencia de replicacion.","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/cdc"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/cdc"},"archivos":[{"ruta":"SKILL.md","bytes":4691}],"bytes":4691,"huella":"ce7bed2328072f50","modificado":"2026-10-22T08:40:01.926Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (136 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-cdcdd","enlace":false}],"proyectos":[],"texto":"\n# evol-cdcdd\n\n## Fase del Pipeline\nPlan (Fase 3)\n\n## Artefacto Clave\n`docs/plan/CDC_PIPELINE.md`\n\n## Flujo de Trabajo\n\n### 1. Definir fuentes de captura\n```bash\n# Identificar tablas y columnas a capturar\nevol-cdcdd define-sources --schema=migrations/$(ls -t migrations/ | head -1)/up.sql --output=cdc/sources/\n```\n\n### 2. Definir transformaciones\n```bash\n# Escribir transformaciones fuente -> destino\nevol-cdcdd transformations --sources=cdc/sources/ --output=cdc/transformations/\n\n# Validar SQL de transformacion\nevol-cdcdd validate-sql --dir=cdc/transformations/\n```\n\n### 3. Definir destinos y SLOs\n```bash\n# Configurar destinos de replicacion\nevol-cdcdd define-targets --sources=cdc/sources/ --output=cdc/targets/\n\n# Definir SLO de latencia por destino\nevol-cdcdd define-slo --targets=cdc/targets/ --max-latency-ms=5000 --output=cdc/targets/slo.json\n```\n\n### 4. Generar reporte del pipeline\n```bash\n# Consolidar pipeline completo\nevol-cdcdd report --sources=cdc/sources/ --transformations=cdc/transformations/ --targets=cdc/targets/ --output=docs/plan/CDC_PIPELINE.md\n```\n\n## Formato Source\n\n```json\n{\n  \"source_id\": \"CDC-SRC-001\",\n  \"table\": \"pedidos\",\n  \"columns\": [\"id\", \"usuario_id\", \"total\", \"estado\", \"created_at\"],\n  \"capture_mode\": \"log-based\",\n  \"plugin\": \"debezium-postgres\",\n  \"primary_key\": \"id\"\n}\n```\n\n## Formato Transformation\n\n```sql\n-- cdc/transformations/pedidos_to_analytics.sql\n-- Transformacion: pedidos operacionales -> analytics\n\nSELECT\n  p.id AS order_id,\n  p.usuario_id,\n  u.email AS user_email,\n  p.total,\n  p.estado,\n  p.created_at,\n  CURRENT_TIMESTAMP AS replicated_at\nFROM pedidos p\nJOIN usuarios u ON p.usuario_id = u.id\nWHERE p.created_at >= :cdc_start_offset;\n```\n\n## Formato CDC_PIPELINE.md\n\n```markdown\n# CDC Pipeline Plan\n\n**Fecha:** 2026-06-07\n**Estado:** PLANIFICADO\n\n## Resumen\nPipeline CDC log-based para replicar cambios de `pedidos` hacia data warehouse analytics.\n\n## Sources\n| Tabla | Columnas | Modo | Plugin |\n|-------|----------|------|--------|\n| pedidos | id, usuario_id, total, estado, created_at | log-based | debezium-postgres |\n\n## Transformations\n| Source | Transformation | Destino |\n|--------|---------------|---------|\n| pedidos | pedidos_to_analytics.sql | analytics_orders |\n\n## Targets\n| Destino | SLO Latencia | Modo |\n|---------|-------------|------|\n| analytics_orders | < 5s | streaming |\n\n## Validacion\n- [ ] Captura log-based funcional\n- [ ] Transformaciones correctas (fidelidad 100%)\n- [ ] Latencia dentro del SLO\n```\n\n## Integracion con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Plan | Definir sources, transformaciones y targets |\n| Build | Configurar la captura log-based + transformaciones |\n| QA | Verificar latencia dentro del SLO |\n| Gate | Bloquea si la latencia supera el SLO declarado |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/constitucion.md` Art. 9 (Evol-DD Pipeline)\n- `docs/disciplinas/CDCDD.md`\n- [Change Data Capture — Martin Kleppmann](https://www.confluent.io/blog/how-change-data-capture-works-patterns-solutions-implementation/)\n- [Debezium](https://github.com/debezium/debezium)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"CDCDD","nombre":"Change Data Capture-Driven Development","tipo":"extendida","fases":["plan"]},"enBiblioteca":false},{"id":"evol-change-mgmt-50fa48","nombre":"evol-change-mgmt","carpeta":"evol-change-mgmt","descripcion":"Gestión del cambio tecnológico y adopción. Aplica ADKAR/Kotter, alineación de stakeholders y estrategias de adopción.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/change-mgmt"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/change-mgmt"},"archivos":[{"ruta":"SKILL.md","bytes":5404}],"bytes":5404,"huella":"4fdf01968ab62398","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (117 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-change-mgmt","enlace":false}],"proyectos":[],"texto":"\n# evol-change-mgmt\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita gestionar el cambio tecnológico:\n\n- **Technology adoption**: adoptar nuevas herramientas, frameworks, procesos\n- **Stakeholder alignment**: alinear a todos los stakeholders en el cambio\n- **Resistance management**: manejar resistencia al cambio\n- **Communication planning**: comunicar el cambio efectivamente\n- **Training and enablement**: capacitar al equipo para el cambio\n- **Cultural change**: cambiar la cultura organizacional\n\n**No usar para**: gestión de proyectos (usar evol-pm), governance de código (usar evol-governance).\n\n## Conocimiento de Dominio\n\n### ADKAR Model\n- **Awareness**: entender por qué el cambio es necesario\n- **Desire**: querer participar y apoyar el cambio\n- **Knowledge**: saber cómo cambiar\n- **Ability**: poder implementar el cambio\n- **Reinforcement**: mantener el cambio, recaer\n\n### Kotter's 8 Steps\n1. **Create urgency**: make the case for change\n2. **Form powerful coalition**: build a guiding coalition\n3. **Create vision**: develop a clear vision\n4. **Communicate vision**: communicate the vision widely\n5. **Empower action**: remove obstacles, enable risk-taking\n6. **Create quick wins**: plan for visible, short-term wins\n7. **Build on gains**: use credibility from wins to tackle bigger changes\n8. **Anchor in culture**: make change stick in organizational culture\n\n### Resistance Management\n- **Identify resistance**: who resists, why, how strongly\n- **Root causes**: fear, lack of understanding, past failures, loss of control\n- **Strategies**: education, involvement, facilitation, negotiation, coercion\n- **Engage resistors**: listen, understand, address concerns\n- **Champions**: empower early adopters to influence others\n\n### Communication Planning\n- **Audience segmentation**: different messages for different groups\n- **Channel selection**: email, meetings, Slack, workshops\n- **Timing**: when to communicate, how often\n- **Feedback loops**: two-way communication, questions, concerns\n- **Transparency**: be honest about what's changing and why\n\n### Adoption Strategies\n- **Pilot programs**: test with small group before broad rollout\n- **Training**: workshops, documentation, pair programming\n- **Incentives**: rewards for adoption, recognition\n- **Gamification**: make adoption engaging and fun\n- **Support**: dedicated help during transition period\n\n## Flujo de Trabajo\n\n1. **Assess readiness**: how ready is the organization for change?\n2. **Identify stakeholders**: who will be affected, who decides, who influences\n3. **Build case for change**: urgency, business case, vision\n4. **Develop communication plan**: messages, channels, timing\n5. **Address resistance**: identify, understand, mitigate\n6. **Execute change**: pilot, train, rollout, support\n7. **Monitor adoption**: track usage, gather feedback, adjust\n8. **Reinforce**: celebrate wins, anchor in culture, prevent backsliding\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: understand change context, stakeholder landscape\n- **Spec (Fase 2)**: document adoption requirements, training needs\n- **Plan (Fase 3)**: develop change management plan, communication strategy\n- **Build (Fase 4)**: implement with adoption in mind, pilot early\n- **QA (Fase 5)**: test adoption with real users, gather feedback\n- **Retro (Fase 6)**: evaluate adoption success, lessons for next change\n\n## Referencia\n- Constitución Evol-DD: Art. 6 (multi-agent coordination - human change)\n- Agentes relacionados: evol-pm (project management), evol-ux (user adoption), evol-team-dynamics (team culture)\n- Prosci ADKAR Model: https://www.prosci.com/methodology/adkar\n- John Kotter - \"Leading Change\": the 8-step process\n- Everett Rogers - \"Diffusion of Innovations\": adoption lifecycle\n- William Bridges - \"Managing Transitions\": people side of change\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"equipo","disciplina":null,"enBiblioteca":false},{"id":"evol-chaos-resilience-783312","nombre":"evol-chaos-resilience","carpeta":"evol-chaos-resilience","descripcion":"Chaos / Resiliency-Driven Development. Ejecuta experimentos de chaos con inyeccion de fallos controlada para validar recuperacion automatica del sistema.","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/chaos"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/chaos"},"archivos":[{"ruta":"SKILL.md","bytes":4733}],"bytes":4733,"huella":"ef40ae7406684ffa","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (153 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-chaos-resilience","enlace":false}],"proyectos":[],"texto":"\n# evol-chaos-resilience\n\n## Fase del Pipeline\nQA (Fase 5)\n\n## Artefacto Clave\n`docs/qa/CHAOS_REPORT.md`\n\n## Flujo de Trabajo\n\n### 1. Formular hipotesis desde amenazas\n```bash\n# Leer amenazas de tipo DoS desde STRIDE\nevol-chaos hypothesis --threats=docs/specs/THREATS.md --output=chaos/hypothesis/\n\n# Generar plan de experimentos\nevol-chaos plan --hypothesis=chaos/hypothesis/ --output=chaos/experiments/\n```\n\n### 2. Configurar sandbox aislado\n```bash\n# Preparar entorno de staging para chaos\nevol-chaos setup-sandbox --env=staging --output=chaos/sandbox_config.json\n\n# Verificar que produccion NO esta expuesta\nevol-chaos verify-isolation --config=chaos/sandbox_config.json\n```\n\n### 3. Ejecutar experimentos de inyeccion de fallo\n```bash\n# Inyectar latencia de red\nevol-chaos inject --type=network-latency --duration=60s --target=api-service\n\n# Inyectar fallo de dependencia\nevol-chaos inject --type=dependency-failure --target=database-service\n\n# Inyectar consumption de recursos\nevol-chaos inject --type=cpu-stress --duration=120s --target=api-service\n```\n\n### 4. Medir tiempo de recuperacion\n```bash\n# Monitorear metricas durante el experimento\nevol-chaos monitor --experiment=chaos/experiments/EXP-001.json --output=chaos/results/EXP-001_metrics.json\n\n# Generar reporte\nevol-chaos report --results=chaos/results/ --hypothesis=chaos/hypothesis/ --output=docs/qa/CHAOS_REPORT.md\n```\n\n## Formato Hipotesis\n\n```markdown\n# Hipotesis de Resiliencia — HYP-001\n\n**Amenaza:** THREAT-003 (DoS via saturacion de DB)\n**Estado estable:** Latencia p95 < 100ms, error rate < 0.1%\n**Fallo inyectado:** Latencia de 500ms en queries a la BD\n**Resultado esperado:** Sistema se recupera en < 2 min tras cesar el fallo\n**Blast radius:** 100% de requests afectados durante el fallo\n```\n\n## Formato CHAOS_REPORT.md\n\n```markdown\n# Chaos Report\n\n**Fecha:** 2026-06-07\n**Estado:** APROBADO / RECHAZADO\n\n## Resumen Ejecutivo\n[N experimentos ejecutados, N pasaron, N fallaron]\n\n## Experimentos\n| ID | Amenaza | Fallo | Recuperacion | SLO | Estado |\n|----|---------|-------|--------------|-----|--------|\n| EXP-001 | DoS DB | Latencia 500ms | 1m 23s | < 2min | PASS |\n| EXP-002 | Dependencia caida | Timeout 30s | No recupero | < 2min | FAIL |\n\n## Hallazgos\n[Lecciones aprendidas y mejoras sugeridas]\n\n## Plan de Accion\n| Mejora | Owner | Prioridad |\n|--------|-------|-----------|\n| Agregar circuit breaker a DB pool | Builder | P1 |\n```\n\n## Integracion con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Spec | Identificar amenazas de disponibilidad (STRIDE DoS) |\n| QA | Ejecutar experimentos en sandbox aislado |\n| Retro | Registrar hallazgos y mejorar la resiliencia |\n| Gate | Bloquea si hay experimentos que requieren intervencion manual |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/constitucion.md` Art. 9 (Evol-DD Pipeline)\n- `docs/disciplinas/CHAOS.md`\n- [Principles of Chaos Engineering](https://principlesofchaos.org/)\n- [Chaos Mesh](https://github.com/chaos-mesh/chaos-mesh)\n- [Chaos Engineering Overview — Microsoft](https://learn.microsoft.com/en-us/azure/chaos-studio/chaos-engineering-overview)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"CHAOS","nombre":"Resiliency-Driven Development (Chaos)","tipo":"extendida","fases":["qa"]},"enBiblioteca":false},{"id":"evol-code-archaeology-afd512","nombre":"evol-code-archaeology","carpeta":"evol-code-archaeology","descripcion":"Análisis de deuda técnica y evolución de sistemas. Excava código legacy, identifica patrones de deuda y planifica modernización.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/code-archaeology"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/code-archaeology"},"archivos":[{"ruta":"SKILL.md","bytes":5437}],"bytes":5437,"huella":"ae8d4a3e59ebdfde","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (128 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-code-archaeology","enlace":false}],"proyectos":[],"texto":"\n# evol-code-archaeology\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita analizar código legacy o deuda técnica:\n\n- **Code archaeology**: entender código que nadie documentó\n- **Technical debt identification**: encontrar y clasificar deuda técnica\n- **System evolution**: entender cómo evolucionó el sistema\n- **Dependency analysis**: mapear dependencias, identificar riesgos\n- **Refactoring planning**: planificar modernización incremental\n- **Legacy migration**: estrategias para migrar sistemas legacy\n\n**No usar para**: arquitectura de nuevos sistemas (usar evol-architect), documentación técnica (usar evol-doc).\n\n## Conocimiento de Dominio\n\n### Code Archaeology\n- **Git archaeology**: blame, log, bisect para entender historia\n- **Dead code detection**: código que no se ejecuta\n- **Dependency graphs**: visualizar dependencias entre módulos\n- **Call chains**: entender flujos de ejecución\n- **Data flow**: seguir datos a través del sistema\n\n### Technical Debt Taxonomy\n- **Code smells**: duplicated code, long methods, large classes\n- **Architecture smells**: circular dependencies, god modules\n- **Test debt**: missing tests, flaky tests, low coverage\n- **Documentation debt**: missing docs, outdated docs\n- **Dependency debt**: outdated deps, known vulnerabilities\n- **Infrastructure debt**: manual processes, snowflake servers\n\n### System Evolution\n- **Conway's Law**: system structure mirrors org structure\n- **Accidental complexity**: complexity that doesn't add value\n- **Intentional complexity**: necessary complexity for the domain\n- **Evolution stages**: prototype → growth → maturity → decline\n- **Strangler fig pattern**: gradually replace legacy\n\n### Refactoring Patterns\n- **Extract method/module/class**: break down large units\n- **Rename**: improve naming for clarity\n- **Move method**: place behavior where it belongs\n- **Replace conditional with polymorphism**: OOP patterns\n- **Introduce parameter object**: reduce parameter lists\n- **Decouple**: reduce coupling between modules\n\n### Migration Strategies\n- **Strangler fig**: new system grows around old, old system shrinks\n- **Branch by abstraction**: abstract interface, implement new behind it\n- **Feature toggle**: new behavior behind flag, gradual migration\n- **Data migration**: dual-write, backfill, validate, switch\n- **Big bang**: replace all at once (high risk, sometimes necessary)\n\n## Flujo de Trabajo\n\n1. **Survey the codebase**: high-level structure, entry points, main flows\n2. **Analyze git history**: who wrote what, why, when, how it evolved\n3. **Identify debt**: code smells, architecture smells, missing tests\n4. **Map dependencies**: what depends on what, circular deps, hot spots\n5. **Classify debt**: by type, severity, impact on development velocity\n6. **Plan remediation**: prioritize by impact × effort\n7. **Execute incrementally**: refactor in small steps, test after each\n8. **Prevent new debt**: coding standards, review, automated checks\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: understand legacy system, business context\n- **Spec (Fase 2)**: document current architecture, debt inventory\n- **Plan (Fase 3)**: prioritize debt remediation, plan migration\n- **Build (Fase 4)**: refactor incrementally, maintain tests\n- **QA (Fase 5)**: verify refactoring didn't break anything\n- **Retro (Fase 6)**: measure improvement, identify next debt to address\n\n## Referencia\n\n- Constitución Evol-DD: Art. 4 (readability, modularity, lifecycle engineering)\n- Agentes relacionados: evol-architect (architecture), evol-reviewer (code review), evol-sec (security debt)\n- Martin Fowler - \"Refactoring\": the definitive guide\n- Michael Feathers - \"Working Effectively with Legacy Code\"\n- Ward Cunningham - \"The Wyckoff Methodology\": debt metaphor origin\n- Sourcetrail: code visualization and exploration tool\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"codigo","disciplina":null,"enBiblioteca":false},{"id":"evol-cognitive-ux-67f117","nombre":"evol-cognitive-ux","carpeta":"evol-cognitive-ux","descripcion":"Cognitive UX: carga cognitiva, modelos mentales y diseño de comportamiento para crear interfaces intuitivas.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/cognitive-ux"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/cognitive-ux"},"archivos":[{"ruta":"SKILL.md","bytes":5372}],"bytes":5372,"huella":"4c574a72f09087ba","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":true,"revision":[{"nivel":"error","texto":"Frontmatter: YAML inválido: Nested mappings are not allowed in compact mappings at line 2, column 14:. Suele arreglarse poniendo la description entre comillas o con el bloque «description: >»."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (108 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-cognitive-ux","enlace":false}],"proyectos":[],"texto":"\n# evol-cognitive-ux\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita optimizar la experiencia cognitiva del usuario:\n\n- **Cognitive load**: reducir carga cognitiva, gestionar atención\n- **Mental models**: alinear diseño con expectativas del usuario\n- **Behavior design**: diseñar para que los usuarios hagan lo que queremos\n- **Decision fatigue**: simplificar decisiones, reducir opciones\n- **Memory limitations**: diseñar para olvido, no para memoria\n- **Attention management**: capturar y mantener atención\n\n**No usar para**: UX research general (usar evol-ux), usability testing (usar evol-qa), A/B testing (usar evol-growth-experiment).\n\n## Conocimiento de Dominio\n\n### Cognitive Load Theory\n- **Intrinsic load**: complejidad inherente de la tarea\n- **Extraneous load**: complejidad innecesaria del diseño\n- **Germane load**: esfuerzo para aprender y internalizar\n- **Goal**: minimizar extraneous, optimizar intrinsic, maximizar germane\n\n### Mental Models\n- **User expectations**: qué creen que pasará basado en experiencia previa\n- **Conceptual models**: representación mental del sistema\n- **Gulf of execution**: diferencia entre intención y acción\n- **Gulf of evaluation**: diferencia entre sistema y comprensión\n\n### Behavior Design\n- **BJ Fogg model**: Behavior = Motivation + Ability + Trigger\n- **Habit loop**: cue → routine → reward\n- **Variable reward**: unpredictability mantiene engagement\n- **Social proof**:其他人的行为 guía el nuestro\n- **Loss aversion**: miedo a perder > deseo de ganar\n\n### Decision Making\n- **Choice overload**: demasiadas opciones paralizan\n- **Default effect**: el default es lo que la mayoría elige\n- **Anchoring**: primera información afecta decisiones posteriores\n- **Satisficing vs. maximizing**: primero que funcione vs. la mejor opción\n\n### Memory and Attention\n- **Miller's Law**: 7±2 items in working memory\n- **Serial position effect**: recuerdas primero y último\n- **Change blindness**: no notas cambios graduales\n- **Inattentional blindness**: no ves lo que no esperas\n\n### Gestalt Principles\n- **Proximity**: cosas cerca se perciben como grupo\n- **Similarity**: cosas similares se perciben como grupo\n- **Continuity**: percibimos líneas continuas, no segments\n- **Closure**: completamos formas incompletas\n\n## Flujo de Trabajo\n\n1. **Audit cognitive load**: ¿Cuánto tiene que pensar el usuario?\n2. **Map mental models**: ¿Qué espera el usuario? ¿Cómo cree que funciona?\n3. **Identify decision points**: ¿Dónde el usuario tiene que decidir?\n4. **Simplify choices**: reducir opciones, usar defaults, guiar decisión\n5. **Align with mental models**: diseñar para que coincida con expectativas\n6. **Reduce memory load**: mostrar info relevante, no depender de memoria\n7. **Test with users**: observar dónde se confunden, dónde dudan\n8. **Iterate**: mejorar basado en observación real\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: understand user mental models, decision points\n- **Spec (Fase 2)**: document cognitive requirements, behavior goals\n- **Plan (Fase 3)**: design for cognitive load, decision architecture\n- **Build (Fase 4)**: implement with cognitive principles, behavior design\n- **QA (Fase 5)**: test cognitive load, mental model alignment\n- **Retro (Fase 6)**: analyze user behavior, identify cognitive improvements\n\n## Referencia\n\n- Constitución Evol-DD: Art. 5 (consultoría de dominio proactiva - user needs)\n- Agentes relacionados: evol-ux (user experience), evol-growth-experiment (behavior design), evol-ethnography (user research)\n- Don Norman - \"The Design of Everyday Things\": mental models, affordances\n- Steve Krug - \"Don't Make Me Think\": cognitive simplicity\n- BJ Fogg - \"Tiny Habits\": behavior design model\n- Daniel Kahneman - \"Thinking, Fast and Slow\": cognitive biases\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"descubrimiento","disciplina":null,"enBiblioteca":false},{"id":"evol-compact-41f91e","nombre":"evol-compact","carpeta":"evol-compact","descripcion":"Provider-agnostic context compaction. Reduce tokens preserving semantics.","categoria":"context-engineering","origen":null,"licencia":null,"version":null,"triggers":["/compact"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"context-engineering","trigger":"/compact"},"archivos":[{"ruta":"SKILL.md","bytes":2103},{"ruta":".gitkeep","bytes":0}],"bytes":2103,"huella":"573b93b0c54c3f06","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (73 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-compact","enlace":false}],"proyectos":[],"texto":"\n# evol-compact\n\n## Philosophy\nContext compaction must preserve semantic meaning while reducing token count.\n\n## Strategies\n1. Remove redundant examples\n2. Merge similar instructions\n3. Compress technical terms\n4. Keep decision-critical context\n5. Preserve error cases\n\n## When to Use\n- Context approaching token limit\n- Large codebase navigation\n- Long conversation history\n\n## Commands\n```\n/compact --level=light   # 20-30% reduction\n/compact --level=medium  # 40-50% reduction\n/compact --level=aggressive # 60-75% reduction\n```\n\n## Reference\nskills/evol-compact/SKILL.md\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"context-engineering","grupo":"contexto","disciplina":null,"enBiblioteca":false},{"id":"evol-compliance-drivers-88f18e","nombre":"evol-compliance-drivers","carpeta":"evol-compliance-drivers","descripcion":"Compliance-Driven Development — SOC 2, ISO 27001, HIPAA, regulatory compliance","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/compliance-drivers"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/compliance-drivers"},"archivos":[{"ruta":"SKILL.md","bytes":4446}],"bytes":4446,"huella":"0b73bc3fc03846ef","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (78 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-compliance-drivers","enlace":false}],"proyectos":[],"texto":"\n# evol-compliance-drivers\n\n## Fase del Pipeline\n\n**Spec (Fase 2) — Especificación y Diseño**\n\nActivar cuando se necesita cumplimiento regulatorio:\n- SOC 2 Type II controls\n- ISO 27001 Annex A controls\n- HIPAA safeguards\n- Regulatory compliance mapping\n\n## Artefacto Clave\n\n**`docs/compliance/COMPLIANCE_REPORT.md`**\n\n```markdown\n# Compliance Report\n\n## Framework: SOC 2 Type II\n\n### Control Mapping\n| Control | Category | Status | Evidence | Owner |\n|---------|----------|--------|----------|-------|\n| CC6.1 | Logical Access | Implemented | IAM policies | Security |\n| CC6.8 | Malware | Implemented | Endpoint protection | IT |\n| CC7.1 | Monitoring | Implemented | SIEM alerts | SOC |\n\n### Gaps Identified\n| Gap | Risk Level | Remediation | Target Date |\n|-----|------------|-------------|-------------|\n| No MFA on admin accounts | High | Enable MFA | 2026-07-01 |\n\n### Evidence Collection\n- Access logs: `/var/log/auth.log`\n- Change logs: GitHub audit trail\n- Monitoring: Datadog dashboards\n```\n\n## Flujo de Trabajo\n\n```bash\n# 1. Identificar framework aplicable\npython3 scripts/compliance/identify-framework.py \\\n  --industry fintech \\\n  --region eu \\\n  --output docs/compliance/APPLICABLE_FRAMEWORKS.md\n\n# 2. Generar mapeo de controles\npython3 scripts/compliance/map-controls.py \\\n  --framework soc2 \\\n  --source . \\\n  --output docs/compliance/CONTROL_MAP.md\n\n# 3. Ejecutar assessment\npython3 scripts/compliance/assess.py \\\n  --framework soc2 \\\n  --source . \\\n  --output docs/compliance/COMPLIANCE_REPORT.md\n\n# 4. Validar evidencia\npython3 scripts/compliance/validate-evidence.py \\\n  --report docs/compliance/COMPLIANCE_REPORT.md \\\n  --output docs/compliance/EVIDENCE_STATUS.md\n\n# 5. Generar remediation plan\npython3 scripts/compliance/remediation.py \\\n  --report docs/compliance/COMPLIANCE_REPORT.md \\\n  --output docs/compliance/REMEDIATION_PLAN.md\n\n# 6. Dashboard de compliance\npython3 scripts/compliance/dashboard.py \\\n  --report docs/compliance/COMPLIANCE_REPORT.md \\\n  --output dashboards/compliance-overview.json\n```\n\n## Integración con Pipeline\n\n| Fase | Gate | Check | Automático |\n|------|------|-------|------------|\n| Briefing | Compliance requirements | Frameworks identificados | No |\n| Spec | Control mapping | Controles mapeados | Sí |\n| Plan | Gap remediation | Plan de remediación | No |\n| Build | Controls implemented | Controles en código | Sí |\n| QA | Evidence collection | Evidencia verificada | Sí |\n| Retro | Compliance status | Estado documentado | No |\n\n## Referencia\n\n- **Constitución Art. 8** — Estándares de ingeniería\n- **Constitución Art. 9** — Fase Spec del Pipeline\n- **Discipline Doc** — `docs/disciplines/Compliance_Drivers.md`\n- **SOC 2 Trust Principles** — https://us.aicpa.org/interestareas/frc/assuranceadvisoryservices/aicpasoc2report\n- **ISO 27001 Controls** — https://www.iso.org/iso-27001-information-security.html\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"COMPLIANCE","nombre":"Compliance-Driven Development","tipo":"extendida","fases":["spec"]},"enBiblioteca":false},{"id":"evol-context7-6f8ad3","nombre":"evol-context7","carpeta":"evol-context7","descripcion":"Inyeccion de documentacion version-specific y actualizada de librerias/frameworks al contexto del agente via Context7 (MCP server o CLI ctx7). Elimina APIs alucinadas, ejemplos obsoletos y respuestas genericas cuando se trabaja con versiones nuevas fuera del knowledge cutoff. Usar al fijar contratos de dependencias (Spec) o al escribir codigo contra una libreria (Build). Sinonimos: /context7, use context7, docs actualizadas de, documentacion de la libreria, como se usa la API de.","categoria":"research","origen":"evol-dd","licencia":null,"version":null,"triggers":["/context7","use context7","docs actualizadas de","documentacion de la libreria","como se usa la api de"],"cuandoUsarla":["Se fija una dependencia con version especifica en Spec","Se escribe codigo contra una libreria/framework en Build","El agente sospecha que su conocimiento de una API esta obsoleto","El usuario pide docs actualizadas de una libreria"],"compatible":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"],"frontmatter":{"origin":"evol-dd","inspired_by":"upstash/context7 (atribucion en NOTICE)","category":"research","when_to_use":["Se fija una dependencia con version especifica en Spec","Se escribe codigo contra una libreria/framework en Build","El agente sospecha que su conocimiento de una API esta obsoleto","El usuario pide docs actualizadas de una libreria"],"triggers":["/context7","use context7","docs actualizadas de","documentacion de la libreria","como se usa la api de"],"compatible_with":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"],"evals":"evals/evol-context7/"},"archivos":[{"ruta":"SKILL.md","bytes":5258}],"bytes":5258,"huella":"d2ee72c740bf8dac","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (484 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-context7","enlace":false}],"proyectos":[],"texto":"\n# evol-context7\n\n## Proposito\n\nTraer documentacion actualizada y version-specific de librerias al contexto, en\nlugar de confiar en el conocimiento del modelo (que tiene cutoff y aluciona APIs).\nCritico para EDMS UI: React 19, Tailwind 4, FastAPI 0.115+ son versiones nuevas\nposteriores al cutoff del modelo.\n\nContext7 es un servicio externo de Upstash. Esta skill **documenta como integrarlo\ny cuando invocarlo** — no lo reimplementa.\n\n## Dos modos de integracion\n\nEvol-DD adopto MCP nativo (v0.6.0). Modo preferido: MCP server.\n\n### Modo MCP (preferido)\n\nRegistrar el server una vez via el gestor oficial:\n\n```bash\nbash scripts/evol-mcp.sh add context7 npx @upstash/context7-mcp\nbash scripts/evol-mcp.sh status   # verificar\nbash scripts/evol-mcp.sh list     # listar servers\n```\n\nUso en prompt: agregar `use context7` a la peticion. Ej:\n`\"Como configuro middleware en Next.js 15? use context7\"`. El server inyecta la\ndoc matching automaticamente.\n\n### Modo CLI (fallback, sin MCP)\n\nSi el IDE no soporta MCP o se prefiere CLI:\n\n```bash\nnpx -y @upstash/context7-mcp   # o instalar ctx7 CLI\n```\n\nInvocar `ctx7` con library-id + version para recuperar docs puntuales.\n\n## Reglas hard\n\n1. **No alucinar versiones.** Si se trabaja con una version posterior al cutoff,\n   consultar Context7 antes de escribir codigo contra esa API.\n2. **Citar la fuente** de la doc recuperada (DOC_STANDARD 1.7 — toda info externa\n   lleva su origen).\n3. **No indexar secrets.** Lo recuperado es doc publica; no pegar tokens/keys.\n4. **Verificar antes de aceptar.** Si un claim de la doc parece dudoso, pasar por\n   [[evol-fact-check]].\n\n## Integracion Evol-DD\n\n- **Fase 2 (Spec):** al fijar el contrato de dependencias y sus versiones.\n- **Fase 4 (Build):** al escribir codigo contra una libreria con version especifica.\n- Gatillo automatico: el agente detecta una dependencia con version pinneada que\n  excede su knowledge cutoff.\n- Complementa [[evol-fact-check]] (verificacion de claims) y [[api-contract]].\n\n## Agentes que la usan\n\n- `evol-builder` — codigo contra libs actualizadas\n- `evol-architect` — decisiones de stack con versiones reales\n- `evol-researcher` — investigacion de APIs\n\n## Limites\n\n- Depende de un servicio externo (Upstash Context7). Sin red, no funciona.\n- No reemplaza la doc oficial del proyecto; complementa con doc de terceros.\n- No es memoria persistente (eso es EDMS / [[mempalace-sync]]).\n- No reimplementa Context7 — solo integra el server/CLI.\n\n## Atribucion\n\nIntegracion de [upstash/context7](https://github.com/upstash/context7) (MIT).\nServicio externo, no reimplementado. Evol-DD aporta: registro via `evol-mcp.sh`,\nreglas de citacion (DOC_STANDARD), e integracion en fases Spec/Build del pipeline.\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"research","grupo":"contexto","disciplina":null,"enBiblioteca":false},{"id":"evol-cost-analysis-ce7060","nombre":"evol-cost-analysis","carpeta":"evol-cost-analysis","descripcion":"Cost modeling y ROI analysis para proyectos de software. Análisis de costos, optimización financiera y modelado financiero.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/cost-analysis"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/cost-analysis"},"archivos":[{"ruta":"SKILL.md","bytes":5241}],"bytes":5241,"huella":"da8d55e56677ee54","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (123 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-cost-analysis","enlace":false}],"proyectos":[],"texto":"\n# evol-cost-analysis\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita analizar costos y ROI de software:\n\n- **ROI analysis**: retorno de inversión de features, proyectos, herramientas\n- **Cost modeling**: estimar costos de infra, desarrollo, operación\n- **Cost optimization**: reducir costos sin sacrificar calidad\n- **Financial modeling**: proyecciones, scenarios, break-even analysis\n- **Build vs. buy**: decidir entre construir internamente o comprar\n- **Cloud cost management**: AWS/GCP/Azure cost optimization\n\n**No usar para**: software contable/financiero (usar evol-domain-finance), análisis de presupuesto de proyecto (usar evol-pm).\n\n## Conocimiento de Dominio\n\n### ROI Analysis\n- **ROI formula**: (Gain - Cost) / Cost × 100%\n- **Payback period**: cuánto tiempo para recuperar la inversión\n- **NPV (Net Present Value)**: valor presente de flujos futuros\n- **IRR (Internal Rate of Return)**: tasa de retorno implícita\n- **Intangibles**: brand value, developer productivity, time-to-market\n\n### Cost Modeling\n- **Infrastructure costs**: compute, storage, network, databases\n- **Development costs**: salaries, contractors, tools, licenses\n- **Operational costs**: monitoring, support, maintenance, updates\n- **Opportunity costs**: what we're not building\n- **Hidden costs**: technical debt, context switching, onboarding\n\n### Cost Optimization\n- **Right-sizing**: matching resources to actual needs\n- **Reserved instances**: commit for discount (1yr, 3yr)\n- **Spot instances**: use spare capacity for non-critical workloads\n- **Auto-scaling**: scale down when not needed\n- **Caching**: reduce compute and database costs\n- **Serverless**: pay per execution, not per hour\n\n### Financial Modeling\n- **Scenario analysis**: best case, worst case, most likely\n- **Sensitivity analysis**: which variables matter most\n- **Monte Carlo simulation**: probabilistic outcomes\n- **Break-even analysis**: when costs = revenue\n- **Unit economics**: cost per user, cost per transaction\n\n### Build vs. Buy\n- **Build**: more control, more expensive, longer time-to-market\n- **Buy**: less control, faster, may not fit perfectly\n- **Total Cost of Ownership**: purchase + maintenance + integration + opportunity cost\n- **Core vs. context**: build what's core, buy what's context\n\n## Flujo de Trabajo\n\n1. **Identificar costs**: enumerate all costs (infra, dev, ops, hidden)\n2. **Estimate ROI**: gain vs. cost, payback period, NPV\n3. **Model scenarios**: best/worst/most likely cases\n4. **Analyze build vs. buy**: for each major component\n5. **Identify optimization opportunities**: right-sizing, reserved, caching\n6. **Create financial model**: projections, break-even, sensitivity\n7. **Validate assumptions**: check estimates against reality\n8. **Present recommendations**: clear ROI, trade-offs, next steps\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: understand budget constraints, business case\n- **Spec (Fase 2)**: document cost requirements, ROI targets\n- **Plan (Fase 3)**: estimate project costs, identify cost optimization\n- **Build (Fase 4)**: implement cost-efficiently, monitor costs\n- **QA (Fase 5)**: verify cost estimates, test cost optimization\n- **Retro (Fase 6)**: actual vs. estimated costs, lessons for next project\n\n## Referencia\n\n- Constitución Evol-DD: Art. 8 (engineering standards - cost efficiency)\n- Agentes relacionados: evol-devops (infrastructure costs), evol-pm (budget management), evol-domain-finance (financial modeling)\n- AWS Well-Architected Framework: Cost Optimization pillar\n- Google Cloud Architecture Framework: Cost optimization\n- Tom DeMarco - \"Controlling Software Projects\": measurement and estimation\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"equipo","disciplina":null,"enBiblioteca":false},{"id":"evol-ddd-domain-080267","nombre":"evol-ddd-domain","carpeta":"evol-ddd-domain","descripcion":"Domain-Driven Design. Modela el dominio del negocio con Ubiquitous Language, Bounded Contexts, Aggregates y Domain Events en DOMAIN.md.","categoria":"discipline-base","origen":null,"licencia":null,"version":null,"triggers":["/ddd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-base","trigger":"/ddd"},"archivos":[{"ruta":"SKILL.md","bytes":4299}],"bytes":4299,"huella":"6b7ba581ef80f816","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (135 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-ddd-domain","enlace":false}],"proyectos":[],"texto":"\n# evol-ddd-domain\n\n## Fase del Pipeline\nSpec (Fase 2)\n\n## Artefacto Clave\n`docs/specs/DOMAIN.md`\n\n## Flujo de Trabajo\n\n### 1. Identificar Bounded Contexts\n```bash\n# Analizar el modelo de negocio para identificar limites\nevol-ddd identify-contexts --from=docs/features/FEATURES.md\n\n# Generar diagrama de bounded contexts\nevol-ddd context-map --output=docs/specs/context-map.mermaid\n```\n\n### 2. Definir Ubiquitous Language\n```bash\n# Crear glosario de terminos del negocio\nevol-ddd ubiquitous-language --export=domain\n\n# Validar coherencia del vocabulario\nevol-ddd validate-vocab --against=docs/specs/SPEC.md\n```\n\n### 3. Modelar Core Aggregates\n```bash\n# Identificar aggregates y sus invariantes\nevol-ddd model-aggregates --from=domain-events\n\n# Generar diagrama de clases\nevol-ddd class-diagram --output=docs/specs/class-diagram.mermaid\n```\n\n### 4. Documentar Domain Events\n```bash\n# Catalogar eventos de dominio\nevol-ddd catalog-events --emitters=aggregates\n\n# Validar dependencias entre eventos\nevol-ddd validate-events --check-dependencies\n```\n\n### 5. Generar DOMAIN.md\n```bash\n# Compilar artefacto final\nevol-ddd compile --output=docs/specs/DOMAIN.md\n\n# Validar contra DOC_STANDARD v2.0\nevol-ddd validate --standard=DOC_STANDARD\n```\n\n## Formato DOMAIN.md\n\n```markdown\n## Ubiquitous Language\n| Termino | Definicion precisa | Sinonimos prohibidos | Contexto |\n|---------|--------------------|---------------------|----------|\n| Periodo de Facturacion | Intervalo de tiempo por el que se calcula el cargo | \"mes\", \"ciclo\" | Facturacion |\n\n## Bounded Contexts\n[Descripcion narrativa + diagrama Mermaid flowchart]\n\n## Context Map\n[Diagrama Mermaid con tipos de relacion]\n\n## Core Aggregates\n| Aggregate Root | Invariantes | Entidades | Value Objects | Repository |\n|----------------|-------------|-----------|---------------|------------|\n| `Factura` | El total nunca puede ser negativo | `LineaFactura` | `Monto` | `FacturaRepository` |\n\n## Domain Events\n| Evento | Emisor | Consumidores | Payload | Efecto |\n|--------|--------|-------------|---------|--------|\n| `FacturaEmitida` | `Factura` | `Notificaciones` | `{facturaId, total}` | Notifica al cliente |\n```\n\n## Integración con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Spec | Identificar Bounded Contexts y Ubiquitous Language |\n| Spec | Modelar Core Aggregates y Domain Events |\n| Build | Verificar que el código usa el vocabulario del dominio |\n| QA | Tier 3 verifica coherencia semantica con DOMAIN.md |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/constitucion.md` Art. 9 (Evol-DD Pipeline)\n- `docs/disciplinas/DDD.md`\n- Referencia canonica: [Domain-Driven Design — Eric Evans (2003)](https://www.domainlanguage.com/ddd/)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-base","grupo":"disciplinas","disciplina":{"id":"DDD","nombre":"Domain-Driven Design","tipo":"base","fases":["spec"]},"enBiblioteca":false},{"id":"evol-debt-budget-49bdbe","nombre":"evol-debt-budget","carpeta":"evol-debt-budget","descripcion":"DebtBudgetDD — Tech debt inventory, prioritization, remediation planning","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/debt-budget"],"cuandoUsarla":[],"c
