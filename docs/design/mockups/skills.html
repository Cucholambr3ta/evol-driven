abajo) — independiente del perfil.\n5. **a11y minimo:** contraste WCAG AA, foco visible, semantica HTML correcta.\n6. **Coherencia total.** Un solo punto de vista estetico por entregable. No mezclar\n   perfiles dentro de la misma UI.\n\n## Perfiles esteticos (aesthetic_profile)\n\nSelector en `evol.profile.yml`. Determina la direccion visual. Default: preguntar.\n\n### Perfil `bold` (directriz original anthropics/frontend-design)\n\nPara landings, marketing, productos con personalidad, artifacts memorables.\n\n- Tipografia distintiva y con caracter. Evitar fuentes genericas (Arial, Roboto).\n  Parear display font expresiva con body font refinada.\n- Color: comprometerse con una estetica cohesiva. Colores dominantes + acentos\n  filosos superan paletas timidas. Usar CSS variables.\n- Motion de alto impacto: reveals escalonados al cargar, scroll-triggers, hover\n  states. CSS-only en HTML; libreria Motion en React. Para video/animacion\n  programatica, delegar en [[evol-remotion]].\n- Composicion espacial inesperada: asimetria, overlap, flujo diagonal, romper el\n  grid, negative space generoso O densidad controlada.\n- Fondos con atmosfera: texturas, gradient mesh, noise, patrones geometricos,\n  transparencias en capas, grano.\n- Filosofia: \"no te contengas\". Maximalismo necesita codigo elaborado.\n\n### Perfil `enterprise-minimal` (referencia Linear / Vercel / GitHub Projects)\n\nPara dashboards, plataformas internas, herramientas de productividad, B2B.\nEs el perfil de EDMS.\n\n- Paleta oscura monocromatica + UN solo color de accion. Referencia base:\n  bg `#0F1115`, surface `#171A21`, surface-elevated `#1D212A`, border `#2A2F3A`,\n  text-primary `#F5F7FA`, text-secondary `#9CA3AF`, accent `#4F46E5` (solo\n  seleccion / foco / CTA principal).\n- Semantica de color minima: normal=gris, seleccionado=indigo, warning=ambar,\n  error=rojo, success=verde. Nada mas. Prohibido un color por nodo/categoria.\n- Tipografia: Geist (preferida) o Inter. Escala: 32/24/20/16/14/13/12. Nada < 12px.\n- Densidad de informacion alta, ruido visual bajo. Bordes invisibles o sutiles,\n  sombras minimas, hover elegante. Sin barras de colores ni sparklines decorativos.\n- Motion sobrio: transiciones 150ms, micro-interacciones discretas. Reveals\n  funcionales (no decorativos) via [[evol-remotion]] cuando aporten claridad.\n- Iconografia monocromatica: Lucide / Heroicons / Phosphor. SVG inline. Cero emojis.\n- Glassmorphism: NO. Sin `backdrop-filter: blur()` por todas partes. Solo\n  `rgba(255,255,255,0.03)` en overlays especificos.\n- Metricas ejecutivas, no tecnicas: Health Score, Velocity, Risk Score, Blocked\n  Items (no Nodes/Edges/Drawer Count).\n- Frase guia: \"Linear + Vercel + GitHub Projects: enterprise oscuro, minimalista,\n  monocromatico, enfocado en densidad de informacion.\"\n\n## Anti AI-slop checklist (todos los perfiles)\n\nAntes de entregar, verificar y corregir:\n\n- [ ] Sin morado/RGB brillante por defecto ni gradientes gratuitos\n- [ ] Sin layout generico de \"AI dashboard 2023\" (cajas con bordes pesados, un color por seccion)\n- [ ] Tipografia elegida con intencion (no la default del framework)\n- [ ] Color via tokens, no hardcodeado\n- [ ] Cero emojis como iconos (usar SVG)\n- [ ] Direccion estetica unica y coherente, no \"todo a la vez\"\n- [ ] Cada decision visual justificable (por que ese color/peso/espaciado)\n\n## Flujo (8 pasos)\n\n1. **Leer perfil** — `aesthetic_profile` de `evol.profile.yml`; si falta, preguntar.\n2. **Design-thinking** — proposito + tono + constraints + diferenciacion (registrar).\n3. **Tokens** — definir CSS variables del sistema (color, tipo, espaciado, radios).\n4. **Estructura** — layout + jerarquia + densidad acorde al perfil.\n5. **Componentes** — markup semantico + tokens; sin valores magicos.\n6. **Motion** — transiciones/reveals acorde al perfil; delegar video a [[evol-remotion]].\n7. **Anti-slop pass** — correr el checklist; corregir.\n8. **Registro** — documentar el por que del diseno (decisiones esteticas).\n\n## Integracion Evol-DD\n\n- **Fase 4 (Build):** se inyecta automaticamente al construir UI, junto a\n  [[evol-remotion]] (estatica + motion = toolkit de diseno).\n- **Transversal:** gatillo cuando el usuario pide \"disena / componente / dashboard\n  / landing / wireframe\".\n- Complementa [[design-system-builder]] (tokens + Storybook + componentes atomicos)\n  y [[a11y-audit]] (verificacion WCAG).\n- El perfil EDMS es `enterprise-minimal`.\n\n## Agentes que la usan\n\n- `evol-ux` — discovery y validacion de direccion visual\n- `evol-builder` — construye UI con tokens\n- `evol-reviewer` — corre el anti-slop checklist en review\n\n## Limites\n\n- No reemplaza [[design-system-builder]] (ese genera el design system completo con\n  Storybook); esta skill define la direccion estetica + tokens base.\n- No genera video/animacion programatica (eso es [[evol-remotion]]).\n- No audita accesibilidad en profundidad (eso es [[a11y-audit]]).\n- No decide el perfil estetico por el usuario si no esta declarado: pregunta.\n\n## Atribucion\n\nConcepto inspirado en [anthropics/skills frontend-design](https://github.com/anthropics/skills/blob/main/skills/frontend-design/SKILL.md)\n(directriz \"bold/anti-AI-slop\"). Implementacion nativa Evol-DD: doble perfil\nseleccionable por `aesthetic_profile`, perfil `enterprise-minimal` propio\n(Linear/Vercel/GitHub Projects), integracion con design tokens, [[evol-remotion]]\ny el pipeline de 6 fases.\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"growth","grupo":"diseno","disciplina":null,"enBiblioteca":false},{"id":"evol-fs-context-fe32c9","nombre":"evol-fs-context","carpeta":"evol-fs-context","descripcion":"Filesystem-paradigm context curation. Treat large data as files mounted by agents.","categoria":"context-engineering","origen":null,"licencia":null,"version":null,"triggers":["/fs-context"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"context-engineering","trigger":"/fs-context"},"archivos":[{"ruta":"SKILL.md","bytes":2134},{"ruta":".gitkeep","bytes":0}],"bytes":2134,"huella":"0cdeb920b0f31b56","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (82 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-fs-context","enlace":false}],"proyectos":[],"texto":"\n# evol-fs-context\n\n## Philosophy\nLarge data should be treated as files mounted by agents, not passed in context. Filesystem paradigm.\n\n## When to Use\n- Data > 50KB that doesn't fit in context\n- Log files, datasets, large documents\n- Streaming data processing\n\n## Pattern\n```\n/fs-context mount <path> [--read-only]\n/fs-context unmount <path>\n/fs-context list\n```\n\n## Implementation\n- Use file reads with offset/limit for large files\n- Stream processing for multi-GB data\n- Memory-mapped files for random access\n- Virtual filesystem abstraction\n\n## Reference\nskills/evol-fs-context/SKILL.md\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"context-engineering","grupo":"contexto","disciplina":null,"enBiblioteca":false},{"id":"evol-governance-710838","nombre":"evol-governance","carpeta":"evol-governance","descripcion":"Policy-as-code y gobernanza automatizada. Define, implementa y ejecuta políticas como código para compliance y calidad.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/governance"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/governance"},"archivos":[{"ruta":"SKILL.md","bytes":5272}],"bytes":5272,"huella":"6319d0106f498a6d","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (119 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-governance","enlace":false}],"proyectos":[],"texto":"\n# evol-governance\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita gobernanza automatizada:\n\n- **Policy-as-code**: definir políticas en código, no en documentos\n- **Compliance automation**: automatizar verificación de compliance\n- **Policy enforcement**: ejecutar políticas automáticamente\n- **Audit automation**: generar reportes de compliance automáticamente\n- **Guardrails**: restricciones que previenen violaciones\n- **Governance frameworks**: estructuras de gobierno para equipos/proyectos\n\n**No usar para**: seguridad del código (usar evol-sec), gestión de proyectos (usar evol-pm).\n\n## Conocimiento de Dominio\n\n### Policy-as-Code\n- **Declarative policies**: definir qué se permite, no cómo implementar\n- **OPA (Open Policy Agent)**: lenguaje Rego para policy enforcement\n- **Sentinel**: Hashicorp policy as code framework\n- **Kyverno**: Kubernetes-native policy engine\n- **Custom rules**: reglas específicas del proyecto/organización\n\n### Compliance Frameworks\n- **SOC 2**: security, availability, processing integrity, confidentiality, privacy\n- **GDPR**: data protection, consent, right to be forgotten\n- **HIPAA**: health information protection\n- **PCI DSS**: payment card data security\n- **ISO 27001**: information security management\n\n### Policy Patterns\n- **Preventive policies**: block violations before they happen\n- **Detective policies**: identify violations after they happen\n- **Corrective policies**: fix violations automatically\n- **Compensating policies**: alternative controls when primary not feasible\n\n### Automation Patterns\n- **CI/CD integration**: policy checks in pipeline\n- **Git hooks**: pre-commit, pre-push policy enforcement\n- **Admission controllers**: Kubernetes admission control\n- **Webhooks**: real-time policy enforcement\n- **Scheduled scans**: periodic compliance checks\n\n### Governance Structures\n- **RACI matrix**: who's Responsible, Accountable, Consulted, Informed\n- **Decision logs**: record of who decided what and why\n- **Approval workflows**: gates for critical decisions\n- **Escalation paths**: how to handle exceptions\n- **Regular reviews**: periodic governance reviews\n\n## Flujo de Trabajo\n\n1. **Identify governance needs**: what policies are needed? compliance requirements?\n2. **Define policies**: declarative rules, clear language, testable\n3. **Implement as code**: OPA/Sentinel/custom, version controlled\n4. **Integrate into pipeline**: CI/CD checks, git hooks, admission control\n5. **Test policies**: verify they work, don't block legitimate work\n6. **Deploy enforcement**: activate policies, monitor violations\n7. **Handle exceptions**: exception process, approval workflow\n8. **Review and iterate**: regular policy reviews, update as needed\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: understand compliance requirements, governance needs\n- **Spec (Fase 2)**: document policies, compliance requirements, enforcement points\n- **Plan (Fase 3)**: design policy architecture, select tools\n- **Build (Fase 4)**: implement policies as code, integrate into pipeline\n- **QA (Fase 5)**: test policy enforcement, verify no false positives\n- **Retro (Fase 6)**: review policy effectiveness, update based on learnings\n\n## Referencia\n\n- Constitución Evol-DD: Art. 2 (gated pipeline - policy enforcement)\n- Art. 8 (engineering standards - policy compliance)\n- Agentes relacionados: evol-sec (security policies), evol-devops (CI/CD integration), evol-compliance-auditor (compliance verification)\n- Open Policy Agent: https://www.openpolicyagent.org\n- Hashicorp Sentinel: https://www.hashicorp.com/sentinel\n- NIST Cybersecurity Framework: https://www.nist.gov/cyberframework\n- Thoughtworks Technology Radar: policy as code\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"equipo","disciplina":null,"enBiblioteca":false},{"id":"evol-grill-me-92eb08","nombre":"evol-grill-me","carpeta":"evol-grill-me","descripcion":"Interrogatorio implacable de planes y diseños hasta alcanzar comprensión compartida. Recorre cada rama del árbol de decisiones resolviendo dependencias una a una. Inspirado en mattpocock/skills grill-me (MIT).","categoria":null,"origen":"evol-dd","licencia":null,"version":null,"triggers":["- \"grill me\" - \"interrógate mi plan\" - \"stress-test\" - \"ponme a prueba\" - \"cuestioname\" - \"drill me\""],"cuandoUsarla":["Cuando hay un plan, diseño o decisión técnica que necesita ser stress-testeado antes de comprometer recursos. Trigger: \"grill me\", \"interrógate mi plan\", \"stress-test esto\", \"ponme a prueba\"."],"compatible":[],"frontmatter":{"origin":"evol-dd","inspired_by":"mattpocock/skills grill-me (MIT, atribución en NOTICE)","when_to_use":"Cuando hay un plan, diseño o decisión técnica que necesita ser stress-testeado antes de comprometer recursos. Trigger: \"grill me\", \"interrógate mi plan\", \"stress-test esto\", \"ponme a prueba\".","triggers":"- \"grill me\" - \"interrógate mi plan\" - \"stress-test\" - \"ponme a prueba\" - \"cuestioname\" - \"drill me\"","evals":"evals/evol-grill-me/"},"archivos":[{"ruta":"SKILL.md","bytes":5571}],"bytes":5571,"huella":"763a1b1599389600","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":true,"revision":[{"nivel":"error","texto":"Frontmatter: YAML inválido: Nested mappings are not allowed in compact mappings at line 5, column 14:. Suele arreglarse poniendo la description entre comillas o con el bloque «description: >»."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (209 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-grill-me","enlace":false}],"proyectos":[],"texto":"\n# evol-grill-me\n\nSkill de interrogatorio técnico implacable. Recorre el árbol de decisiones\nde cualquier plan o diseño, rama por rama, hasta que no quedan supuestos\nsin validar ni dependencias sin resolver.\n\n## Filosofía\n\nUn plan no interrogado es un riesgo oculto. Esta skill materializa el\nprincipio de \"Ambigüedad Cero\" (Art. 1 Constitución Evol-DD) aplicado a\ndiseños y planes, no solo a specs.\n\n**Diferencia con `/clarify`:** `/clarify` detecta ambigüedad en artefactos\nexistentes (SPEC, PLAN). `evol-grill-me` interroga activamente el razonamiento\ndetrás de decisiones, explorando ramas no escritas del árbol de decisiones.\n\n## Activación\n\n```\n\"grill me sobre [plan/diseño/decisión]\"\n\"interrógate mi arquitectura\"\n\"stress-test mi propuesta\"\n\"ponme a prueba sobre [X]\"\n```\n\n## Protocolo de interrogatorio\n\n### Fase 1 — Mapeo del árbol\n1. Identifica el plan/diseño objetivo.\n2. Mapea las ramas principales de decisión (máx 5 por nivel).\n3. Detecta dependencias entre ramas.\n4. Si el contexto permite explorar el codebase, hazlo antes de preguntar.\n\n### Fase 2 — Interrogatorio sistemático\nReglas estrictas:\n- **Una pregunta a la vez.** Nunca bundle de preguntas.\n- **Para cada pregunta:** provee tu respuesta recomendada antes de esperar la del usuario.\n- **Resuelve dependencias en orden:** primero las ramas que desbloquean otras.\n- **Explora codebase** si la respuesta puede derivarse de él (usa Read/Grep/Glob).\n- **No aceptes \"depende\" sin especificar** de qué depende exactamente.\n\n### Fase 3 — Síntesis\nAl agotar el árbol de decisiones:\n1. Lista supuestos validados vs supuestos aún en riesgo.\n2. Identifica el camino crítico de dependencias.\n3. Produce `GRILL_REPORT.md` si el usuario lo solicita.\n\n## Estructura de preguntas\n\nPara cada nodo del árbol de decisiones:\n\n```\n[Rama: <nombre>]\nPregunta: <pregunta específica y accionable>\nMi respuesta recomendada: <respuesta con razonamiento>\nTu respuesta: ?\n```\n\n## Áreas de interrogación estándar\n\n| Área | Preguntas clave |\n|------|----------------|\n| **Supuestos** | ¿Qué asumimos que es verdad? ¿Qué pasa si es falso? |\n| **Dependencias** | ¿Qué debe existir/pasar antes de que esto funcione? |\n| **Casos borde** | ¿Qué pasa con X=0, X=null, concurrencia, fallo parcial? |\n| **Escalabilidad** | ¿Funciona con 10x la carga esperada? ¿Y con 0.1x? |\n| **Reversibilidad** | ¿Qué tan difícil es deshacer esta decisión? |\n| **Alternativas** | ¿Por qué esta opción y no Y o Z? |\n| **Métricas** | ¿Cómo sabemos que funcionó? ¿Qué mide el éxito? |\n\n## Integración Evol-DD\n\n- Invocada por `/clarify` cuando detecta plan sin stress-test.\n- Invocada por `/brainstorm` antes de convergencia.\n- Invocada por `/project-architecture-gsd` en fase de diseño.\n- Invocada por `/plan-fases` antes de aprobación de plan.\n\n## Agentes que la usan\n\n- `evol-researcher` — interroga supuestos de investigación\n- `evol-pm` — stress-test de features y prioridades\n- `evol-architect` — valida decisiones arquitectónicas\n\n## Output opcional\n\n```bash\n# Genera reporte formal post-interrogatorio\nGRILL_REPORT.md:\n  - Plan original\n  - Árbol de decisiones explorado\n  - Supuestos validados\n  - Riesgos residuales\n  - Decisiones finales tomadas\n```\n\n## Atribución\nConcepto inspirado en [mattpocock/skills grill-me](https://github.com/mattpocock/skills/tree/main/skills/productivity/grill-me) (MIT).\nImplementación nativa Evol-DD con integración al pipeline gated y árbol de decisiones explícito.\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":null,"grupo":"descubrimiento","disciplina":null,"enBiblioteca":false},{"id":"evol-growth-experiment-5fb32d","nombre":"evol-growth-experiment","carpeta":"evol-growth-experiment","descripcion":"A/B testing y experimentation frameworks para optimización de conversión. Diseña experiments, mide resultados itera basado en datos.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/growth"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/growth"},"archivos":[{"ruta":"SKILL.md","bytes":5331}],"bytes":5331,"huella":"73d3e9d3f8bbbd7c","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (132 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-growth-experiment","enlace":false}],"proyectos":[],"texto":"\n# evol-growth-experiment\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita diseñar y ejecutar experiments de crecimiento:\n\n- **Experiment design**: hipótesis, variables, métricas, sample size\n- **A/B testing**: split tests, multivariate testing, feature flags\n- **Conversion optimization**: CRO, funnel optimization, drop-off analysis\n- **Metrics definition**: north star metric, input metrics, guardrail metrics\n- **Statistical analysis**: significance, confidence intervals, bayesian analysis\n- **Growth loops**: self-reinforcing loops de crecimiento\n\n**No usar para**: analytics generales (usar evol-data), SEO technical (usar evol-seo-technical).\n\n## Conocimiento de Dominio\n\n### Experiment Design\n- **Hypothesis format**: \"We believe [action] will result in [outcome] because [reasoning]\"\n- **Variables**: independent (what we change), dependent (what we measure), controlled (what we keep same)\n- **Sample size**: calculado basado en MDE, baseline conversion, significance level\n- **Duration**: mínimo 1-2 business cycles, no stopping early\n\n### A/B Testing\n- **Split testing**: users randomly assigned to A or B\n- **Multivariate testing**: multiple variations simultaneously\n- **Feature flags**: gradual rollouts, kill switches\n- **Cuped**: variance reduction using pre-experiment data\n- **Bayesian analysis**: probability of being best, not just p<0.05\n\n### Conversion Optimization\n- **North star metric**: single metric that captures product value\n- **Input metrics**: controllable metrics that drive north star\n- **Guardrail metrics**: metrics we don't want to hurt\n- **Micro-conversions**: small steps toward main conversion\n- **Drop-off analysis**: where users leave, why, how to fix\n\n### Growth Loops\n- **Acquisition → Activation → Revenue → Referral**: classic growth loop\n- **Viral loops**: users bring users (K-factor > 1)\n- **Content loops**: users create content that attracts more users\n- **Paid loops**: spend money → get users → get revenue → spend more\n\n### Statistical Rigor\n- **Minimum Detectable Effect (MDE)**: smallest effect we care about\n- **Statistical significance**: p-value threshold (typically 0.05)\n- **Practical significance**: is the effect size meaningful?\n- **Multiple comparisons**: Bonferroni correction, false discovery rate\n- **Peeking problem**: don't stop experiments early based on results\n\n## Flujo de Trabajo\n\n1. **Identificar oportunidad**: dónde hay potencial de mejora, qué metric mover\n2. **Formular hipótesis**: qué creemos que pasará y por qué\n3. **Diseñar experiment**: variables, sample size, duration, success criteria\n4. **Implementar**: feature flags, tracking, variations\n5. **Ejecutar**: run experiment, don't touch, monitor guardrails\n6. **Analizar resultados**: statistical significance, practical significance\n7. **Decidir**: ship winner, iterate, or kill experiment\n8. **Documentar learnings**: what we learned, what we'll try next\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: identify growth opportunities, define north star\n- **Spec (Fase 2)**: document experiment design, metrics, success criteria\n- **Plan (Fase 3)**: prioritize experiments by impact × confidence\n- **Build (Fase 4)**: implement feature flags, tracking, variations\n- **QA (Fase 5)**: test experiment setup, verify tracking accuracy\n- **Retro (Fase 6)**: analyze results, document learnings, plan next experiments\n\n## Referencia\n\n- Constitución Evol-DD: Art. 9 (pipeline con iteración)\n- Agentes relacionados: evol-data (analytics), evol-ux (user behavior), evol-marketing (marketing metrics)\n- Ronny Kohavi - \"Trustworthy Online Controlled Experiments\": the A/B testing bible\n- Reforge - growth frameworks and loops\n- experimentation.dev: community of practice\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"descubrimiento","disciplina":null,"enBiblioteca":false},{"id":"evol-idea-refine-5def21","nombre":"evol-idea-refine","carpeta":"evol-idea-refine","descripcion":"Refinamiento de ideas brutas en conceptos accionables. Pipeline divergente→convergente en 3 fases (Expandir / Evaluar / Afilar). Produce one-pager Markdown con dirección recomendada y lista explícita de \"No Hacemos\". Inspirado en addyosmani/agent-skills idea-refine.","categoria":null,"origen":"evol-dd","licencia":null,"version":null,"triggers":["- \"refina esta idea\" - \"help me refine\" - \"ideate on\" - \"trabaja mi idea\" - \"afina esto\" - \"desarrolla este concepto\""],"cuandoUsarla":["Cuando una idea está en estado bruto y necesita claridad antes de spec. Complementa /brainstorm (divergente) con convergencia accionable. Trigger: \"refina esta idea\", \"help me refine\", \"ideate on\", \"trabaja mi idea\"."],"compatible":[],"frontmatter":{"origin":"evol-dd","inspired_by":"addyosmani/agent-skills idea-refine (MIT, atribución en NOTICE)","when_to_use":"Cuando una idea está en estado bruto y necesita claridad antes de spec. Complementa /brainstorm (divergente) con convergencia accionable. Trigger: \"refina esta idea\", \"help me refine\", \"ideate on\", \"t","triggers":"- \"refina esta idea\" - \"help me refine\" - \"ideate on\" - \"trabaja mi idea\" - \"afina esto\" - \"desarrolla este concepto\"","evals":"evals/evol-idea-refine/"},"archivos":[{"ruta":"SKILL.md","bytes":6917}],"bytes":6917,"huella":"4277236056c675ff","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":true,"revision":[{"nivel":"error","texto":"Frontmatter: YAML inválido: Nested mappings are not allowed in compact mappings at line 5, column 14:. Suele arreglarse poniendo la description entre comillas o con el bloque «description: >»."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (266 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-idea-refine","enlace":false}],"proyectos":[],"texto":"\n# evol-idea-refine\n\nSkill de refinamiento de ideas: transforma conceptos vagos en propuestas\naccionables con dirección clara, supuestos explícitos y trade-offs declarados.\n\n## Filosofía\n\n- \"La simplicidad es la máxima sofisticación.\" — Steve Jobs\n- Empieza con UX, trabaja hacia atrás hasta la tecnología.\n- Dile no a 1,000 cosas. La lista \"No Hacemos\" es tan valiosa como la dirección.\n- Sé honesto, no complaciente. Empuja hacia atrás en ideas débiles.\n\n**Diferencia con `/brainstorm`:** `/brainstorm` es puramente divergente, genera\nsin filtrar. `evol-idea-refine` cierra el loop: converge hacia una dirección\naccionable y hace los trade-offs explícitos.\n\n## Anti-patterns bloqueados\n\n- No generar 20+ ideas superficiales. 5-8 consideradas > muchas shallow.\n- No saltarse \"¿para quién es esto?\".\n- No producir plan sin surfacear supuestos.\n- No ser yes-machine. Empujar hacia atrás si la idea es débil.\n- No ignorar restricciones del codebase (explorar con Glob/Grep/Read si aplica).\n\n## Pipeline de 3 fases\n\n---\n\n### Fase 1 — Entender y Expandir (Divergente)\n\n**1.1 Reformulación como \"How Might We\"**\nConvierte la idea en un problema bien formulado:\n> \"¿Cómo podríamos [acción] para [persona] de manera que [resultado]?\"\n\n**1.2 Preguntas de enfoque (3-5 max)**\nHacer en orden, una a la vez:\n1. ¿Para quién específicamente es esto? (persona concreta)\n2. ¿Qué aspecto exitoso concreto y medible?\n3. ¿Cuáles son las restricciones no negociables?\n4. ¿Qué se ha intentado antes? ¿Por qué no funcionó?\n5. ¿Por qué ahora y no antes?\n\n**1.3 Variaciones (5-8 ideas)**\nExplorar con lentes diferentes:\n\n| Lente | Pregunta guía |\n|-------|---------------|\n| Inversión | ¿Qué pasa si hacemos lo opuesto? |\n| Sin restricciones | ¿Cómo sería sin limitaciones técnicas/presupuesto? |\n| Cambio de audiencia | ¿Y si es para un usuario completamente diferente? |\n| Combinación | ¿Con qué otra herramienta/concepto se combina? |\n| Simplificación | ¿Cuál es la versión más simple que funciona? |\n| 10x | ¿Cómo sería si fuera 10 veces más impactante? |\n| Experto | ¿Cómo lo haría [experto en el dominio]? |\n\nSi hay codebase: explorar con Glob/Grep/Read antes de inventar.\n\n---\n\n### Fase 2 — Evaluar y Converger\n\n**2.1 Clustering**\nAgrupa las variaciones en 2-3 direcciones distintas (no 7 iguales con distinto nombre).\n\n**2.2 Stress-test por dirección**\n\n| Criterio | Pregunta |\n|----------|---------|\n| Valor usuario | ¿Painkiller o vitamina? ¿Cuánto dolor alivia? |\n| Factibilidad | ¿Costo técnico y de recursos? ¿Qué dependencias? |\n| Diferenciación | ¿Genuinamente diferente o variación de algo existente? |\n\n**2.3 Supuestos ocultos (obligatorio)**\nPara la dirección favorita:\n- ¿Qué estamos apostando que es verdad?\n- ¿Qué podría matar esto?\n- ¿Qué estamos eligiendo ignorar conscientemente?\n\n---\n\n### Fase 3 — Afilar y Entregar\n\nProduce un **one-pager Markdown** con estructura fija:\n\n```markdown\n# Idea Refinement — <título idea>\n**Fecha:** <ISO date> | **Autor:** <context> | **Estado:** DRAFT\n\n## Problema\n<\"How Might We\" statement + 1 párrafo de contexto>\n\n## Dirección recomendada\n<qué hacemos y por qué esta dirección>\n\n## Supuestos a validar\n- [ ] <supuesto 1 — método de validación>\n- [ ] <supuesto 2 — método de validación>\n- [ ] <supuesto 3 — método de validación>\n\n## MVP scope\n<qué entra en la primera iteración — lo mínimo que valida la hipótesis>\n\n## No hacemos (y por qué)\n| Qué | Por qué no |\n|-----|-----------|\n| <feature tentador> | <trade-off explícito> |\n| <otra cosa> | <razón honesta> |\n\n## Próximos pasos\n1. <acción concreta siguiente>\n2. <quién valida qué supuesto>\n```\n\n**La lista \"No Hacemos\" es la parte más valiosa.** Trade-offs implícitos son deuda cognitiva.\n\n## Almacenamiento opcional\n\nAl finalizar, ofrecer guardar en:\n```\ndocs/ideas/<idea-slug>.md\n```\n\n## Integración Evol-DD\n\n- Invocada por `/ux-discovery` como paso de convergencia post-discovery.\n- Invocada por `/brainstorm` al final de sesión divergente.\n- Invocada por `/fase-requisitos` para refinar features antes de spec.\n- Invocada por `/plan-fases` cuando hay ambigüedad en scope.\n\n## Agentes que la usan\n\n- `evol-pm` — refina features y prioridades de producto\n- `evol-ux` — procesa feedback de usuarios en ideas refinadas\n- `evol-architect` — convierte ideas en decisiones técnicas accionables\n\n## Atribución\nConcepto inspirado en [addyosmani/agent-skills idea-refine](https://github.com/addyosmani/agent-skills/tree/main/skills/idea-refine) (MIT).\nImplementación nativa Evol-DD: pipeline 3 fases integrado al gated pipeline,\none-pager compatible con DOC_STANDARD.md, integración con /brainstorm y /ux-discovery.\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":null,"grupo":"descubrimiento","disciplina":null,"enBiblioteca":false},{"id":"evol-iodd-iac-46341e","nombre":"evol-iodd-iac","carpeta":"evol-iodd-iac","descripcion":"Infrastructure-as-Code Discipline — Terraform, Pulumi, IaC patterns, drift detection","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/iodd-iac"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/iodd-iac"},"archivos":[{"ruta":"SKILL.md","bytes":4210}],"bytes":4210,"huella":"1e60f80c8739d15d","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (84 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-iodd-iac","enlace":false}],"proyectos":[],"texto":"\n# evol-iodd-iac\n\n## Fase del Pipeline\n\n**Spec (Fase 2) — Especificación y Diseño**\n\nActivar cuando se necesita diseñar o auditar infraestructura como código:\n- Definición de infraestructura (Terraform/Pulumi)\n- Patrones IaC (módulos, estado remoto, workspaces)\n- Detección de drift\n- Validación de seguridad IaC\n\n## Artefacto Clave\n\n**`infra/` (Terraform/Pulumi files)**\n\n```hcl\n# infra/main.tf\nmodule \"vpc\" {\n  source = \"./modules/vpc\"\n  cidr_block = var.vpc_cidr\n  environment = var.environment\n}\n\nmodule \"eks\" {\n  source = \"./modules/eks\"\n  cluster_name = \"${var.project}-${var.environment}\"\n  vpc_id = module.vpc.vpc_id\n}\n\n# infra/variables.tf\nvariable \"environment\" {\n  type = string\n  validation {\n    condition     = contains([\"dev\", \"staging\", \"prod\"], var.environment)\n    error_message = \"Environment must be dev, staging, or prod\"\n  }\n}\n```\n\n## Flujo de Trabajo\n\n```bash\n# 1. Analizar infraestructura existente\nfind infra/ -name \"*.tf\" -o -name \"*.ts\" | head -20\n\n# 2. Generar estructura de módulos\npython3 scripts/iodd-iac/scaffold.py \\\n  --project myproject \\\n  --provider aws \\\n  --output infra/\n\n# 3. Validar configuración\ncd infra && terraform validate && cd ..\n\n# 4. Detectar drift\npython3 scripts/iodd-iac/drift-detect.py \\\n  --infra-dir infra/ \\\n  --output docs/infra/DRIFT_REPORT.md\n\n# 5. Ejecutar Checkov (security scan)\ncheckov -d infra/ --framework terraform\n\n# 6. Generar documentación\npython3 scripts/iodd-iac/docs-gen.py \\\n  --infra-dir infra/ \\\n  --output docs/infra/INFRASTRUCTURE.md\n\n# 7. Plan de cambios\ncd infra && terraform plan -out=plan.out && cd ..\n```\n\n### Estado Remoto\n\n```hcl\n# infra/backend.tf\nterraform {\n  backend \"s3\" {\n    bucket         = \"myproject-tfstate\"\n    key            = \"env/prod/terraform.tfstate\"\n    region         = \"us-east-1\"\n    dynamodb_table = \"terraform-locks\"\n    encrypt        = true\n  }\n}\n```\n\n## Integración con Pipeline\n\n| Fase | Gate | Check | Automático |\n|------|------|-------|------------|\n| Briefing | Requisitos infra | Recursos necesarios identificados | No |\n| Spec | Diseño IaC | Archivos .tf/.ts creados | Sí |\n| Plan | Validación infra | `terraform validate` pass | Sí |\n| Build | Apply infra | Recursos provisionados | Sí |\n| QA | Drift detectado | Sin drift o justificado | Sí |\n| Retro | Lecciones infra | Mejoras documentadas | No |\n\n## Referencia\n\n- **Constitución Art. 8** — Estándares de ingeniería\n- **Constitución Art. 9** — Fase Spec del Pipeline\n- **Discipline Doc** — `docs/disciplines/IODD_IaC.md`\n- **Terraform Best Practices** — https://www.terraform-best-practices.com/\n- **Pulumi Patterns** — https://www.pulumi.com/docs/guides/\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"IODD","nombre":"Infrastructure-as-Code-Driven Development","tipo":"extendida","fases":["spec"]},"enBiblioteca":false},{"id":"evol-mcp-builder-93c95e","nombre":"evol-mcp-builder","carpeta":"evol-mcp-builder","descripcion":"Construye herramientas de integración para agentes using MCP protocol. Diseña tools, patterns de integración y arquitectura de agentes.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/mcp-builder"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/mcp-builder"},"archivos":[{"ruta":"SKILL.md","bytes":5294}],"bytes":5294,"huella":"19f0561bf7d5f128","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (135 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-mcp-builder","enlace":false}],"proyectos":[],"texto":"\n# evol-mcp-builder\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita construir o integrar herramientas para agentes:\n\n- **MCP protocol**: Model Context Protocol, tool definitions, resource exposure\n- **Tool design**: diseñar tools que sean useful, composable, safe\n- **Agent integration**: conectar agentes con external systems\n- **Resource management**: exposición de archivos, databases, APIs como resources\n- **Security**: sandboxing, permission models, rate limiting\n- **Testing**: testear tools y agent integrations\n\n**No usar para**: arquitectura de agentes Evol-DD (usar evol-architect), optimización de rendimiento (usar evol-balance).\n\n## Conocimiento de Dominio\n\n### MCP Protocol\n- **Tools**: funciones que el LLM puede llamar (name, description, parameters, handler)\n- **Resources**: datos que el LLM puede leer (files, DB records, API responses)\n- **Prompts**: templates de prompts que el LLM puede usar\n- **Sampling**: permitir al LLM solicitar completions a otros modelos\n\n### Tool Design\n- **Single responsibility**: cada tool hace una cosa bien\n- **Clear naming**: nombres descriptivos, no abbreviations\n- **Comprehensive description**: qué hace, cuándo usarla, qué devuelve\n- **Parameter validation**: schemas claros, defaults sensatos\n- **Error handling**: errores informativos, no stack traces\n- **Idempotency**: same input = same output, safe to retry\n\n### Agent Integration Patterns\n- **Tool composition**: combinar tools para workflows complejos\n- **Resource mounting**: exponer datos como resources\n- **Prompt templates**: prompts reutilizables con variables\n- **Middleware**: logging, auth, rate limiting entre tool y handler\n- **Caching**: cache results para tools expensive\n\n### Security\n- **Sandboxing**: limitar qué puede hacer cada tool\n- **Permission model**: ACLs por tool, por resource\n- **Input validation**: sanitizar todo input antes de usar\n- **Rate limiting**: prevenir abuse\n- **Audit logging**: track qué tools se usan y cómo\n- **Secret management**: nunca exponer secrets en tool outputs\n\n### Testing\n- **Unit tests**: testear handlers con mocks\n- **Integration tests**: testear tools con real backends\n- **Contract tests**: verify tool schema matches implementation\n- **E2E tests**: testear full agent + tool flow\n- **Chaos testing**: testear con failures y edge cases\n\n## Flujo de Trabajo\n\n1. **Identificar necesidad**: ¿Qué tool se necesita? ¿Qué problem resuelve?\n2. **Diseñar tool schema**: name, description, parameters, return type\n3. **Implementar handler**: lógica del tool, validación, error handling\n4. **Exponer via MCP**: register tool, define resources, setup server\n5. **Segurar**: sandboxing, permissions, input validation\n6. **Testear**: unit, integration, contract, E2E tests\n7. **Documentar**: usage examples, error cases, limitations\n8. **Iterar**: collect feedback, improve based on actual usage\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: identificar qué tools se necesitan para el proyecto\n- **Spec (Fase 2)**: documentar tool schemas, security requirements\n- **Plan (Fase 3)**: estimar esfuerzo de implementación, dependencias\n- **Build (Fase 4)**: implementar tools con TDD, testing completo\n- **QA (Fase 5)**: testear tools, integration, security\n- **Retro (Fase 6)**: analizar uso de tools, identificar mejoras\n\n## Referencia\n\n- Constitución Evol-DD: Art. 6 (orquestación multi-agente)\n- Agentes relacionados: evol-architect (arquitectura), evol-devops (deployment), evol-sec (security)\n- MCP Specification: https://spec.modelcontextprotocol.io\n- Anthropic MCP Documentation: https://docs.anthropic.com/en/docs/agents-and-tools/mcp\n- Tool Design Patterns: https://github.com/modelcontextprotocol\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"codigo","disciplina":null,"enBiblioteca":false},{"id":"evol-mdd-migrate-3ff695","nombre":"evol-mdd-migrate","carpeta":"evol-mdd-migrate","descripcion":"Migration-Driven Development. Genera migraciones de esquema versionadas con up/down reversibles y migracion de datos explicita.","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/mdd"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/mdd"},"archivos":[{"ruta":"SKILL.md","bytes":4654}],"bytes":4654,"huella":"adc160c5ef0b18d7","modificado":"2026-10-22T08:40:01.927Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (127 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-mdd-migrate","enlace":false}],"proyectos":[],"texto":"\n# evol-mdd-migrate\n\n## Fase del Pipeline\nPlan (Fase 3)\n\n## Artefacto Clave\n`docs/plan/MIGRATION.md`\n\n## Flujo de Trabajo\n\n### 1. Detectar cambios de esquema\n```bash\n# Comparar modelo actual vs nuevo\nevol-mdd diff --current=entities/current.json --new=entities/new.json --output=migrations/proposed_changes.json\n```\n\n### 2. Generar migraciones up/down\n```bash\n# Generar par up/down desde el cambio de modelo\nevol-mdd generate --changes=migrations/proposed_changes.json --output=migrations/$(date +%Y%m%d%H%M%S)/\n\n# Verificar que el directorio tiene up.sql + down.sql\nls migrations/$(date +%Y%m%d%H%M%S)/\n```\n\n### 3. Generar migracion de datos si aplica\n```bash\n# Detectar si el cambio requiere migracion de datos\nevol-mdd needs-data-migration --changes=migrations/proposed_changes.json\n\n# Generar data_migration.md cuando aplica\nevol-mdd data-migration --changes=migrations/proposed_changes.json --output=migrations/$(date +%Y%m%d%H%M%S)/data_migration.md\n```\n\n### 4. Verificar reversibilidad\n```bash\n# Ejecutar up -> down -> up en entorno de prueba\nevol-mdd verify-reversible --migration=migrations/$(date +%Y%m%d%H%M%S)/ --db=test\n\n# Generar reporte de migracion\nevol-mdd report --migration=migrations/$(date +%Y%m%d%H%M%S)/ --output=docs/plan/MIGRATION.md\n```\n\n## Formato up.sql\n\n```sql\n-- MIGRATION: 20260607_add_user_role\n-- Up: Agregar campo role a la tabla usuarios\n\nALTER TABLE usuarios ADD COLUMN role VARCHAR(20) DEFAULT 'user' NOT NULL;\nCREATE INDEX idx_usuarios_role ON usuarios(role);\n\n-- Data migration: asignar role basado en existencia de permisos\nUPDATE usuarios SET role = 'admin' WHERE id IN (\n  SELECT DISTINCT usuario_id FROM permisos WHERE nivel = 'admin'\n);\n```\n\n## Formato down.sql\n\n```sql\n-- MIGRATION: 20260607_add_user_role\n-- Down: Revertir agregado de campo role\n\nDROP INDEX IF EXISTS idx_usuarios_role;\nALTER TABLE usuarios DROP COLUMN IF EXISTS role;\n```\n\n## Formato MIGRATION.md\n\n```markdown\n# Migration Plan\n\n**Fecha:** 2026-06-07\n**Migracion:** 20260607_add_user_role\n\n## Cambio de Esquema\nAgregar campo `role` (VARCHAR 20, default 'user') a tabla `usuarios`.\n\n## Migracion de Datos\nAsignar `role = 'admin'` a usuarios con permisos de nivel admin existentes.\n\n## Reversibilidad\nEl down.sql elimina la columna y el indice. La migracion de datos no es reversible\n(sin historial de valores anteriores).\n\n## Verificacion\n- [ ] up.sql ejecuta sin errores\n- [ ] down.sql revierte completamente\n- [ ] up -> down -> up es idempotente\n- [ ] Datos preservados correctamente\n```\n\n## Integracion con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Plan | Generar migraciones up/down desde el cambio de modelo |\n| Build | Aplicar migracion en entornos no productivos |\n| QA | Verificar rollback y migracion de datos |\n| Gate | Bloquea si la migracion no es reversible |\n\n## Referencia\n- `docs/constitucion.md` Art. 2 (Pipeline gated)\n- `docs/constitucion.md` Art. 9 (Evol-DD Pipeline)\n- `docs/disciplinas/MDD.md`\n- [Evolutionary Database Design — Martin Fowler](https://martinfowler.com/articles/evodb.html)\n- [Flyway](https://github.com/flyway/flyway)\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"discipline-extended","grupo":"disciplinas","disciplina":{"id":"MDD","nombre":"Migration-Driven Development","tipo":"extendida","fases":["plan"]},"enBiblioteca":false},{"id":"evol-minimal-6ff5ff","nombre":"evol-minimal","carpeta":"evol-minimal","descripcion":"Anti-over-engineering enforcer. Aplica una decision ladder (YAGNI → stdlib → feature nativa → dependencia ya instalada → one-line → minimo que funciona) antes de escribir codigo, para evitar soluciones infladas. Activar cuando el usuario pida \"lo mas simple\", \"sin sobre-ingenieria\", \"minimo viable\", \"no agregues dependencias\", revise un diff buscando complejidad innecesaria, o invoque /minimal. Tambien al construir features en fase Build: el agente prefiere la opcion mas baja de la escala que cumpla el requisito. Inspirada en ponytail (github.com/DietrichGebert/ponytail).","categoria":"quality-gate","origen":"evol-dd","licencia":null,"version":null,"triggers":["/minimal","lo mas simple posible","sin sobre-ingenieria","minimo viable","no agregues dependencias"],"cuandoUsarla":["Construir una feature y elegir entre stdlib vs dependencia nueva","Revisar un diff por sobre-ingenieria (abstracciones prematuras, deps de mas)","Usuario pide \"minimo\", \"simple\", \"sin bloat\", \"no instales nada\"","Auditar un repo por complejidad acumulada"],"compatible":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"],"frontmatter":{"origin":"evol-dd","category":"quality-gate","when_to_use":["Construir una feature y elegir entre stdlib vs dependencia nueva","Revisar un diff por sobre-ingenieria (abstracciones prematuras, deps de mas)","Usuario pide \"minimo\", \"simple\", \"sin bloat\", \"no instales nada\"","Auditar un repo por complejidad acumulada"],"triggers":["/minimal","lo mas simple posible","sin sobre-ingenieria","minimo viable","no agregues dependencias"],"compatible_with":["claude-code","opencode","cursor","windsurf","vscode-copilot","antigravity","codex"]},"archivos":[{"ruta":"SKILL.md","bytes":5756},{"ruta":"evals/evals.json","bytes":1675},{"ruta":"scripts/minimal.py","bytes":2728}],"bytes":10159,"huella":"aa602878ed61ba69","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (578 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"aviso","texto":"Incluye 1 script(s) que el agente puede ejecutar: scripts/minimal.py. Revísalos antes de usarla."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-minimal","enlace":false}],"proyectos":[],"texto":"\n# evol-minimal\n\n## Proposito\n\nLos agentes tienden a sobre-construir: abstracciones prematuras, dependencias que\nla stdlib ya cubre, capas de configuracion que nadie pidio. Cada linea de mas es\ndeuda: mas superficie de bug, mas tokens, mas coste, mas tiempo. Esta skill\nfuerza la pregunta \"¿esto necesita existir?\" antes de escribir, y empuja hacia\nel escalon mas bajo de la escala que cumpla el requisito real.\n\nNo es austeridad ciega: los guardrails (validacion en trust-boundary, manejo de\nperdida de datos, seguridad, accesibilidad) nunca se recortan. La ganancia viene\nde eliminar lo innecesario, no de bajar la defensa.\n\n## Decision ladder\n\nAntes de generar codigo, recorrer la escala de arriba hacia abajo y detenerse en\nel primer escalon que resuelva el requisito:\n\n```mermaid\nflowchart TD\n    A[\"¿Necesita existir?\"] -->|no| Z[\"Omitir (YAGNI)\"]\n    A -->|si| B[\"¿La stdlib lo hace?\"]\n    B -->|si| B2[\"Usar stdlib\"]\n    B -->|no| C[\"¿Feature nativa de la plataforma?\"]\n    C -->|si| C2[\"Usar feature nativa\"]\n    C -->|no| D[\"¿Dependencia YA instalada?\"]\n    D -->|si| D2[\"Usar la dependencia existente\"]\n    D -->|no| E[\"¿Cabe en una linea?\"]\n    E -->|si| E2[\"Una linea\"]\n    E -->|no| F[\"El minimo que funciona\"]\n```\n\nRegla de oro: agregar una **nueva** dependencia es el ultimo recurso, no el\nprimero. Si la stdlib lo cubre, no se instala nada.\n\n## Niveles\n\nMismo patron que `evol-compact --level`. El nivel ajusta cuan agresivo es el\nenforcement, no si los guardrails aplican (siempre aplican).\n\n| Nivel | Comportamiento |\n|-------|---------------|\n| `lite` | Solo evita deps nuevas obvias y codigo muerto. Intervencion minima. |\n| `full` | Recorre la escala completa en cada decision de codigo. **Default.** |\n| `ultra` | Minimizacion agresiva: reescribe abstracciones, colapsa capas, cuestiona cada archivo nuevo. Para bases muy infladas. |\n| `off` | Desactiva el enforcement. |\n\n```\n/minimal               # muestra el nivel actual\n/minimal full          # fija el nivel\n/minimal off           # desactiva\n```\n\nEl nivel se persiste en `.evol/.minimal-level` (un archivo con el string del\nnivel, gitignored). Si no existe, default = `full`.\n\n## Guardrails (nunca se recortan)\n\nEl ladder optimiza implementacion, no recorta defensa. Estas dimensiones quedan\nfuera de la tijera siempre, en cualquier nivel:\n\n- Validacion en el trust-boundary (input externo nunca se confia)\n- Manejo de perdida de datos (escrituras, migraciones, borrados)\n- Seguridad (authn/authz, secrets, inyeccion)\n- Accesibilidad (a11y en UI)\n\nSi minimizar tocaria uno de estos, **no se minimiza**: se deja y se anota por que.\n\n## Subcomandos\n\nCablean a herramientas que ya existen — esta skill solo aporta el lente\nanti-bloat; no reimplementa review/audit/eval.\n\n| Subcomando | Que hace | Cablea a |\n|-----------|----------|----------|\n| `/minimal review` | Revisa el diff actual buscando sobre-ingenieria (deps de mas, abstraccion prematura, codigo muerto) | `/code-review` + lente del ladder |\n| `/minimal audit` | Escanea el repo por complejidad acumulada | `evol-shield` audit |\n| `/minimal debt` | Consolida marcadores `minimal:` del codigo en tareas accionables del ledger de deuda | `scripts/debt/budget.py` (skill `evol-debt-budget`) |\n| `/minimal gain` | Mide reduccion (LOC, tokens, deps) de aplicar la skill | `evol-eval` harness |\n\n### Marcador `minimal:`\n\nCuando algo no se simplifica ahora pero deberia, dejar un marcador en un comentario\ndel codigo con el prefijo del lenguaje (`#`, `//`, `--`, ...) seguido de\n`minimal: <razon>`. Ejemplo (Python): un comentario `# ` seguido de\n`minimal: esta clase wrapper sobra si migramos a dataclass`.\n\nEl scanner solo cuenta marcadores en comentarios, no menciones en prosa o strings.\n`/minimal debt` recoge todos esos marcadores del repo y los vuelca como entradas\nen el ledger de `evol-debt-budget`, en vez de que se pierdan como TODOs sueltos.\n\n## Integracion en el pipeline\n\n- **Fase Build (4):** el orquestador aplica el ladder al construir cada feature —\n  prefiere el escalon mas bajo que cumpla el requisito. Un agente que mete una\n  dependencia evitable falla el sub-gate de minimalismo.\n- **Fase QA/Review (5):** `/minimal review` corre sobre el diff antes del gate,\n  junto a `/code-review`. Sobre-ingenieria detectada → se registra en lecciones.\n\n## Referencias\n\n- Inspiracion: ponytail — github.com/DietrichGebert/ponytail (MIT)\n- Mecanica de niveles: `skills/evol-compact/SKILL.md`\n- Ledger de deuda: `skills/evol-debt-budget/SKILL.md`\n- Portabilidad IDE: `scripts/evol-adapt.sh`\n","cuerpoCompleto":true,"categoriaOriginal":"quality-gate","grupo":"calidad","disciplina":null,"enBiblioteca":false},{"id":"evol-narrative-docs-23b9c6","nombre":"evol-narrative-docs","carpeta":"evol-narrative-docs","descripcion":"Documentación con storytelling técnico. Aplica estructura narrativa, decisiones branching y technical storytelling para crear docs que se lean y se entiendan.","categoria":"game-inspired","origen":null,"licencia":null,"version":null,"triggers":["/narrative-docs"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"game-inspired","trigger":"/narrative-docs"},"archivos":[{"ruta":"SKILL.md","bytes":5338}],"bytes":5338,"huella":"e05716124e934770","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (158 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-narrative-docs","enlace":false}],"proyectos":[],"texto":"\n# evol-narrative-docs\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita crear documentación que sea engaging y comprensible:\n\n- **Technical storytelling**: convertir specs secas en narrativas que enganchan\n- **Decision records**: ADRs con contexto narrativo, no solo dry facts\n- **Architecture docs**: documentación que cuente la historia del sistema\n- **Onboarding guides**: guías que guíen al developer a través de una journey\n- **Postmortems**: historias de incidentes con lessons learned narrativas\n- **Release notes**: changelogs que cuenten qué cambió y por qué importa\n\n**No usar para**: documentación puramente referencial (usar evol-doc), documentación de dominio (usar evol-domain).\n\n## Conocimiento de Dominio\n\n### Narrative Structure\n- **Three-act structure**: setup → confrontation → resolution\n- **Hero's journey**: el developer como héroe que supera obstáculos\n- **In medias res**: empezar en el medio de la acción, luego flashbacks\n- **Non-linear narratives**: branches, choose-your-own-adventure para docs\n\n### Technical Storytelling\n- **Problem → Solution → Result**: la estructura más efectiva para tech docs\n- **Before/After**: mostrar el estado antes y después del cambio\n- **Case studies**: historias reales de implementación\n- **Metaphor and analogy**: hacer lo complejo familiar\n\n### Decision Records\n- **Context**: qué estaba pasando, por qué se necesitó decidir\n- **Options**: qué alternativas se consideraron\n- **Decision**: qué se decidió y por qué\n- **Consequences**: qué impacto tuvo la decisión\n\n### Writing Patterns\n- **BLUF (Bottom Line Up Front)**: dar la respuesta primero, contexto después\n- **Pyramid principle**: estructura jerárquica de información\n- **Show, don't tell**: usar ejemplos en vez de descripciones abstractas\n- **Scannable content**: headings, bullets, bold key phrases\n\n### Engagement Mechanics\n- **Curiosity gaps**: plantear preguntas que el lector quiera responder\n- **Progressive disclosure**: información en capas, no todo de golpe\n- **Concrete examples**: ejemplos específicos > descripciones generales\n- **Visual anchoring**: diagrams, code blocks, tables para romper texto\n\n## Flujo de Trabajo\n\n1. **Identificar audiencia**: ¿Para quién es la documentación? (developer, PM, stakeholder)\n2. **Definir el arco narrativo**: ¿Cuál es la historia? (problema → solución → resultado)\n3. **Estructurar con BLUF**: respuesta/decisión primero, contexto después\n4. **Crear curiosity gaps**: plantear preguntas que enganchen al lector\n5. **Agregar ejemplos concretos**: code snippets, diagrams, before/after\n6. **Iterar con progressive disclosure**: información en capas\n7. **Testear con usuario real**: ¿Se entiende? ¿Se usa? ¿Es engaging?\n8. **Mantener viva**: update docs como se updatea código\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: documentar la historia del proyecto, el \"por qué\"\n- **Spec (Fase 2)**: ADRs narrativos, decision records con contexto\n- **Plan (Fase 3)**: documentar el plan como narrative, no solo tasks\n- **Build (Fase 4)**: inline docs que cuenten la historia del código\n- **QA (Fase 5)**: test results como case studies, no solo pass/fail\n- **Retro (Fase 6)**: postmortems narrativos, lessons learned como stories\n\n## Referencia\n\n- Constitución Evol-DD: Art. 4 (readabilidad, modularidad)\n- Art. 7 (docs como parte del producto)\n- Agentes relacionados: evol-doc (technical writing), evol-ux (user-centered docs), evol-architect (architecture docs)\n- Michael Wolfe - \"Writing on Medium\": storytelling patterns\n- Julie Zhuo - \"The Making of a Manager\": communication as storytelling\n- Google Technical Writing Course: https://developers.google.com/tech-writing\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"game-inspired","grupo":"documentacion","disciplina":null,"enBiblioteca":false},{"id":"evol-observability-3e8a9b","nombre":"evol-observability","carpeta":"evol-observability","descripcion":"Telemetry y analytics para sistemas distribuidos. Logging, métricas, tracing, dashboards y OpenTelemetry.","categoria":"transfer","origen":null,"licencia":null,"version":null,"triggers":["/observability"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"transfer","trigger":"/observability"},"archivos":[{"ruta":"SKILL.md","bytes":5196}],"bytes":5196,"huella":"64733160e050a7fc","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (105 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-observability","enlace":false}],"proyectos":[],"texto":"\n# evol-observability\n\n## Cuándo Usar\n\nActivar esta skill cuando se necesita observabilidad en el software:\n\n- **Logging**: structured logs, log levels, correlation IDs\n- **Metrics**: counters, gauges, histograms, SLIs/SLOs/SLAs\n- **Distributed tracing**: traces, spans, service maps\n- **Dashboards**: Grafana, DataDog, visualization best practices\n- **Alerting**: alert rules, escalation, on-call rotations\n- **OpenTelemetry**: vendor-neutral instrumentation\n\n**No usar para**: analytics de negocio (usar evol-data), performance testing (usar evol-balance).\n\n## Conocimiento de Dominio\n\n### Three Pillars of Observability\n- **Logs**: discrete events with context (what happened)\n- **Metrics**: numerical measurements over time (how much/how fast)\n- **Traces**: request flow through distributed systems (where time is spent)\n\n### Structured Logging\n- **JSON format**: parseable, searchable, consistent\n- **Log levels**: ERROR > WARN > INFO > DEBUG > TRACE\n- **Correlation IDs**: trace requests across services\n- **Context enrichment**: add user ID, request ID, service name\n- **Sensitive data**: never log passwords, tokens, PII\n\n### Metrics\n- **Counters**: monotonically increasing (requests, errors)\n- **Gauges**: can go up and down (memory, queue size)\n- **Histograms**: distribution of values (latency, request size)\n- **SLIs**: Service Level Indicators (availability, latency, throughput)\n- **SLOs**: Service Level Objectives (target SLIs)\n- **SLAs**: Service Level Agreements (business commitments)\n\n### Distributed Tracing\n- **Spans**: units of work within a trace\n- **Trace context**: propagated across service boundaries\n- **Service maps**: visual representation of dependencies\n- **Latency analysis**: where time is spent, bottlenecks\n\n### OpenTelemetry\n- **Vendor-neutral**: instrument once, export anywhere\n- **Auto-instrumentation**: libraries for common frameworks\n- **Context propagation**: W3C Trace Context standard\n- **Collector**: receive, process, export telemetry\n\n### Alerting\n- **Alert on symptoms**: what users experience, not causes\n- **Multi-window multi-burn-rate**: SLO-based alerting\n- **Escalation**: who gets paged, when, how\n- **Runbooks**: what to do when alert fires\n\n## Flujo de Trabajo\n\n1. **Define observability goals**: what do we need to know? what questions answer?\n2. **Instrument code**: add logs, metrics, traces to critical paths\n3. **Setup collection**: OpenTelemetry collector, log aggregation\n4. **Create dashboards**: service health, business metrics, SLIs\n5. **Configure alerts**: SLO-based, actionable, with runbooks\n6. **Test observability**: verify logs appear, metrics are correct, traces flow\n7. **Train team**: how to use dashboards, respond to alerts, debug with traces\n8. **Iterate**: add more instrumentation as needed, refine alerts\n\n## Integración con Pipeline\n\n- **Briefing (Fase 1)**: understand what needs to be observable, SLIs/SLOs\n- **Spec (Fase 2)**: document observability requirements, dashboard specs\n- **Plan (Fase 3)**: plan instrumentation effort, tool selection\n- **Build (Fase 4)**: instrument code, setup collection, create dashboards\n- **QA (Fase 5)**: verify observability works, alerts fire correctly\n- **Retro (Fase 6)**: review observability effectiveness, add missing telemetry\n\n## Referencia\n\n- Constitución Evol-DD: Art. 4 (logging, monitoring)\n- Agentes relacionados: evol-devops (infrastructure), evol-sec (security monitoring), evol-data (analytics)\n- Charity Majors - \"Observability Engineering\"\n- OpenTelemetry: https://opentelemetry.io\n- SLO methodology: https://sre.google/sre-book/service-level-objectives\n- Grafana: https://grafana.com\n\n\n## Memory Integration\n\nThis skill integrates with the EDMS (Evol-DD Memory System) for persistent knowledge management.\n\n### Memory Commands\n\nAfter completing the main task, execute these commands to persist knowledge:\n\n```bash\n# Store decisions made during this task\npython3 scripts/evol-memory.py edms-store \"$(cat acuerdos/memoria/decisiones.md)\" --tipo decision\n\n# Extract entities from the work done\npython3 scripts/evol-memory.py edms-extract \"$(cat WORKING-CONTEXT.md)\"\n\n# Create relationships between entities\npython3 scripts/evol-memory.py edms-link \"$(cat WORKING-CONTEXT.md)\"\n\n# Detect any contradictions with existing knowledge\npython3 scripts/evol-memory.py edms-conflicts\n```\n\n### What to Store\n\n- **Decisions**: Architecture choices, design patterns, technology selections\n- **Entities**: Components, services, modules, dependencies\n- **Relationships**: How components interact, data flows, dependencies\n- **Lessons**: What worked, what didn't, improvements for next time\n\n### Memory File Updates\n\nUpdate these files with task-specific knowledge:\n\n1. `acuerdos/memoria/decisiones.md` - Record key decisions\n2. `acuerdos/memoria/convenciones.md` - Update conventions if needed\n3. `acuerdos/memoria/riesgos.md` - Note any new risks identified\n4. `WORKING-CONTEXT.md` - Update with current state\n5. `memoria.md` - Log the activity in the flight recorder\n","cuerpoCompleto":true,"categoriaOriginal":"transfer","grupo":"codigo","disciplina":null,"enBiblioteca":false},{"id":"evol-odd-api-8e8002","nombre":"evol-odd-api","carpeta":"evol-odd-api","descripcion":"OpenAPI-Driven Development. Genera y valida el contrato OpenAPI 3.1 desde SPEC.md, garantizando spec-first y sin breaking changes no planificados.","categoria":"discipline-extended","origen":null,"licencia":null,"version":null,"triggers":["/odd-api"],"cuandoUsarla":[],"compatible":[],"frontmatter":{"category":"discipline-extended","trigger":"/odd-api"},"archivos":[{"ruta":"SKILL.md","bytes":4434}],"bytes":4434,"huella":"3a48f78ad020e1ba","modificado":"2026-10-22T08:40:01.928Z","nueva":false,"propia":true,"fuente":"legado","frontmatterRoto":false,"revision":[{"nivel":"ok","texto":"El frontmatter es YAML válido."},{"nivel":"ok","texto":"name coincide con la carpeta."},{"nivel":"ok","texto":"description clara (146 caracteres)."},{"nivel":"ok","texto":"No se encontraron claves en los archivos."},{"nivel":"ok","texto":"Solo instrucciones: no trae scripts."}],"lugares":[{"fuente":"legado","agente":null,"ruta":"~/Projects/evol-system/skills/evol-odd-api","enlace":false}],"proyectos":[],"texto":"\n# evol-odd-api\n\n## Fase del Pipeline\nSpec (Fase 2)\n\n## Artefacto Clave\n`api/openapi.yaml`\n\n## Flujo de Trabajo\n\n### 1. Derivar contrato desde SPEC.md + DOMAIN.md\n```bash\n# Leer REQ-NNN y dominio para generar schemas\nevol-odd-api derive --spec=docs/specs/SPEC.md --domain=docs/specs/DOMAIN.md --output=api/openapi.yaml\n```\n\n### 2. Validar especificacion OpenAPI\n```bash\n# Validar sintaxis y estructura\nnpx @redocly/cli lint api/openapi.yaml\n\n# Validar contra el estandar OpenAPI 3.1\nnpx openapi-spec-validator api/openapi.yaml\n```\n\n### 3. Detectar breaking changes contra version anterior\n```bash\n# Diff entre version actual y anterior del contrato\nevol-odd-api breaking-check --current=api/openapi.yaml --previous=api/openapi_v1.yaml\n\n# Reporte de cambios para el gate\nevol-odd-api diff-report --current=api/openapi.yaml --previous=api/openapi_v1.yaml --output=.evol/odd-api/diff.json\n```\n\n### 4. Generar fragmentos reutilizables\n```bash\n# Extraer schemas comunes para ahorrar tokens en LLMs\nevol-odd-api fragment --input=api/openapi.yaml --output=api/fragments/\n```\n\n### 5. Generar stubs de servidor y cliente\n```bash\n# Generar stubs desde el contrato\nevol-odd-api stubs --input=api/openapi.yaml --output=src/api/stubs/ --lang=typescript\n```\n\n## Formato Contrato OpenAPI\n\n```yaml\nopenapi: \"3.1.0\"\ninfo:\n  title: \"[Proyecto] API\"\n  version: \"1.0.0\"\n  description: \"Contrato generado desde SPEC.md\"\npaths:\n  /usuarios/{id}:\n    get:\n      operationId: getUsuario\n      parameters:\n        - name: id\n          in: path\n          required: true\n          schema:\n            type: string\n      responses:\n        \"200\":\n          description: \"Usuario encontrado\"\n          content:\n            application/json:\n              schema:\n                $ref: \"#/components/schemas/Usuario\"\n              examples:\n                default:\n                  value:\n                    id: \"usr_001\"\n                    nombre: \"Ana Garcia\"\ncomponents:\n  schemas:\n    Usuario:\n      type: object\n      required: [id, nombre]\n      properties:\n        id:\n          type: string\n        nombre:\n          type: string\n```\n\n## Integracion con Pipeline\n\n| Fase | Uso |\n|------|-----|\n| Spec | Derivar openapi.yaml desde REQ-NNN; validar schema |\n| Plan | Tareas del plan referencian operaciones del contrato |\n| Build | Implementar endpoints contra el contrato; generar stubs |\n| QA | Verificar conformidad servidor v
